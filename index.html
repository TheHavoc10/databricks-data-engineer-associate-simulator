'use strict';
const QUESTIONS=[{"id":1,"topic":"Exam A","question":"A data engineer is working with two tables. Each of these tables is displayed below in its entirety.\n\n\n  sales\n\n\n    customer_id       spend      units\n    a1                28.94      7\n    a3                874.12     23\n    a4                8.99       1\n\n  favorite_stores\n\n\n    customer_id       store_id\n    a1                s1\n    a2                s1\n    a4                s2\n\n  The data engineer runs the following query to join these tables together:\n\n    SELECT\n        sales.customer_id,\n        sales.spend,\n        favorite_stores.store_id\n    FROM sales\n    LEFT JOIN favorite_stores\n    ON sales.customer_id = favorite_stores.customer_id;\n\n  Which of the following will be returned by the above query?","options":[{"key":"A","text":"customer_id       spend      store_id\n\n    a1                28.94      s1\n    a4                8.99       s2"},{"key":"B","text":"customer_id       spend     store_id\n\n    a1                28.94     s1\n    a2                NULL      s1\n    a4                8.99      s2"},{"key":"C","text":"customer_id       spend      store_id\n\n    a1                28.94      s1\n    a3                874.12     NULL\n    a4                8.99       s2"},{"key":"D","text":"customer_id       spend      store_id\n\n    a1                28.94      s1\n    a2                NULL       s1\n    a3                874.12     NULL\n    a4                8.99       s2"}],"correct":["C"],"explanation":"Un LEFT JOIN conserva todas las filas de la tabla de la izquierda. Cuando no existe coincidencia en la derecha, las columnas de esa tabla aparecen como NULL; no se incorpora la fila a2 que solo existe a la derecha.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"Un LEFT JOIN conserva todas las filas de la tabla de la izquierda. Cuando no existe coincidencia en la derecha, las columnas de esa tabla aparecen como NULL; no se incorpora la fila a2 que solo existe a la derecha.","wrongWhy":{"A":"Omite a3, aunque a3 existe en la tabla izquierda sales. Un LEFT JOIN debe conservar esa fila con store_id = NULL.","B":"Incluye a2, que solo está en favorite_stores (lado derecho). LEFT JOIN no añade filas exclusivamente del lado derecho, y además omite a3.","D":"Incluye a2, inexistente en sales. Con LEFT JOIN desde sales solo deben salir a1, a3 y a4."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":2,"topic":"Exam A","question":"Which of the following benefits is provided by the array functions from Spark SQL?","options":[{"key":"A","text":"An ability to work with data in a variety of types at once"},{"key":"B","text":"An ability to work with data within certain partitions and windows"},{"key":"C","text":"An ability to work with time-related data in specified intervals"},{"key":"D","text":"An ability to work with complex, nested data ingested from JSON files"}],"correct":["D"],"explanation":"Las funciones sobre arrays de Spark SQL permiten procesar estructuras anidadas y filtrar elementos con expresiones lambda sin expandir necesariamente todas las filas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"Las funciones sobre arrays de Spark SQL permiten procesar estructuras anidadas y filtrar elementos con expresiones lambda sin expandir necesariamente todas las filas.","wrongWhy":{"A":"Trabajar con tipos diversos no define la ventaja de las funciones array; el beneficio aquí es transformar una colección anidada.","B":"Partitions/windows se implementan con funciones window y OVER; no son funciones de arrays.","C":"Para intervalos se usan funciones de fecha y timestamp, no transformaciones de arrays."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":3,"topic":"Exam A","question":"Which of the following is hosted completely in the control plane of the classic Databricks architecture?","options":[{"key":"A","text":"Worker node"},{"key":"B","text":"JDBC data source"},{"key":"C","text":"Databricks web application"},{"key":"D","text":"Databricks Filesystem"},{"key":"E","text":"Driver node"}],"correct":["C"],"explanation":"En la arquitectura clásica, el control plane alberga la interfaz web, los servicios de gestión y metadatos; el data plane ejecuta el cómputo y accede a los datos. El driver y los workers pertenecen al plano de ejecución.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"En la arquitectura clásica, el control plane alberga la interfaz web, los servicios de gestión y metadatos; el data plane ejecuta el cómputo y accede a los datos. El driver y los workers pertenecen al plano de ejecución.","wrongWhy":{"A":"Los workers ejecutan tareas Spark en el data plane.","B":"La fuente JDBC es externa; no se aloja en el control plane.","D":"DBFS no es por completo una aplicación del control plane.","E":"El driver pertenece al plano de ejecución."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":4,"topic":"Exam A","question":"Which of the following benefits of using the Databricks Lakehouse Platform is provided by Delta Lake?","options":[{"key":"A","text":"The ability to manipulate the same data using a variety of languages"},{"key":"B","text":"The ability to collaborate in real time on a single notebook"},{"key":"C","text":"The ability to set up alerts for query failures"},{"key":"D","text":"The ability to support batch and streaming workloads"},{"key":"E","text":"The ability to distribute complex data operations"}],"correct":["D"],"explanation":"Delta Lake aporta transacciones ACID, esquema y un registro de versiones sobre almacenamiento abierto. Esto permite lecturas y escrituras fiables, recuperación histórica y convivencia de batch y streaming.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Delta Lake aporta transacciones ACID, esquema y un registro de versiones sobre almacenamiento abierto. Esto permite lecturas y escrituras fiables, recuperación histórica y convivencia de batch y streaming.","wrongWhy":{"A":"El acceso multilenguaje lo aporta el runtime/plataforma.","B":"La colaboración es una capacidad del Workspace.","C":"Las alertas son una función de Databricks SQL.","E":"Las operaciones distribuidas las aporta Spark."},"sourceLinks":[{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":5,"topic":"Exam A","question":"Which of the following describes the storage organization of a Delta table?","options":[{"key":"A","text":"Delta tables are stored in a single file that contains data, history, metadata, and other attributes."},{"key":"B","text":"Delta tables store their data in a single file and all metadata in a collection of files in a separate location."},{"key":"C","text":"Delta tables are stored in a collection of files that contain data, history, metadata, and other attributes."},{"key":"D","text":"Delta tables are stored in a collection of files that contain only the data stored within the table."},{"key":"E","text":"Delta tables are stored in a single file that contains only the data stored within the table."}],"correct":["C"],"explanation":"Una tabla Delta combina archivos de datos Parquet con el registro transaccional _delta_log, que almacena metadatos y el historial de cambios.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Una tabla Delta combina archivos de datos Parquet con el registro transaccional _delta_log, que almacena metadatos y el historial de cambios.","wrongWhy":{"A":"Delta no guarda toda la tabla en un único archivo: maneja múltiples Parquet y un directorio _delta_log.","B":"Los datos tampoco se guardan en un único archivo, incluso si el log está separado de los Parquet.","D":"Ignora _delta_log, esencial para la transaccionalidad y el historial Delta.","E":"Delta no se limita a un solo archivo ni almacena únicamente datos."},"sourceLinks":[{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":6,"topic":"Exam A","question":"Which of the following code blocks will remove the rows where the value in column age is greater than 25 from the\n  existing Delta table my_table and save the updated table?","options":[{"key":"A","text":"`SELECT * FROM my_table WHERE age > 25;`"},{"key":"B","text":"`UPDATE my_table WHERE age > 25;`"},{"key":"C","text":"`DELETE FROM my_table WHERE age > 25;`"},{"key":"D","text":"`UPDATE my_table WHERE age <= 25;`"},{"key":"E","text":"`DELETE FROM my_table WHERE age <= 25;`"}],"correct":["C"],"explanation":"DELETE FROM modifica físicamente el estado lógico de la tabla eliminando filas que cumplen la condición. SELECT solo consulta y UPDATE modifica columnas, no elimina filas.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"DELETE FROM modifica físicamente el estado lógico de la tabla eliminando filas que cumplen la condición. SELECT solo consulta y UPDATE modifica columnas, no elimina filas.","wrongWhy":{"A":"SELECT devuelve las filas que cumplen edad >25, pero no cambia la tabla.","B":"UPDATE requiere SET y modifica campos, no borra registros.","D":"UPDATE con ese predicado no borra filas y además selecciona la edad opuesta.","E":"DELETE quitaría registros de hasta 25 años, en vez de mayores de 25."},"sourceLinks":[{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":7,"topic":"Exam A","question":"Which tool is used by Auto Loader to process data incrementally?","options":[{"key":"A","text":"Checkpointing"},{"key":"B","text":"Spark Structured Streaming"},{"key":"C","text":"Databricks SQL"},{"key":"D","text":"Unity Catalog"}],"correct":["B"],"explanation":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","wrongWhy":{"A":"El checkpoint almacena estado y progreso, no es el motor de procesamiento.","C":"Databricks SQL no es el motor específico de Auto Loader.","D":"Unity Catalog administra objetos, acceso y gobierno."},"sourceLinks":[{"label":"Auto Loader","url":"https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/"}]},{"id":8,"topic":"Exam A","question":"Which of the following commands will return the number of null values in the member_id column?","options":[{"key":"A","text":"`SELECT count(member_id) FROM my_table;`"},{"key":"B","text":"`SELECT count(member_id) - count_null(member_id) FROM my_table;`"},{"key":"C","text":"`SELECT count_if(member_id IS NULL) FROM my_table;`"},{"key":"D","text":"`SELECT null(member_id) FROM my_table;`"}],"correct":["C"],"explanation":"COUNT_IF cuenta las filas que cumplen una condición; COUNT(*) cuenta todas las filas y COUNT(columna) excluye los valores NULL.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"COUNT_IF cuenta las filas que cumplen una condición; COUNT(*) cuenta todas las filas y COUNT(columna) excluye los valores NULL.","wrongWhy":{"A":"COUNT(member_id) excluye NULL: cuenta los no nulos.","B":"La función COUNT_NULL no es la sintaxis estándar; usa COUNT_IF(member_id IS NULL) o COUNT(*)-COUNT(member_id).","D":"NULL no es una función SQL que cuente valores nulos."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":9,"topic":"Exam A","question":"Which of the following data lakehouse features results in improved data quality over a traditional data lake?","options":[{"key":"A","text":"A data lakehouse provides storage solutions for structured and unstructured data."},{"key":"B","text":"A data lakehouse supports ACID-compliant transactions."},{"key":"C","text":"A data lakehouse allows the use of SQL queries to examine data."},{"key":"D","text":"A data lakehouse stores data in open formats."},{"key":"E","text":"A data lakehouse enables machine learning and artificial Intelligence workloads."}],"correct":["B"],"explanation":"Delta Lake aporta transacciones ACID, esquema y un registro de versiones sobre almacenamiento abierto. Esto permite lecturas y escrituras fiables, recuperación histórica y convivencia de batch y streaming.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Delta Lake aporta transacciones ACID, esquema y un registro de versiones sobre almacenamiento abierto. Esto permite lecturas y escrituras fiables, recuperación histórica y convivencia de batch y streaming.","wrongWhy":{"A":"Es una ventaja de los data lakes en general, no de las transacciones.","C":"SQL facilita consultar, pero no garantiza consistencia transaccional.","D":"Los formatos abiertos no aseguran atomicidad.","E":"BI/IA son usos posibles, no la garantía de integridad."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":10,"topic":"Exam A","question":"A data engineer wants to create a relational object by pulling data from two tables. The relational object does not need to\n  be used by other data engineers in other sessions. In order to save on storage costs, the data engineer wants to avoid\n  copying and storing physical data.\n\n\n  Which of the following relational objects should the data engineer create?","options":[{"key":"A","text":"Spark SQL Table"},{"key":"B","text":"View"},{"key":"C","text":"Delta Table"},{"key":"D","text":"Temporary view"}],"correct":["D"],"explanation":"Una vista temporal se limita a la sesión y no materializa datos; una tabla persiste los datos para poder ser consultados desde otras sesiones.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"Una vista temporal se limita a la sesión y no materializa datos; una tabla persiste los datos para poder ser consultados desde otras sesiones.","wrongWhy":{"A":"Una tabla guarda datos y genera persistencia innecesaria para una consulta de una sola sesión.","B":"Una vista permanente queda disponible para otras sesiones; el requisito es solo esta sesión.","C":"Una tabla Delta materializa archivos, que el enunciado desea evitar."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":11,"topic":"Exam A","question":"A data engineer has left the organization. The data team needs to transfer ownership of the data engineer’s Delta\n  tables to a new data engineer. The new data engineer is the lead engineer on the data team.\n\n\n  Assuming the original data engineer no longer has access, which of the following individuals must be the one to transfer\n  ownership of the Delta tables in Data Explorer?","options":[{"key":"A","text":"Databricks account representative"},{"key":"B","text":"This transfer is not possible"},{"key":"C","text":"Workspace administrator"},{"key":"D","text":"New lead data engineer"},{"key":"E","text":"Original data engineer"}],"correct":["C"],"explanation":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","wrongWhy":{"A":"Un comercial/representante de cuenta no es un rol de administración de objetos dentro del Workspace.","B":"La propiedad de objetos sí se puede transferir mediante un sujeto con los permisos adecuados.","D":"Ser futuro propietario o team lead no concede automáticamente privilegios para transferir objetos ajenos.","E":"El propietario anterior ya no tiene acceso, por lo que no puede ejecutar el cambio."},"sourceLinks":[{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":12,"topic":"Exam A","question":"A data analyst has created a Delta table sales that is used by the entire data analysis team. They want help from the data\n  engineering team to implement a series of tests to ensure the data is clean. However, the data engineering team uses\n  Python for its tests rather than SQL.\n\n\n  Which of the following commands could the data engineering team use to access sales in PySpark?","options":[{"key":"A","text":"`SELECT * FROM sales`"},{"key":"B","text":"There is no way to share data between PySpark and SQL."},{"key":"C","text":"`spark.sql(\"sales\")`"},{"key":"D","text":"`spark.delta.table(\"sales\")`"},{"key":"E","text":"`spark.table(\"sales\")`"}],"correct":["E"],"explanation":"spark.table(\"sales\") lee directamente una tabla registrada y devuelve un DataFrame. spark.sql(\"sales\") no es una sentencia SQL válida; con spark.sql habría que escribir SELECT * FROM sales.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"La opción E spark.table(\"sales\") lee por nombre una tabla registrada y devuelve un DataFrame PySpark. spark.sql(\"sales\") no es SQL válido; para la alternativa SQL se necesita spark.sql(\"SELECT * FROM sales\").","wrongWhy":{"A":"Es una instrucción SQL, no una llamada que devuelva un DataFrame desde código Python.","B":"PySpark y SQL operan sobre las mismas tablas registradas.","C":"spark.sql(\"sales\") no es una consulta SQL; sería spark.sql(\"SELECT * FROM sales\").","D":"No existe una API estándar spark.delta.table()."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":13,"topic":"Exam A","question":"Which of the following commands will return the location of database customer360?","options":[{"key":"A","text":"`DESCRIBE LOCATION customer360;`"},{"key":"B","text":"`DROP DATABASE customer360;`"},{"key":"C","text":"`DESCRIBE DATABASE customer360;`"},{"key":"D","text":"`ALTER DATABASE customer360 SET DBPROPERTIES ('location' = '/user');`"},{"key":"E","text":"`USE DATABASE customer360;`"}],"correct":["C"],"explanation":"DESCRIBE DATABASE muestra propiedades del esquema/base de datos, incluida su ubicación en los entornos donde se expone. Los valores de ubicación por defecto pueden depender del metastore y del tipo de catálogo.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"DESCRIBE DATABASE muestra propiedades del esquema/base de datos, incluida su ubicación en los entornos donde se expone. Los valores de ubicación por defecto pueden depender del metastore y del tipo de catálogo.","wrongWhy":{"A":"DESCRIBE LOCATION no es la instrucción estándar para inspeccionar una base de datos.","B":"DROP DATABASE borra el objeto, no consulta su ubicación.","D":"ALTER DATABASE modifica propiedades, no consulta la ubicación.","E":"USE DATABASE cambia el contexto activo; no muestra sus metadatos."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":14,"topic":"Exam A","question":"A data engineer wants to create a new table containing the names of customers that live in France. They have written the\n  following command:\n\n    CREATE TABLE customersInFrance\n        AS\n    SELECT id,\n           firstName,\n           lastName,\n    FROM customerLocations\n    WHERE country = 'FRANCE';\n\n  A senior data engineer mentions that it is organization policy to include a table property indicating that the new table\n  includes personally identifiable information (PII). Which of the following lines of code fills in the above blank to\n  successfully complete the task?","options":[{"key":"A","text":"There is no way to indicate whether a table contains PII."},{"key":"B","text":"`\"COMMENT PII\"`"},{"key":"C","text":"`TBLPROPERTIES PII`"},{"key":"D","text":"`COMMENT \"Contains PII\"`"},{"key":"E","text":"`PII`"}],"correct":["D"],"explanation":"COMMENT documenta la tabla en sus metadatos y permite indicar que contiene datos de carácter personal. No sustituye a una política técnica de privacidad.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"COMMENT documenta la tabla en sus metadatos y permite indicar que contiene datos de carácter personal. No sustituye a una política técnica de privacidad.","wrongWhy":{"A":"Se puede documentar metadatos de una tabla, por ejemplo con COMMENT.","B":"No es una expresión COMMENT válida: requiere un texto entrecomillado tras la palabra clave.","C":"TBLPROPERTIES requiere un mapa de propiedades (clave/valor), no la palabra PII sin estructura.","E":"PII por sí solo no es una cláusula SQL válida."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":15,"topic":"Exam A","question":"What is stored in the Databricks customer's cloud account?","options":[{"key":"A","text":"Databricks web application"},{"key":"B","text":"Cluster management metadata"},{"key":"C","text":"Notebooks"},{"key":"D","text":"Data"}],"correct":["D"],"explanation":"En la arquitectura clásica, el control plane alberga la interfaz web, los servicios de gestión y metadatos; el data plane ejecuta el cómputo y accede a los datos. El driver y los workers pertenecen al plano de ejecución.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"En la arquitectura clásica, el control plane alberga la interfaz web, los servicios de gestión y metadatos; el data plane ejecuta el cómputo y accede a los datos. El driver y los workers pertenecen al plano de ejecución.","wrongWhy":{"A":"La aplicación web es gestionada por Databricks en el control plane.","B":"Los metadatos de administración pertenecen a los servicios Databricks, no a los archivos de datos en la cuenta del cliente.","C":"Los notebooks se gestionan desde el Workspace/control plane, no son el dato principal almacenado en la cuenta cloud del cliente."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":16,"topic":"Exam A","question":"Which of the following commands can be used to write data into a Delta table while avoiding the writing of duplicate\n  records?","options":[{"key":"A","text":"DROP"},{"key":"B","text":"IGNORE"},{"key":"C","text":"MERGE"},{"key":"D","text":"APPEND"},{"key":"E","text":"INSERT"}],"correct":["C"],"explanation":"MERGE INTO permite aplicar inserciones, actualizaciones y, con determinadas cláusulas, eliminaciones comparando una fuente con el destino mediante una condición de correspondencia. INSERT INTO únicamente añade filas.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"MERGE INTO permite aplicar inserciones, actualizaciones y, con determinadas cláusulas, eliminaciones comparando una fuente con el destino mediante una condición de correspondencia. INSERT INTO únicamente añade filas.","wrongWhy":{"A":"DROP elimina objetos, no realiza upserts.","B":"IGNORE no es un método general de upsert.","D":"APPEND agrega filas sin cotejar claves.","E":"INSERT añade nuevas filas, sin conciliar existentes."},"sourceLinks":[{"label":"Delta: operaciones MERGE","url":"https://docs.databricks.com/aws/en/delta/merge"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":17,"topic":"Exam A","question":"A data engineer is designing a data pipeline. The source system generates files in a shared directory that is also used by\n  other processes. As a result the files should be kept as is and will accumulate in the directory. The data engineer needs to\n  identify which files are new since the previous run in the pipeline, and set up the pipeline to only ingest those new files\n  with each run.\n\n\n  Which of the following tools can the data engineer use to solve this problem?","options":[{"key":"A","text":"Unity Catalog"},{"key":"B","text":"Delta Lake"},{"key":"C","text":"Databricks SQL"},{"key":"D","text":"Auto Loader"}],"correct":["D"],"explanation":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","wrongWhy":{"A":"Unity Catalog administra gobierno, metadatos y privilegios; no ejecuta la lectura incremental ni sustituye el motor de Spark.","B":"Delta Lake gestiona almacenamiento transaccional y versionado; no descubre por sí solo archivos nuevos ni concede permisos.","C":"Databricks SQL es una experiencia para consultar datos; no sustituye directamente el mecanismo operativo de ingestión/autocarga de archivos."},"sourceLinks":[{"label":"Auto Loader","url":"https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":18,"topic":"Exam A","question":"A data analyst has a series of queries in a SQL program. The data analyst wants this program to run every day. They only\n  want the final query in the program to run on Sundays. They ask for help from the data engineering team to complete this\n  task.\n\n\n  Which of the following approaches could be used by the data engineering team to complete this task?","options":[{"key":"A","text":"They could submit a feature request with Databricks to add this functionality."},{"key":"B","text":"They could wrap the queries using PySpark and use Python's control flow system to determine when to run the final\n\n     query."},{"key":"C","text":"They could only run the entire program on Sundays."},{"key":"D","text":"They could automatically restrict access to the source table in the final query so that it is only accessible on Sundays."},{"key":"E","text":"They could redesign the data model to separate the data used in the final query into a new table."}],"correct":["B"],"explanation":"El control de flujo de Python permite condicionar qué fragmentos se ejecutan. En una función Python hay que declararla con def y devolver el valor con return si se espera un resultado.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"El control de flujo de Python permite condicionar qué fragmentos se ejecutan. En una función Python hay que declararla con def y devolver el valor con return si se espera un resultado.","wrongWhy":{"A":"El caso ya puede resolverse programáticamente con el control de flujo de Python, sin esperar un feature nuevo.","C":"La mayor parte de las consultas deben ejecutarse a diario; detener todo hasta el domingo incumple la frecuencia.","D":"Cambiar permisos sobre datos para forzar un calendario no es un mecanismo adecuado de scheduling.","E":"Rediseñar tablas no sustituye el requisito condicional de ejecución diaria/semanal."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":19,"topic":"Exam A","question":"A data engineer runs a statement every day to copy the previous day's sales into the table transactions. Each day's sales\n  are in their own file in the location \"/transactions/raw\".\n\n\n  Today, the data engineer runs the following command to complete this task:\n\n    COPY INTO transactions\n    FROM \"/transactions/raw\"\n    FILEFORMAT = PARQUET;\n\n  After running the command today, the data engineer notices that the number of records in table transactions has not\n  changed. Which of the following describes why the statement might not have copied any new records into the table?","options":[{"key":"A","text":"The format of the files to be copied were not included with the FORMAT_OPTIONS keyword."},{"key":"B","text":"The names of the files to be copied were not included with the FILES keyword."},{"key":"C","text":"The previous day's file has already been copied into the table."},{"key":"D","text":"The PARQUET file format does not support COPY INTO."},{"key":"E","text":"The COPY INTO statement requires the table to be refreshed to view the copied rows."}],"correct":["C"],"explanation":"COPY INTO recuerda qué archivos ya se han procesado y normalmente no los vuelve a cargar. Las correcciones deben gestionarse como nuevas entradas o mediante un proceso de actualización del destino.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"COPY INTO recuerda qué archivos ya se han procesado y normalmente no los vuelve a cargar. Las correcciones deben gestionarse como nuevas entradas o mediante un proceso de actualización del destino.","wrongWhy":{"A":"FILEFORMAT permite especificar el formato de origen.","B":"FILES es opcional; puede leerse una carpeta completa.","D":"Parquet está soportado por COPY INTO.","E":"No se necesita un REFRESH adicional para que la escritura sea visible."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":20,"topic":"Exam A","question":"In which of the following scenarios should a data engineer use the MERGE INTO command instead of the INSERT INTO\n  command?","options":[{"key":"A","text":"When the location of the data needs to be changed"},{"key":"B","text":"When the target table is an external table"},{"key":"C","text":"When the source is not a Delta table"},{"key":"D","text":"When the target table cannot contain duplicate records"}],"correct":["D"],"explanation":"MERGE INTO permite aplicar inserciones, actualizaciones y, con determinadas cláusulas, eliminaciones comparando una fuente con el destino mediante una condición de correspondencia. INSERT INTO únicamente añade filas.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"MERGE INTO permite aplicar inserciones, actualizaciones y, con determinadas cláusulas, eliminaciones comparando una fuente con el destino mediante una condición de correspondencia. INSERT INTO únicamente añade filas.","wrongWhy":{"A":"Cambiar la ubicación no exige MERGE.","B":"Ser tabla externa no determina el uso de MERGE.","C":"La fuente no Delta, por sí sola, no determina el upsert."},"sourceLinks":[{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"label":"Delta: operaciones MERGE","url":"https://docs.databricks.com/aws/en/delta/merge"}]},{"id":21,"topic":"Exam A","question":"A data engineer needs to create a table in Databricks using data from their organization's existing SQLite database.\n\n\n  They run the following command:\n\n    CREATE TABLE jdbc_customer360\n    USING _____\n    OPTIONS (\n      url \"jdbc:sqlite:/customers.db\",\n      dbtable \"customer360\"\n    )\n\n  Which of the following lines of code fills in the above blank to successfully complete the task?","options":[{"key":"A","text":"`org.apache.spark.sql.jdbc`"},{"key":"B","text":"`autoloader`"},{"key":"C","text":"`org.apache.spark.sql.sqlite`"},{"key":"D","text":"`sqlite`"}],"correct":["A"],"explanation":"El acceso JDBC permite leer bases de datos mediante el conector adecuado; para registrar una tabla gestionada por catálogo se puede escribir el DataFrame con saveAsTable.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"El acceso JDBC permite leer bases de datos mediante el conector adecuado; para registrar una tabla gestionada por catálogo se puede escribir el DataFrame con saveAsTable.","wrongWhy":{"B":"Auto Loader es para archivos en storage, no un driver JDBC SQLite.","C":"No es el nombre de formato JDBC válido para el DataSource de Spark.","D":"Spark necesita el origen JDBC/driver apropiado; USING sqlite no identifica automáticamente un DataSource soportado."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":22,"topic":"Exam A","question":"A data engineer needs access to a table new_table, but they do not have the correct permissions. They can ask the table\n  owner for permission, but they do not know who the table owner is.\n\n  Which of the following approaches can be used to identify the owner of new_table?","options":[{"key":"A","text":"Review the Permissions tab in the table's page in Data Explorer"},{"key":"B","text":"There is no way to identify the owner of the table"},{"key":"C","text":"Review the Owner field in the table's page in Data Explorer"},{"key":"D","text":"Review the Owner field in the table's page in the cloud storage solution"}],"correct":["C"],"explanation":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","wrongWhy":{"A":"La pestaña Permissions muestra grants, pero la pregunta pide directamente el titular del objeto, visible en Owner.","B":"El catálogo sí conserva la identidad del propietario.","D":"La cuenta de almacenamiento no gestiona el propietario lógico de la tabla registrada en Databricks."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"}]},{"id":23,"topic":"Exam A","question":"A data engineer is attempting to drop a Spark SQL table my_table. The data engineer wants to delete all table metadata\n  and data.\n\n\n  They run the following command:\n\n    DROP TABLE IF EXISTS my_table\n\n  While the object no longer appears when they run SHOW TABLES, the data files still exist. Which of the following\n  describes why the data files still exist and the metadata files were deleted?","options":[{"key":"A","text":"The table's data was larger than 10 GB"},{"key":"B","text":"The table's data was smaller than 10 GB"},{"key":"C","text":"The table was external"},{"key":"D","text":"The table did not have a location"},{"key":"E","text":"The table was managed"}],"correct":["C"],"explanation":"Una tabla managed delega en la plataforma el ciclo de vida de datos y metadatos; en una tabla external, los archivos permanecen en la ubicación externa al borrar el registro del catálogo. Las migraciones deben validar dependencias.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Una tabla managed delega en la plataforma el ciclo de vida de datos y metadatos; en una tabla external, los archivos permanecen en la ubicación externa al borrar el registro del catálogo. Las migraciones deben validar dependencias.","wrongWhy":{"A":"DROP TABLE no decide conservar archivos según umbrales de 10 GB.","B":"Tampoco depende de que la tabla pese menos de 10 GB.","D":"Si es managed, la ubicación física puede existir igualmente: la distinción es managed frente a external.","E":"Al borrar una tabla managed normalmente se gestiona también el ciclo de vida de sus datos, no solo metadatos."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":24,"topic":"Exam A","question":"A data engineer wants to create a data entity from a couple of tables. The data entity must be used by other data\n  engineers in other sessions. It also must be saved to a physical location.\n\n\n  Which of the following data entities should the data engineer create?","options":[{"key":"A","text":"Database"},{"key":"B","text":"Function"},{"key":"C","text":"View"},{"key":"D","text":"Temporary view"},{"key":"E","text":"Table"}],"correct":["E"],"explanation":"Una vista temporal se limita a la sesión y no materializa datos; una tabla persiste los datos para poder ser consultados desde otras sesiones.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Una vista temporal se limita a la sesión y no materializa datos; una tabla persiste los datos para poder ser consultados desde otras sesiones.","wrongWhy":{"A":"Una database/schema es contenedor de objetos; no es una entidad tabular con datos materializados.","B":"Una función transforma/retorna valores, no guarda filas consultables.","C":"Una vista no materializada expone una consulta, pero no persiste los datos exigidos.","D":"La vista temporal ni se comparte entre sesiones ni materializa los datos."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":25,"topic":"Exam A","question":"A data engineer is maintaining a data pipeline. Upon data ingestion, the data engineer notices that the source data is\n  starting to have a lower level of quality. The data engineer would like to automate the process of monitoring the quality\n  level.\n\n\n  Which of the following tools can the data engineer use to solve this problem?","options":[{"key":"A","text":"Unity Catalog"},{"key":"B","text":"Data Explorer"},{"key":"C","text":"Delta Lake"},{"key":"D","text":"Delta Live Tables"},{"key":"E","text":"Auto Loader"}],"correct":["D"],"explanation":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","wrongWhy":{"A":"Unity Catalog gobierna acceso, no sustituye las expectations.","B":"Data Explorer descubre objetos, no monitoriza reglas de calidad del flujo.","C":"Delta garantiza transacciones, no define expectations.","E":"Auto Loader ingiere archivos; no es un validador integral."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":26,"topic":"Exam A","question":"A data engineer and data analyst are working together on a data pipeline. The data engineer is working on the raw,\n  bronze, and silver layers of the pipeline using Python, and the data analyst is working on the gold layer of the pipeline\n  using SQL. The raw source of the pipeline is a streaming input. They now want to migrate their pipeline to use Delta Live\n  Tables.\n\n\n  Which of the following changes will need to be made to the pipeline when migrating to Delta Live Tables?","options":[{"key":"A","text":"The pipeline will need to be written entirely in Python"},{"key":"B","text":"The pipeline will need to stop using the medallion-based multi-hop architecture"},{"key":"C","text":"The pipeline will need to be written entirely in SQL"},{"key":"D","text":"The pipeline will need to use a batch source in place of a streaming source"}],"correct":["D"],"explanation":"Lakeflow Spark Declarative Pipelines admite definiciones en SQL y Python, además de fuentes streaming; el cambio obligatorio indicado por la respuesta D del PDF no se deduce del caso.","issue":"La clave D del solucionario parece incompatible con el soporte de SQL, Python y streaming de las canalizaciones declarativas. Se conserva la clave original, pero conviene revisarla.","scorable":true,"category":"Lakeflow / Medallion","answerWhy":"La pregunta está mal planteada: Delta Live Tables (actualmente Lakeflow Spark Declarative Pipelines) admite tanto streaming como batch y fuentes SQL/Python. Ninguna opción es un requisito obligatorio. La hoja marca D, pero es incompatible con la funcionalidad documentada.","wrongWhy":{"A":"No: los pipelines declarativos pueden definirse en SQL o Python.","B":"No: soportan arquitectura Medallion multi-hop.","C":"No: también permiten Python."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":27,"topic":"Exam A","question":"A data engineer has a Job that has a complex run schedule, and they want to transfer that schedule to other Jobs.\n\n\n  Rather than manually selecting each value in the scheduling form in Databricks, which of the following tools can the data\n  engineer use to represent and submit the schedule programmatically?","options":[{"key":"A","text":"`pyspark.sql.types.DateType`"},{"key":"B","text":"`datetime`"},{"key":"C","text":"`pyspark.sql.types.TimestampType`"},{"key":"D","text":"Cron syntax"}],"correct":["D"],"explanation":"Una expresión cron representa calendarios de ejecución de manera reproducible, en lugar de configurar cada campo manualmente en la interfaz.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Una expresión cron representa calendarios de ejecución de manera reproducible, en lugar de configurar cada campo manualmente en la interfaz.","wrongWhy":{"A":"DateType es un tipo de columna Spark, no un planificador.","B":"datetime sirve para manipular fechas en Python, no describe cron reusable del Job.","C":"TimestampType modela timestamps en DataFrames, no expresiones periódicas."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":28,"topic":"Exam A","question":"A data analyst has developed a query that runs against Delta table. They want help from the data engineering team to\n  implement a series of tests to ensure the data returned by the query is clean. However, the data engineering team uses\n  Python for its tests rather than SQL.\n\n\n  Which of the following operations could the data engineering team use to run the query and operate with the results in\n  PySpark?","options":[{"key":"A","text":"`SELECT * FROM sales`"},{"key":"B","text":"`spark.delta.table`"},{"key":"C","text":"`spark.sql`"},{"key":"D","text":"`spark.table`"}],"correct":["C"],"explanation":"spark.table(nombre) obtiene una tabla como DataFrame; spark.sql(consulta) ejecuta una sentencia SQL y devuelve el resultado como DataFrame.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"spark.table(nombre) obtiene una tabla como DataFrame; spark.sql(consulta) ejecuta una sentencia SQL y devuelve el resultado como DataFrame.","wrongWhy":{"A":"SQL puro no ejecuta por sí solo la consulta desde la API Python.","B":"spark.delta.table no es una API estándar.","D":"spark.table lee una tabla por su nombre, pero el enunciado quiere ejecutar una consulta SQL ya escrita."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":29,"topic":"Exam A","question":"A data organization leader is upset about the data analysis team's reports being different from the data engineering\n  team's reports. The leader believes the siloed nature of their organization's data engineering and data analysis\n  architectures is to blame.\n\n\n  Which of the following describes how a data lakehouse could alleviate this issue?","options":[{"key":"A","text":"Both teams would respond more quickly to ad-hoc requests"},{"key":"B","text":"Both teams would use the same source of truth for their work"},{"key":"C","text":"Both teams would reorganize to report to the same department"},{"key":"D","text":"Both teams would be able to collaborate on projects in real-time"}],"correct":["B"],"explanation":"El lakehouse intenta unificar ingeniería y analítica sobre los mismos datos. El uso de tecnologías abiertas ayuda a reducir dependencias de formatos propietarios.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"El lakehouse intenta unificar ingeniería y analítica sobre los mismos datos. El uso de tecnologías abiertas ayuda a reducir dependencias de formatos propietarios.","wrongWhy":{"A":"Puede mejorar la agilidad, pero no garantiza coherencia entre informes con orígenes distintos.","C":"Reorganizar los equipos no elimina silos de datos.","D":"La colaboración en notebooks tampoco unifica automáticamente las fuentes de verdad."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":30,"topic":"Exam A","question":"Which Structured Streaming query is performing a hop from a Silver table to a Gold table?","options":[{"key":"A","text":"(spark.readStream.load(rawSalesLocation)\n\n        .writeStream\n        .option(\"checkpointLocation\", checkpointPath)\n        .outputMode(\"append\")\n        .table(\"newSales\")\n    )"},{"key":"B","text":"(spark.table(\"sales\")\n\n        .withColumn(\"avgPrice\", col(\"sales\") / col(\"units\"))\n        .writeStream\n        .option(\"checkpointLocation\", checkpointPath)\n        .outputMode(\"append\")\n        .table(\"newSales\")\n    )"},{"key":"C","text":"(spark.table(\"sales\")\n\n        .filter(col(\"units\") > 0)\n        .writeStream\n        .option(\"checkpointLocation\", checkpointPath)\n        .outputMode(\"append\")\n        .table(\"newSales\")\n    )"},{"key":"D","text":"(spark.table(\"sales\")\n\n        .groupBy(\"store\")\n        .agg(sum(\"sales\"))\n        .writeStream\n        .option(\"checkpointLocation\", checkpointPath)\n        .outputMode(\"complete\")\n        .table(\"newSales\")\n    )"}],"correct":["D"],"explanation":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","wrongWhy":{"A":"Lee archivos raw y los escribe en una tabla; describe raw→Bronze.","B":"Calcula una columna derivada, más propio de preparación Silver que agregación Gold; el fragmento además usa spark.table con writeStream.","C":"Filtra registros inválidos para limpiar datos, propio de Silver, no agregación Gold."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":31,"topic":"Exam A","question":"A data engineer has configured a Structured Streaming job to read from a table, manipulate the data, and then perform a\n  streaming write into a new table. The code block used by the data engineer is below:\n\n    (spark.table(\"sales\")\n        .withColumn(\"avg_price\", col(\"sales\") / col(\"units\"))\n        .writeStream\n        .option(\"checkpointLocation\", checkpointPath)\n        .outputMode(\"complete\")\n        ._____\n        .table(\"new_sales\")\n    )\n\n  If the data engineer only wants the query to execute a micro-batch to process data every 5 seconds, which of the\n  following lines of code should the data engineer use to fill in the blank?","options":[{"key":"A","text":"`trigger(\"5 seconds\")`"},{"key":"B","text":"`trigger()`"},{"key":"C","text":"`trigger(once=\"5 seconds\")`"},{"key":"D","text":"`trigger(processingTime=\"5 seconds\")`"},{"key":"E","text":"`trigger(continuous=\"5 seconds\")`"}],"correct":["D"],"explanation":"Los triggers de Structured Streaming controlan cuándo se disparan los microbatches. processingTime define una frecuencia; availableNow procesa los datos disponibles y finaliza.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Los triggers de Structured Streaming controlan cuándo se disparan los microbatches. processingTime define una frecuencia; availableNow procesa los datos disponibles y finaliza.","wrongWhy":{"A":"trigger(\"5 seconds\") no es la firma estándar de Structured Streaming para microbatches temporizados.","B":"trigger() sin opciones no fija la frecuencia de 5 segundos.","C":"once espera un booleano de ejecución única; no una frecuencia expresada en segundos.","E":"continuous expresa procesamiento continuo y exige configuración diferente; no es el microbatch processingTime solicitado."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":32,"topic":"Exam A","question":"A dataset has been defined using Delta Live Tables and includes an expectations clause:\n\n\n  `CONSTRAINT valid_timestamp EXPECT (timestamp > '2020-01-01') ON VIOLATION DROP ROW`\n\n\n  What is the expected behavior when a batch of data containing data that violates these constraints is processed?","options":[{"key":"A","text":"Records that violate the expectation are dropped from the target dataset and loaded into a quarantine table."},{"key":"B","text":"Records that violate the expectation are added to the target dataset and flagged as invalid in a field added to the\n\n     target dataset."},{"key":"C","text":"Records that violate the expectation are dropped from the target dataset and recorded as invalid in the event log."},{"key":"D","text":"Records that violate the expectation are added to the target dataset and recorded as invalid in the event log."},{"key":"E","text":"Records that violate the expectation cause the job to fail."}],"correct":["C"],"explanation":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","wrongWhy":{"A":"DROP ROW descarta, pero no crea automáticamente tabla de cuarentena.","B":"No inserta filas inválidas ni añade una columna de estado por sí mismo.","D":"La opción D corresponde al comportamiento WARN, no DROP ROW.","E":"FAIL UPDATE sería otra política de expectation; aquí se pidió DROP ROW."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":33,"topic":"Exam A","question":"Which of the following describes when to use the CREATE STREAMING LIVE TABLE (formerly CREATE INCREMENTAL LIVE\n  TABLE) syntax over the CREATE LIVE TABLE syntax when creating Delta Live Tables (DLT) tables using SQL?","options":[{"key":"A","text":"CREATE STREAMING LIVE TABLE should be used when the subsequent step in the DLT pipeline is static."},{"key":"B","text":"CREATE STREAMING LIVE TABLE should be used when data needs to be processed incrementally."},{"key":"C","text":"CREATE STREAMING LIVE TABLE is redundant for DLT and it does not need to be used."},{"key":"D","text":"CREATE STREAMING LIVE TABLE should be used when data needs to be processed through complicated aggregations."},{"key":"E","text":"CREATE STREAMING LIVE TABLE should be used when the previous step in the DLT pipeline is static."}],"correct":["B"],"explanation":"Las tablas de streaming procesan cambios incrementalmente; el modo continuo mantiene el pipeline activo mientras que el modo triggered realiza una actualización y se detiene.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Las tablas de streaming procesan cambios incrementalmente; el modo continuo mantiene el pipeline activo mientras que el modo triggered realiza una actualización y se detiene.","wrongWhy":{"A":"Que la siguiente capa sea estática no determina la naturaleza incremental de la tabla que creas.","C":"La sintaxis streaming sí cambia el modelo incremental y no es redundante.","D":"Las agregaciones complicadas no son el criterio para elegir STREAMING TABLE.","E":"La condición de la etapa anterior estática tampoco define si quieres procesar esta tabla incrementalmente."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":34,"topic":"Exam A","question":"A data engineer has joined an existing project and they see the following query in the project repository:\n\n    CREATE STREAMING LIVE TABLE loyal_customers AS\n    SELECT customer_id\n    FROM STREAM(LIVE.customers)\n    WHERE loyalty_level = 'high';\n\n  Which of the following describes why the STREAM function is included in the query?","options":[{"key":"A","text":"The STREAM function is not needed and will cause an error."},{"key":"B","text":"The data in the customers table has been updated since its last run."},{"key":"C","text":"The customers table is a streaming live table."},{"key":"D","text":"The customers table is a reference to a Structured Streaming query on a PySpark DataFrame."}],"correct":["C"],"explanation":"Las tablas de streaming procesan cambios incrementalmente; el modo continuo mantiene el pipeline activo mientras que el modo triggered realiza una actualización y se detiene.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Las tablas de streaming procesan cambios incrementalmente; el modo continuo mantiene el pipeline activo mientras que el modo triggered realiza una actualización y se detiene.","wrongWhy":{"A":"STREAM es necesario si la definición quiere leer incrementos en vez de leer estáticamente.","B":"No significa que haya cambiado; expresa el modo de lectura de los datos nuevos.","D":"STREAM no hace referencia necesariamente a un DataFrame PySpark preexistente."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":35,"topic":"Exam A","question":"How can Git operations must be performed outside of Databricks Repos?","options":[{"key":"A","text":"Commit"},{"key":"B","text":"Pull"},{"key":"C","text":"Merge"},{"key":"D","text":"Clone"}],"correct":["C"],"explanation":"Git Pull incorpora cambios remotos; Commit registra cambios locales y los branches permiten desarrollar versiones paralelas. Algunas operaciones de Git se gestionan en el proveedor remoto.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Git Pull incorpora cambios remotos; Commit registra cambios locales y los branches permiten desarrollar versiones paralelas. Algunas operaciones de Git se gestionan en el proveedor remoto.","wrongWhy":{"A":"Commit puede hacerse desde funciones Git integradas (según experiencia).","B":"Pull está disponible en Git folders/Repos.","D":"Clone puede realizarse dentro del workspace para conectar el repo."},"sourceLinks":[{"label":"Delta: operaciones MERGE","url":"https://docs.databricks.com/aws/en/delta/merge"}]},{"id":36,"topic":"Exam A","question":"A data engineer has three tables in a Delta Live Tables (DLT) pipeline. They have configured the pipeline to drop invalid\n  records at each table. They notice that some data is being dropped due to quality concerns at some point in the DLT\n  pipeline. They would like to determine at which table in their pipeline the data is being dropped.\n\n\n  Which of the following approaches can the data engineer take to identify the table that is dropping the records?","options":[{"key":"A","text":"They can set up separate expectations for each table when developing their DLT pipeline."},{"key":"B","text":"They cannot determine which table is dropping the records."},{"key":"C","text":"They can set up DLT to notify them via email when records are dropped."},{"key":"D","text":"They can navigate to the DLT pipeline page, click on each table, and view the data quality statistics."},{"key":"E","text":"They can navigate to the DLT pipeline page, click on the “Error” button, and review the present errors."}],"correct":["D"],"explanation":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","wrongWhy":{"A":"Definir expectations por tabla es útil, pero no revela en cuál se descartaron filas hasta consultar estadísticas de calidad.","B":"Sí es posible identificarlo: cada dataset del pipeline ofrece estadísticas y eventos de expectativas.","C":"Configurar emails no identifica la etapa sin revisar métricas de cada dataset.","E":"Los descartes por expectativas pueden ser una ejecución correcta y no aparecen necesariamente como errores de pipeline; consulta data quality metrics."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":37,"topic":"Exam A","question":"A data engineer has a single-task Job that runs each morning before they begin working. After identifying an upstream\n  data issue, they need to set up another task to run a new notebook prior to the original task.\n\n\n  Which of the following approaches can the data engineer use to set up the new task?","options":[{"key":"A","text":"They can clone the existing task in the existing Job and update it to run the new notebook."},{"key":"B","text":"They can create a new task in the existing Job and then add it as a dependency of the original task."},{"key":"C","text":"They can create a new task in the existing Job and then add the original task as a dependency of the new task."},{"key":"D","text":"They can create a new job from scratch and add both tasks to run concurrently."},{"key":"E","text":"They can clone the existing task to a new Job and then edit it to run the new notebook."}],"correct":["B"],"explanation":"Lakeflow Jobs representa las tareas como un DAG. Las dependencias aseguran que una tarea se ejecute tras cumplir las condiciones de las anteriores, incluso con bifurcaciones paralelas y fan-in.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Lakeflow Jobs representa las tareas como un DAG. Las dependencias aseguran que una tarea se ejecute tras cumplir las condiciones de las anteriores, incluso con bifurcaciones paralelas y fan-in.","wrongWhy":{"A":"Clonar sin configurar la dependencia no garantiza que el nuevo notebook preceda al original.","C":"Eso haría depender la tarea nueva de la original; invertiría el orden solicitado.","D":"La ejecución concurrente no asegura el tratamiento previo del problema de origen.","E":"Clone crea una nueva copia local; no actualiza una copia existente con commits recientes."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":38,"topic":"Exam A","question":"An engineering manager wants to monitor the performance of a recent project using a Databricks SQL query. For the first\n  week following the project's release, the manager wants the query results to be updated every minute. However, the\n  manager is concerned that the compute resources used for the query will be left running and cost the organization a lot of\n  money beyond the first week of the project's release.\n\n\n  Which of the following approaches can the engineering team use to ensure the query does not cost the organization any\n  money beyond the first week of the project's release?","options":[{"key":"A","text":"They can set a limit to the number of DBUs that are consumed by the SQL Endpoint."},{"key":"B","text":"They can set the query's refresh schedule to end after a certain number of refreshes."},{"key":"C","text":"They cannot ensure the query does not cost the organization money beyond the first week of the project's release."},{"key":"D","text":"They can set a limit to the number of individuals that are able to manage the query's refresh schedule."},{"key":"E","text":"They can set the query's refresh schedule to end on a certain date in the query scheduler."}],"correct":["E"],"explanation":"Los schedules controlan cuándo refrescar consultas o dashboards; Auto Stop reduce costes deteniendo compute inactivo. Para limitar ejecuciones hay que configurar correctamente las fechas de fin.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Los schedules controlan cuándo refrescar consultas o dashboards; Auto Stop reduce costes deteniendo compute inactivo. Para limitar ejecuciones hay que configurar correctamente las fechas de fin.","wrongWhy":{"A":"Limitar DBUs no programa cuándo debe detenerse una consulta.","B":"Contar ejecuciones no equivale a fijar una fecha final concreta, y puede variar por fallos/omisiones.","C":"El scheduler permite fijar fechas de fin: sí existe una forma de evitar la continuidad de ese schedule.","D":"El número de administradores no detiene automáticamente ejecuciones."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":39,"topic":"Exam A","question":"A data engineering team has two tables. The first table march_transactions is a collection of all retail transactions in the\n  month of March. The second table april_transactions is a collection of all retail transactions in the month of April. There\n  are no duplicate records between the tables.\n\n\n  Which of the following commands should be run to create a new table all_transactions that contains all records from\n  march_transactions and april_transactions without duplicate records?","options":[{"key":"A","text":"`CREATE TABLE all_transactions AS SELECT * FROM march_transactions INNER JOIN SELECT * FROM\n\n     april_transactions;`"},{"key":"B","text":"`CREATE TABLE all_transactions AS SELECT * FROM march_transactions UNION SELECT * FROM april_transactions;`"},{"key":"C","text":"`CREATE TABLE all_transactions AS SELECT * FROM march_transactions OUTER JOIN SELECT * FROM\n\n     april_transactions;`"},{"key":"D","text":"`CREATE TABLE all_transactions AS SELECT * FROM march_transactions INTERSECT SELECT * from april_transactions;`"}],"correct":["B"],"explanation":"UNION combina resultados eliminando duplicados. UNION ALL conservaría posibles filas repetidas.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"UNION combina resultados eliminando duplicados. UNION ALL conservaría posibles filas repetidas.","wrongWhy":{"A":"Un INNER JOIN une por condición, no apila filas.","C":"OUTER JOIN también requiere una condición de unión.","D":"INTERSECT devuelve intersecciones, no todas las filas."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":40,"topic":"Exam A","question":"A data engineer wants to schedule their Databricks SQL dashboard to refresh once per day, but they only want the\n  associated SQL endpoint to be running when it is necessary.\n\n  Which of the following approaches can the data engineer use to minimize the total running time of the SQL endpoint used\n  in the refresh schedule of their dashboard?","options":[{"key":"A","text":"They can ensure the dashboard's SQL endpoint matches each of the queries' SQL endpoints."},{"key":"B","text":"They can set up the dashboard's SQL endpoint to be serverless."},{"key":"C","text":"They can turn on the Auto Stop feature for the SQL endpoint."},{"key":"D","text":"They can reduce the cluster size of the SQL endpoint."},{"key":"E","text":"They can ensure the dashboard's SQL endpoint is not one of the included query's SQL endpoint."}],"correct":["C"],"explanation":"Los schedules controlan cuándo refrescar consultas o dashboards; Auto Stop reduce costes deteniendo compute inactivo. Para limitar ejecuciones hay que configurar correctamente las fechas de fin.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Los schedules controlan cuándo refrescar consultas o dashboards; Auto Stop reduce costes deteniendo compute inactivo. Para limitar ejecuciones hay que configurar correctamente las fechas de fin.","wrongWhy":{"A":"Coincidir con otros endpoints no implica que el cómputo se apague cuando no hay solicitudes.","B":"Serverless simplifica gestión y escala, pero la pregunta pide específicamente minimizar tiempo activo del endpoint configurado.","D":"Menos tamaño no implica menos horas activo.","E":"Separar endpoints puede aumentar el compute utilizado en vez de garantizar apagado."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":41,"topic":"Exam A","question":"In which of the following scenarios should a data engineer select a Task in the Depends On field of a new Databricks Job\n  Task?","options":[{"key":"A","text":"When another task needs to be replaced by the new task"},{"key":"B","text":"When another task needs to successfully complete before the new task begins"},{"key":"C","text":"When another task has the same dependency libraries as the new task"},{"key":"D","text":"When another task needs to use as little compute resources as possible"}],"correct":["B"],"explanation":"Lakeflow Jobs representa las tareas como un DAG. Las dependencias aseguran que una tarea se ejecute tras cumplir las condiciones de las anteriores, incluso con bifurcaciones paralelas y fan-in.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Lakeflow Jobs representa las tareas como un DAG. Las dependencias aseguran que una tarea se ejecute tras cumplir las condiciones de las anteriores, incluso con bifurcaciones paralelas y fan-in.","wrongWhy":{"A":"Depends On no sustituye tareas, declara prerequisitos de ejecución.","C":"Compartir librerías no crea dependencia funcional ni cronológica.","D":"El uso de compute no determina la relación Depends On."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":42,"topic":"Exam A","question":"Which of the following must be specified when creating a new Delta Live Tables pipeline?","options":[{"key":"A","text":"A key-value pair configuration"},{"key":"B","text":"At least one notebook library to be executed"},{"key":"C","text":"A path to cloud storage location for the written data"},{"key":"D","text":"A location of a target database for the written data"}],"correct":["B"],"explanation":"Un pipeline declarativo necesita una fuente de definiciones (notebook o archivos) desde la que interpretar los datasets; la creación desde la UI solicita dicha referencia en experiencias clásicas.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Un pipeline declarativo necesita una fuente de definiciones (notebook o archivos) desde la que interpretar los datasets; la creación desde la UI solicita dicha referencia en experiencias clásicas.","wrongWhy":{"A":"La configuración clave/valor puede ser opcional y no basta como definición de tablas.","C":"Con storage gestionado no siempre hace falta un path de salida explícito.","D":"La base/catálogo de destino puede inferirse o configurarse, no sustituye el código fuente del pipeline."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":43,"topic":"Exam A","question":"A data engineer has a Job with multiple tasks that runs nightly. Each of the tasks runs slowly because the clusters take a\n  long time to start.\n\n\n  Which of the following actions can the data engineer perform to improve the start up time for the clusters used for the\n  Job?","options":[{"key":"A","text":"They can use endpoints available in Databricks SQL"},{"key":"B","text":"They can use jobs clusters instead of all-purpose clusters"},{"key":"C","text":"They can configure the clusters to be single-node"},{"key":"D","text":"They can use clusters that are from a cluster pool"},{"key":"E","text":"They can configure the clusters to autoscale for larger data sizes"}],"correct":["D"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"A":"SQL endpoints no aceleran directamente el arranque de clusters Spark de un Job.","B":"Los job clusters también se aprovisionan y pueden tardar en arrancar.","C":"Un solo nodo puede seguir tardando en aprovisionar y sacrificar paralelismo.","E":"Autoscaling se aplica durante carga, no elimina por sí mismo la latencia inicial."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":44,"topic":"Exam A","question":"A new data engineering team team. has been assigned to an ELT project. The new data engineering team will need full\n  privileges on the database customers to fully manage the project.\n\n\n  Which of the following commands can be used to grant full permissions on the database to the new data engineering\n  team?","options":[{"key":"A","text":"`GRANT USAGE ON DATABASE customers TO team;`"},{"key":"B","text":"`GRANT ALL PRIVILEGES ON DATABASE team TO customers;`"},{"key":"C","text":"`GRANT SELECT PRIVILEGES ON DATABASE customers TO teams;`"},{"key":"D","text":"`GRANT SELECT CREATE MODIFY USAGE PRIVILEGES ON DATABASE customers TO team;`"},{"key":"E","text":"`GRANT ALL PRIVILEGES ON DATABASE customers TO team;`"}],"correct":["E"],"explanation":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","wrongWhy":{"A":"USAGE permite navegar pero no administrar todos los objetos.","B":"Los nombres de principal/objeto están invertidos y no es el grant correcto.","C":"SELECT solo lectura y no concede gestión total.","D":"La combinación no sustituye el grant ALL PRIVILEGES del ejemplo y la sintaxis puede ser inválida."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"}]},{"id":45,"topic":"Exam A","question":"A new data engineering team has been assigned to work on a project. The team will need access to database customers in\n  order to see what tables already exist. The team has its own group team.\n\n\n  Which of the following commands can be used to grant the necessary permission on the entire database to the new\n  team?","options":[{"key":"A","text":"`GRANT VIEW ON CATALOG customers TO team;`"},{"key":"B","text":"`GRANT CREATE ON DATABASE customers TO team;`"},{"key":"C","text":"`GRANT USAGE ON CATALOG team TO customers;`"},{"key":"D","text":"`GRANT CREATE ON DATABASE team TO customers;`"},{"key":"E","text":"`GRANT USAGE ON DATABASE customers TO team;`"}],"correct":["E"],"explanation":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","wrongWhy":{"A":"VIEW sobre CATALOG no es el permiso USAGE de la base solicitado.","B":"CREATE autoriza crear objetos, no es requisito para simplemente verlos.","C":"El grupo y el catálogo aparecen invertidos.","D":"También invierte destinatario y objeto, y CREATE excede lectura."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"}]},{"id":46,"topic":"Exam A","question":"A data engineer is running code in a Databricks Repo that is cloned from a central Git repository. A colleague of the data\n  engineer informs them that changes have been made and synced to the central Git repository. The data engineer now\n  needs to sync their Databricks Repo to get the changes from the central Git repository.\n\n\n  Which of the following Git operations does the data engineer need to run to accomplish this task?","options":[{"key":"A","text":"Merge"},{"key":"B","text":"Push"},{"key":"C","text":"Pull"},{"key":"D","text":"Commit"},{"key":"E","text":"Clone"}],"correct":["C"],"explanation":"Git Pull incorpora cambios remotos; Commit registra cambios locales y los branches permiten desarrollar versiones paralelas. Algunas operaciones de Git se gestionan en el proveedor remoto.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Git Pull incorpora cambios remotos; Commit registra cambios locales y los branches permiten desarrollar versiones paralelas. Algunas operaciones de Git se gestionan en el proveedor remoto.","wrongWhy":{"A":"Merge integra ramas pero primero hay que descargar lo publicado en remoto.","B":"Push envía commits locales, no descarga cambios.","D":"Commit registra cambios locales.","E":"Clone crearía otra copia, no actualizaría la existente."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":47,"topic":"Exam A","question":"Which of the following is a benefit of the Databricks Lakehouse Platform embracing open source technologies?","options":[{"key":"A","text":"Cloud-specific integrations"},{"key":"B","text":"Simplified governance"},{"key":"C","text":"Ability to scale storage"},{"key":"D","text":"Ability to scale workloads"},{"key":"E","text":"Avoiding vendor lock-in"}],"correct":["E"],"explanation":"El lakehouse intenta unificar ingeniería y analítica sobre los mismos datos. El uso de tecnologías abiertas ayuda a reducir dependencias de formatos propietarios.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"El lakehouse intenta unificar ingeniería y analítica sobre los mismos datos. El uso de tecnologías abiertas ayuda a reducir dependencias de formatos propietarios.","wrongWhy":{"A":"Las integraciones atadas a una nube no describen la portabilidad del código abierto.","B":"El gobierno exige herramientas adicionales; no es el motivo principal de adoptar formatos abiertos.","C":"Escalar storage depende de la infraestructura cloud, no directamente de apertura del formato.","D":"Escalar procesamiento depende del motor, no directamente de estándares abiertos."},"sourceLinks":[{"label":"Delta Sharing","url":"https://docs.databricks.com/aws/en/delta-sharing/"}]},{"id":48,"topic":"Exam A","question":"A data engineer only wants to execute the final block of a Python program if the Python variable day_of_week is equal to\n  1 and the Python variable review_period is True.\n\n\n  Which of the following control flow statements should the data engineer use to begin this conditionally executed code\n  block?","options":[{"key":"A","text":"if day_of_week = 1 and review_period:"},{"key":"B","text":"if day_of_week = 1 and review_period == \"True\":"},{"key":"C","text":"if day_of_week = 1 & review_period = \"True\":"},{"key":"D","text":"if day_of_week == 1 and review_period:"}],"correct":["D"],"explanation":"El control de flujo de Python permite condicionar qué fragmentos se ejecutan. En una función Python hay que declararla con def y devolver el valor con return si se espera un resultado.","issue":null,"scorable"
