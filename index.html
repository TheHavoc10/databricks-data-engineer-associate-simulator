icks\n\n     runtime and Unity Catalog"},{"key":"D","text":"Low frequency BI Dashboarding and Adhoc SQL Analytics"}],"correct":["B"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"A":"Ingesta legacy muy personalizada puede tener restricciones y dependencia de runtimes incompatibles con serverless.","C":"El soporte de Scala en serverless no equivale al de cargas Python de este escenario/versión.","D":"BI es otra carga/servicio SQL; no es migración directa del pipeline Python existente."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":193,"topic":"Exam A","question":"A data engineering project involves processing large batches of data on a daily schedule using ETL. The jobs are resource-\n  intensive and vary in size, requiring a scalable, cost-efficient compute solution that can automatically scale based on the\n  workload.\n\n\n  Which compute approach will satisfy the needs described?","options":[{"key":"A","text":"Job Cluster"},{"key":"B","text":"Dedicated Cluster"},{"key":"C","text":"All-Purpose Cluster"},{"key":"D","text":"Databricks SQL Serverless"}],"correct":["A"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"B":"Un cluster dedicado siempre activo añade coste ocioso.","C":"All-purpose se orienta a trabajo interactivo, no job batch programado.","D":"SQL Serverless no es compute Spark general para ETL intensivo de notebooks."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":194,"topic":"Exam A","question":"A data engineer is configuring Delta Sharing for a multi-team project where teams from different departments will need to\n  access shared data. The data engineer has successfully created a Unity Catalog metastore and is now setting up the Delta\n  Share. The goal is to ensure that internal teams can access the shared data with full permissions, while external partners\n  can only read the data.\n\n\n  Which action should the Data Engineer take to configure the sharing correctly?","options":[{"key":"A","text":"Create a Delta Share, set up a secure access URL for internal teams and external partners, and distribute the URL to\n\n     provide them access to the shared data."},{"key":"B","text":"Create a Delta Share, add the internal team's tables and views, and assign READ/WRITE permissions to both external\n\n     partners and internal teams."},{"key":"C","text":"Assign READ permissions to external partners through the Delta Share and READ/WRITE permissions to internal\n\n     teams, and ensure the correct tables and views are shared."},{"key":"D","text":"Grant READ permissions to external partners and READ/WRITE permissions to internal teams through the Delta\n\n     Share."}],"correct":["C"],"explanation":"Delta Sharing ofrece intercambio de datos con otras organizaciones/plataformas, con protocolos y permisos adecuados. Las transferencias entre regiones y nubes pueden generar costes de salida de datos.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"Delta Sharing ofrece intercambio de datos con otras organizaciones/plataformas, con protocolos y permisos adecuados. Las transferencias entre regiones y nubes pueden generar costes de salida de datos.","wrongWhy":{"A":"Una URL no concede escritura interna ni gobierno detallado; sharing es lectura gobernada.","B":"Delta Sharing externo no debe exponer MODIFY a destinatarios; es lectura.","D":"El share por sí solo no resuelve permisos internos de escritura sobre los datos originales."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Delta Sharing","url":"https://docs.databricks.com/aws/en/delta-sharing/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":195,"topic":"Exam A","question":"A data engineer manages multiple external tables linked to various data sources. The data engineer wants to manage\n  these external tables efficiently and ensure that only the necessary permissions are granted to users for accessing specific\n  external tables.\n\n  How should the data engineer manage access to these external tables?","options":[{"key":"A","text":"Set up Azure Blob Storage permissions at the container level, allowing access to all external tables."},{"key":"B","text":"Create a single user role with full access to all external tables and assign it to all users."},{"key":"C","text":"Grant permissions on the Databricks workspace level, which will automatically apply to all external tables."},{"key":"D","text":"Use Unity Catalog to manage access controls and permissions for each external table individually."}],"correct":["D"],"explanation":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","wrongWhy":{"A":"ACL de contenedor físico suele ser demasiado amplia para permisos tabla a tabla.","B":"Un rol con acceso global incumple least privilege.","C":"Los permisos del workspace no sustituyen permisos por tabla en UC."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"}]},{"id":196,"topic":"Exam A","question":"An organization plans to share a large dataset stored in a Databricks workspace on AWS with a partner organization whose\n  Databricks workspace is hosted on Azure. The data engineer wants to minimize data transfer costs while ensuring secure\n  and efficient data sharing.\n\n\n  Which strategy will reduce data egress costs associated with cross-cloud data sharing?","options":[{"key":"A","text":"Migrating the dataset to Cloudflare R2 object storage before sharing"},{"key":"B","text":"Configure VPN connection between AWS and Azure for faster data sharing"},{"key":"C","text":"Using Delta Sharing without any additional configurations"},{"key":"D","text":"Sharing data via pre-signed URLs without monitoring egress costs"}],"correct":["C"],"explanation":"Delta Sharing ofrece intercambio de datos con otras organizaciones/plataformas, con protocolos y permisos adecuados. Las transferencias entre regiones y nubes pueden generar costes de salida de datos.","issue":"El solucionario elige Delta Sharing sin configuración adicional para reducir costes egress; Delta Sharing por sí solo no garantiza reducir los costes de transferencia entre nubes.","scorable":true,"category":"Gobierno / Sharing","answerWhy":"El PDF marca Delta Sharing sin configuraciones, pero el uso de Delta Sharing no suprime automáticamente los costes de egress entre AWS y Azure. Debe evaluarse la ubicación de datos y el contrato de red.","wrongWhy":{"A":"Mover primero a Cloudflare R2 podría alterar egress según costes/arquitectura, pero no es recomendación universal ni está garantizada.","B":"Una VPN puede securizar tráfico, no eliminar cargos de transferencia.","D":"URL firmadas sin vigilar egress no resuelven los costes de tráfico."},"sourceLinks":[{"label":"Delta Sharing","url":"https://docs.databricks.com/aws/en/delta-sharing/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":197,"topic":"Exam A","question":"A data engineer is setting up access control in Unity Catalog and needs to ensure that a group of data analysts can query\n  tables but not modify data.\n\n\n  Which permission should the data engineer grant to the data analysts?","options":[{"key":"A","text":"ALL PRIVILEGES"},{"key":"B","text":"MODIFY"},{"key":"C","text":"SELECT"},{"key":"D","text":"INSERT"}],"correct":["C"],"explanation":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","wrongWhy":{"A":"ALL PRIVILEGES excede el principio de mínimo privilegio.","B":"MODIFY permite modificar datos.","D":"INSERT permite escribir filas."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":198,"topic":"Exam A","question":"What Databricks feature can be used to check the data sources and tables used in a workspace?","options":[{"key":"A","text":"Use the lineage feature to visualize a graph that highlights where the table is used only in reports."},{"key":"B","text":"Use the lineage feature to visualize a graph that highlights where the table is used only in notebooks."},{"key":"C","text":"Use the lineage feature to visualize a graph that shows all dependencies, including where the table is used in\n\n     notebooks, other tables, and reports."},{"key":"D","text":"Do not use the lineage feature as it only tracks activity from the last 3 months and will not provide full details on\n\n     dependencies."}],"correct":["C"],"explanation":"Unity Catalog lineage representa gráficamente relaciones de dependencia entre tablas, notebooks y otros consumidores, proporcionando trazabilidad de los datos.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"Unity Catalog lineage representa gráficamente relaciones de dependencia entre tablas, notebooks y otros consumidores, proporcionando trazabilidad de los datos.","wrongWhy":{"A":"No se limita el lineage a informes únicamente.","B":"Tampoco solo a notebooks; incluye tablas y otros consumidores.","D":"No se descarta lineage por un supuesto límite fijo de tres meses."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":199,"topic":"Exam A","question":"A data engineer is getting a partner organization up to speed with Databricks account. Both the teams share some\n  business use cases. The data engineer has to share some of your Unity-Catalog managed delta tables and the notebook\n  jobs creating those tables with the partner organization.\n\n\n  How can the data engineer seamlessly share the required information?","options":[{"key":"A","text":"Zip all the code and share via email and allow data ingestion from your data lake"},{"key":"B","text":"Share required datasets and notebooks via Delta Sharing. Manage permissions via Unity Catalog."},{"key":"C","text":"Data and Notebooks can be shared simply using Unity Catalog."},{"key":"D","text":"Share access to codebase via Github and allow them to ingest datasets from your Datalake."}],"correct":["B"],"explanation":"Delta Sharing ofrece intercambio de datos con otras organizaciones/plataformas, con protocolos y permisos adecuados. Las transferencias entre regiones y nubes pueden generar costes de salida de datos.","issue":"La documentación reciente de OpenSharing incluye notebooks como activo compartible. Este enunciado añade jobs como recurso compartido y puede mezclar mecanismos/versiones; verifica el alcance exacto antes de memorizar la clave.","scorable":true,"category":"Gobierno / Sharing","answerWhy":"El PDF propone Delta Sharing para notebooks/jobs, pero ese mecanismo se centra en compartir activos de datos. El código y los workflows requieren su propio mecanismo (Git, bundles, permisos), según la versión y servicio.","wrongWhy":{"A":"Correo con ZIP y acceso a lake no es compartir datos gobernados de forma segura.","C":"UC gobierna objetos, pero no es un mecanismo completo para compartir código/jobs inter-organización.","D":"Git comparte código, pero no hace por sí solo un share de datos seguro."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Delta Sharing","url":"https://docs.databricks.com/aws/en/delta-sharing/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":200,"topic":"Exam A","question":"A data engineering team wants to validate a new ingestion pipeline locally while ensuring large aggregations run in\n  serverless compute in their Databricks workspace. They plan to use Databricks Connect and have the option to attach to\n  either a shared cluster or serverless.\n\n\n  Which workspace requirement should be confirmed first to avoid connection failures?","options":[{"key":"A","text":"Verify that the workspace has Unity Catalog disabled and the Databricks Connect version is less than the serverless\n\n     Runtime version."},{"key":"B","text":"Verify that the workspace has Unity Catalog enabled and that the Databricks Connect version supports serverless for\n\n     the target Runtime release."},{"key":"C","text":"Verify that only assigned access mode clusters are used because serverless is not supported by Databricks Connect."},{"key":"D","text":"Verify that the local Spark version equals the serverless Spark version to satisfy Spark Connect parity."}],"correct":["B"],"explanation":"Databricks Connect permite desarrollar desde un IDE local mientras el plan de ejecución Spark corre en compute remoto. Hay que compatibilizar versiones de cliente, runtime y Python para ciertas operaciones.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"Databricks Connect permite desarrollar desde un IDE local mientras el plan de ejecución Spark corre en compute remoto. Hay que compatibilizar versiones de cliente, runtime y Python para ciertas operaciones.","wrongWhy":{"A":"Unity Catalog deshabilitado no es requisito para Databricks Connect a serverless.","C":"Connect puede usar serverless cuando hay soporte regional/versión.","D":"La igualdad exacta de versiones locales de Spark no es la única comprobación, importa compatibilidad del cliente/runtime y UC."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":201,"topic":"Exam A","question":"A data engineer needs to conduct Exploratory Analysis on data residing in a database that is within the company's\n  custom-defined network in the cloud. The data engineer is using SQL for this task.\n\n\n  Which type of SQL Warehouse will enable the data engineer to process large numbers of queries quickly and cost-\n  effectively?","options":[{"key":"A","text":"Classic SQL Warehouse"},{"key":"B","text":"Serverless SQL Warehouse"},{"key":"C","text":"Pro SQL Warehouse"},{"key":"D","text":"All-purpose compute cluster"}],"correct":["C"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"A":"Classic es básico y no ofrece la conectividad/rendimiento Pro esperados para network privado.","B":"Serverless SQL depende de opciones de red disponibles; un origen en red personalizada puede requerir Pro.","D":"All-purpose cluster es compute de notebooks, no SQL Warehouse de consultas concurrentes."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":202,"topic":"Exam A","question":"A data engineer must deliver a trustworthy customer 360 dataset in Databricks for data scientists and BI teams. The\n  engineer plans to join deduplicated customer records with cleaned transaction data, enforce schema and data quality\n  checks, and create a conformed “customer_transactions” view. Later, highly aggregated, domain-specific tables (for\n  weekly spend and executive summaries) will be produced for dashboards.\n\n\n  Where should the engineer build the conformed “customer_transactions” dataset, and where should the\n  aggregated, report-ready tables reside?","options":[{"key":"A","text":"Build both “customer_transactions” and aggregated, report-ready tables in Silver to keep the model simpler."},{"key":"B","text":"Build “customer_transactions” in Bronze and put the aggregated, report-ready tables in Silver."},{"key":"C","text":"Build “customer_transactions” in Gold and put the aggregated, report-ready tables in Silver."},{"key":"D","text":"Build “customer_transactions” in Silver and put the aggregated, report-ready tables in Gold."}],"correct":["D"],"explanation":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","wrongWhy":{"A":"Silver puede albergar el dataset conformado, pero los agregados de reporting son más apropiados para Gold.","B":"Bronze está destinado a origen bruto, no Customer 360 ya conformado.","C":"Invierte las capas: Gold es agregación/consumo y Silver es conformado/limpieza."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":203,"topic":"Exam A","question":"A data engineer requires rapid iteration on pipelines while maintaining reliable rollbacks after bad ingests, ensuring audit\n  trails for regulatory compliance, and providing consistent access to a single source of truth for both AI and BI workloads.\n\n\n  Which strategy should the data engineer apply to meet the needs?","options":[{"key":"A","text":"Delta Lake ACID transactions and time travel, governed by Unity Catalog for consistent access and lineage."},{"key":"B","text":"DBFS CSV storage with manual file versioning and nightly copies for rollback."},{"key":"C","text":"Ephemeral in-memory DataFrames for audit trails and BI distribution."},{"key":"D","text":"Cloud objects storage only, with ad hoc SQL queries for recovery and governance."}],"correct":["A"],"explanation":"El registro Delta conserva versiones para time travel e historial. VACUUM puede eliminar archivos antiguos necesarios para consultar o restaurar ciertas versiones.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"El registro Delta conserva versiones para time travel e historial. VACUUM puede eliminar archivos antiguos necesarios para consultar o restaurar ciertas versiones.","wrongWhy":{"B":"CSV + copias manuales no proporciona transacciones ACID ni historial/auditoría gestionados.","C":"DataFrames efímeros desaparecen y no soportan auditoría compartida persistente.","D":"Object storage bruto no añade gobierno UC ni versionado Delta por sí solo."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":204,"topic":"Exam A","question":"A data engineer is setting up a new Databricks pipeline that ingests clickstream events from Kafka and daily product\n  catalogs from cloud object storage. To ensure auditability and easy reprocessing, the engineer wants to land all source\n  data. Later stages will handle cleaning, deduplication, and business modeling before the data is used in dashboards.\n\n\n  Which approach aligns to Medallion Architecture principles?","options":[{"key":"A","text":"Land both sources in Gold with denormalized star schemas to optimize BI while retaining full source fidelity."},{"key":"B","text":"Land streaming events from Kafka in silver, and the product catalog directly in Gold to minimize layers for batch data."},{"key":"C","text":"Land both sources in the Bronze layer append-only with minimal validation, then build Silver/Gold downstream for\n\n     quality and analytics."},{"key":"D","text":"Land both sources directly into the Silver layer with schema enforcement and deduplication to reduce downstream\n\n     complexity."}],"correct":["C"],"explanation":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","wrongWhy":{"A":"Gold es capa de consumo; introducir Kafka sin depurar ahí pierde trazabilidad.","B":"Divide el origen en capas distintas sin preservar la captura raw completa.","D":"Ingesta directa Silver puede descartar trazabilidad para reproducciones."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":205,"topic":"Exam A","question":"A data engineer is building a PySpark ingestion pipeline in a local IDE and must execute heavy DataFrame transformations\n  on a remote Databricks cluster for scale while stepping through business logic locally. The workspace uses Unity Catalog\n  and a cluster running Databricks Runtime 15.4 LTS. The engineer also plans to register UDFs.\n\n\n  What should the data engineer do to avoid runtime issues during development with Databricks Connect?","options":[{"key":"A","text":"Match the local Python minor version to the cluster’s Python minor version when using UDFs, and use a\n\n     Databricks Connect package compatible with the cluster’s Runtime version"},{"key":"B","text":"Use any local Python version as long as the PySpark minor version matches, because the cluster’s Python version\n\n     is isolated from the client."},{"key":"C","text":"Use serverless, because Databricks Connect does not support assigned or shared clusters."},{"key":"D","text":"Disable Unity Catalog on the workspace because it conflicts with remote execution through Databricks Connect."}],"correct":["A"],"explanation":"Databricks Connect permite desarrollar desde un IDE local mientras el plan de ejecución Spark corre en compute remoto. Hay que compatibilizar versiones de cliente, runtime y Python para ciertas operaciones.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"Databricks Connect permite desarrollar desde un IDE local mientras el plan de ejecución Spark corre en compute remoto. Hay que compatibilizar versiones de cliente, runtime y Python para ciertas operaciones.","wrongWhy":{"B":"Con UDFs Python la versión menor local debe ser compatible con el runtime remoto.","C":"Databricks Connect también puede usar clusters compatibles, no exige serverless.","D":"Unity Catalog no entra en conflicto intrínseco con Databricks Connect."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":206,"topic":"Exam A","question":"A Databricks single-task workflow fails due to an error in a notebook. The data engineer fixes the mistake in the notebook.\n\n\n  What should the data engineer do to rerun the workflow?","options":[{"key":"A","text":"Repair the task"},{"key":"B","text":"Repair the run"},{"key":"C","text":"Restart the Cluster"},{"key":"D","text":"Swap the cluster"}],"correct":["A"],"explanation":"Los Jobs permiten programar, monitorizar y recuperar trabajos. Repair run reejecuta tareas fallidas o pendientes sin repetir necesariamente toda la ejecución ya completada.","issue":"La guía del banco usa la opción A «Repair the task»; en la práctica la acción habitual de Databricks es «Repair run». Conviene verificar la terminología exacta de la interfaz.","scorable":true,"category":"Jobs / DevOps","answerWhy":"La guía del banco usa la opción A «Repair the task»; en la práctica la acción habitual de Databricks es «Repair run». Conviene verificar la terminología exacta de la interfaz.","wrongWhy":{"B":"«Repair the run» es de hecho la denominación más frecuente en la documentación actual para reintentar un run fallido. Aunque el PDF marca A, esta alternativa no debería descartarse sin matices.","C":"Reiniciar el cluster no reejecuta automáticamente el notebook ya corregido.","D":"Cambiar de cluster no repara ni vuelve a ejecutar la tarea que falló."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":207,"topic":"Exam A","question":"A data engineer is migrating pipeline tasks to reduce operational toil. The workspace used Unity Catalog and is in a region\n  that supports serverless. The engineer wants Databricks to auto select instance types, manage scaling, apply Photon, and\n  handle runtime upgrades automatically for job runs.\n\n  How should the data engineer meet this requirement while adhering to Databricks constraints?","options":[{"key":"A","text":"Run the job on a serverless compute for workflows configuration, ensuring Unity Catalog is enabled and regional\n\n     support is available."},{"key":"B","text":"Use a Pro SQL warehouse and schedule Python notebook tasks to execute as pipeline steps."},{"key":"C","text":"Create a job with a single-task job cluster and manually set instance families and min/max workers."},{"key":"D","text":"Use an all-purpose cluster with cluster policies to enforce standard sizes and enable autoscaling."}],"correct":["A"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"B":"Pro SQL Warehouse no ejecuta una cadena de notebooks Python Spark arbitrarios.","C":"Job cluster clásico requiere selección y tuning de instancias.","D":"Un all-purpose cluster sigue imponiendo gestión del runtime y dimensionamiento."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":208,"topic":"Exam A","question":"A data engineer is standardizing repository layouts for multiple teams adopting Databricks Asset Bundles. The engineer\n  wants to ensure every project has a single authoritative configuration file at the repository root that defines the bundle\n  name, targets, workspace settings, permissions, and resource mappings (for jobs and pipelines).\n\n\n  What strategy should the data engineer use to meet the goal?","options":[{"key":"A","text":"Place multiple databricks.yml files under each subfolder (for example, jobs/pipelines/, workspace/) and merge them\n\n     at deploy time using the include mapping."},{"key":"B","text":"Place exactly one databricks.yml at the repository root; it is the main configuration file and may reference additional\n\n     configuration files via the include mapping."},{"key":"C","text":"Place a databricks.yml in a databricks/.hidden folder at the repository root; only hidden locations are valid for bundle\n\n     configs."},{"key":"D","text":"Place a databricks.yaml at the repository root and optional databricks.yml in subfolders; the CLI prefers .yaml over\n\n     .yml when both exist."}],"correct":["B"],"explanation":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","wrongWhy":{"A":"No debe haber múltiples archivos databricks.yml raíz: solo uno en la raíz del bundle.","C":"Un archivo oculto bajo databricks/ no cumple la ubicación raíz estándar.","D":"La CLI espera databricks.yml como principal, no privilegia databricks.yaml."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":209,"topic":"Exam A","question":"Which Databricks feature can be used to check the data sources and tables used in a workspace?","options":[{"key":"A","text":"Use the lineage feature to visualize a graph that shows all dependencies, including where the table is used in\n\n     notebooks, other tables, and reports."},{"key":"B","text":"Use the lineage feature to visualize a graph that highlights where the table is used only in reports."},{"key":"C","text":"Use the audit logs feature to review user activities, such as who queried or modified a table, instead of visualizing\n\n     dependencies between data objects."},{"key":"D","text":"Use the lineage feature to visualize a graph that highlights where the table is used only in notebooks."}],"correct":["A"],"explanation":"Unity Catalog lineage representa gráficamente relaciones de dependencia entre tablas, notebooks y otros consumidores, proporcionando trazabilidad de los datos.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"Unity Catalog lineage representa gráficamente relaciones de dependencia entre tablas, notebooks y otros consumidores, proporcionando trazabilidad de los datos.","wrongWhy":{"B":"El grafo no se limita a reportes, también cubre dependencias entre tablas/notebooks.","C":"Audit logs rastrean acciones, no sustituyen el gráfico de lineage.","D":"Tampoco se limita a notebooks: se extiende a otros activos."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":210,"topic":"Exam A","question":"A data engineer wants to delegate day-to-day permission management for the schema main_marketing to the mkt-\n  admins group, without making them workspace admins. They should be able to grant and revoke privileges for other\n  users on objects within that schema.\n\n\n  Which approach aligns with UC’s ownership and privilege model?","options":[{"key":"A","text":"Grant MANAGE permissions on the metastore to mkt-admins, which allows managing privileges for all schemas and\n\n     tables globally."},{"key":"B","text":"Make mkt-admins a workspace-level admins group, then SELECT on main.marketing to allow privilege delegation."},{"key":"C","text":"Transfer ownership of the schema main_marketing to mkt-admins; owners can manage privileges on the schema and\n\n     its contained objects."},{"key":"D","text":"Grant USE SCHEMA on main.marketing and MODIFY on all tables to mkt-admins, which enables managing grants\n\n     within the schema."}],"correct":["C"],"explanation":"La titularidad de un schema conlleva capacidad de administrar permisos sobre él según las reglas de Unity Catalog; la gestión de permisos no equivale a un permiso SELECT ordinario.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"La titularidad de un schema conlleva capacidad de administrar permisos sobre él según las reglas de Unity Catalog; la gestión de permisos no equivale a un permiso SELECT ordinario.","wrongWhy":{"A":"Dar privilegios globales de metastore excede el ámbito del schema.","B":"Workspace admin da poderes demasiado amplios y no es necesario.","D":"USE + MODIFY permite navegación/escritura de datos, pero no necesariamente administración de grants."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"}]},{"id":211,"topic":"Exam A","question":"A data engineer is decommissioning a sandbox schema in Unity Catalog. Some tables are ephemeral staging outputs that\n  can be safety removed entirely, but a few tables point at shared cloud storage used by downstream jobs outside\n  Databricks. The engineer must avoid deleting any shared files when cleaning up catalog objects.\n\n\n  How does Unity Catalog behave when dropping Managed vs External tables?","options":[{"key":"A","text":"DROP all tables; Databricks will only remove metadata for both managed and external tables."},{"key":"B","text":"DROP managed tables that are ephemeral and DROP external tables; files for both remain for 7 days."},{"key":"C","text":"DROP managed staging tables to remove data and metadata, and DROP external tables to remove only metadata"},{"key":"D","text":"DROP external tables first to delete their files, then DROP managed tables to keep their files for recovery."}],"correct":["C"],"explanation":"Una tabla managed delega en la plataforma el ciclo de vida de datos y metadatos; en una tabla external, los archivos permanecen en la ubicación externa al borrar el registro del catálogo. Las migraciones deben validar dependencias.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Una tabla managed delega en la plataforma el ciclo de vida de datos y metadatos; en una tabla external, los archivos permanecen en la ubicación externa al borrar el registro del catálogo. Las migraciones deben validar dependencias.","wrongWhy":{"A":"DROP managed puede afectar ciclo de vida de archivos; no es solo metadata.","B":"Managed y external no comparten idéntico comportamiento de conservación de archivos.","D":"Invierte managed/external: en external hay que preservar los datos compartidos."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"}]},{"id":212,"topic":"Exam A","question":"A data engineer is onboarding a new bronze ingestion pipeline in Databricks with Unity Catalog. The team wants\n  Databricks to handle storage layout, apply platform optimizations over time, and simplify lifecycle management so that\n  when a table is dropped, its underlying data is also cleaned up according to Databricks-managed retention policies.\n\n\n  Which table type should the data engineer create for these ingestion tables?","options":[{"key":"A","text":"Managed tables so that Unity Catalog manages both metadata and underlying data lifecycle."},{"key":"B","text":"External tables with a LOCATION pointing to an external volume for full control of file layout."},{"key":"C","text":"Foreign tables federated from an external catalog to delegate optimization to the source system."},{"key":"D","text":"Temporary views over files to avoid table-level governance and lifecycle coupling."}],"correct":["A"],"explanation":"Una tabla managed delega en la plataforma el ciclo de vida de datos y metadatos; en una tabla external, los archivos permanecen en la ubicación externa al borrar el registro del catálogo. Las migraciones deben validar dependencias.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Una tabla managed delega en la plataforma el ciclo de vida de datos y metadatos; en una tabla external, los archivos permanecen en la ubicación externa al borrar el registro del catálogo. Las migraciones deben validar dependencias.","wrongWhy":{"B":"External con LOCATION hace que la gestión de archivos recaiga en el propietario del storage, no en UC.","C":"Una foreign table consulta remoto y delega el ciclo de vida.","D":"Una vista temporal no persiste ni delega gestión de los datos."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":213,"topic":"Exam A","question":"A data engineer working in Databricks needs to control BI query latency and cost for a sales analytics domain. Silver tables\n  already contain validated, normalized sales and product data. The team wants dashboard-friendly query performance and\n  to align datasets with business concepts (e.g., weekly_sales and account_performance) without overloading analysts with\n  complex joins.\n\n\n  Which design approach should a data engineer choose for the Gold layer in a medallion architecture?","options":[{"key":"A","text":"Move raw, append-only source data directly into Gold to avoid transformation costs and enable time travel."},{"key":"B","text":"Create denormalized, domain-aligned tables and materialized aggregates (e.g., weekly_sales) optimized for reporting\n\n     and dashboards."},{"key":"C","text":"Build only lightly cleansed views in Gold and preserve most business logic in Silver to reduce duplication."},{"key":"D","text":"Keep all data heavily normalized in Gold to minimize storage and rely on BI tools to join data at query time."}],"correct":["B"],"explanation":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","wrongWhy":{"A":"Gold no debe limitarse a raw append-only sin transformación.","C":"Una vista ligeramente limpia no necesariamente precomputa métricas de dashboard.","D":"El modelado demasiado normalizado obliga a más joins en BI y aumenta latencia."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":214,"topic":"Exam A","question":"A team is designing their Data bricks Asset Bundle for deployment. They want to ensure their bundle includes all\n  necessary resources, targeted environment configurations, and deployment settings in a single version-controlled file.\n\n\n  What is required as the main configuration file at the root of their project?","options":[{"key":"A","text":"A Python script called configure_bundle.py that dynamically creates resources at runtime"},{"key":"B","text":"A databricks.yml YAML file that contains the bundle's name, targets, includes resources, and variables"},{"key":"C","text":"A directory with multiple TXT files, each describing a single resource for the bundle"},{"key":"D","text":"A JSON file named bundle_config.json that stores all resource details and environment variables"}],"correct":["B"],"explanation":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","wrongWhy":{"A":"Un script Python no sustituye el archivo raíz YAML del bundle.","C":"TXT dispersos no constituyen el esquema de bundle validable.","D":"bundle_config.json no es el nombre/formato raíz requerido."},"sourceLinks":[{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"}]},{"id":215,"topic":"Exam A","question":"A developer has configured Databricks Connect and starts running PySpark code locally. They notice that DataFrame\n  operations are executed on the remote cluster, but actions like .show() return results directly in their local console.\n\n\n  What does this behaviour illustrate about how Databricks Connect is used?","options":[{"key":"A","text":"It requires manual synchronization of results from the cluster"},{"key":"B","text":"It runs all Spark compute locally and only reads remote files"},{"key":"C","text":"It proxies Spark commands from the local client to the remote cluster"},{"key":"D","text":"It mirrors the entire cluster environment on the developer's machine"}],"correct":["C"],"explanation":"Databricks Connect permite desarrollar desde un IDE local mientras el plan de ejecución Spark corre en compute remoto. Hay que compatibilizar versiones de cliente, runtime y Python para ciertas operaciones.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"Databricks Connect permite desarrollar desde un IDE local mientras el plan de ejecución Spark corre en compute remoto. Hay que compatibilizar versiones de cliente, runtime y Python para ciertas operaciones.","wrongWhy":{"A":"Databricks Connect lleva órdenes/resultados de forma integrada; no hay que sincronizarlos a mano.","B":"La ejecución de los DataFrames se delega al cluster remoto, no a Spark local.","D":"No copia todo el cluster a tu PC; actúa como cliente remoto de Spark."},"sourceLinks":[{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":216,"topic":"Exam A","question":"A data engineer needs to configure an external location and a storage credential so that a new bronze ingestion pipeline\n  can land data in cloud storage governed by Unity Catalog. The engineer has CREATE TABLE permission on schemas but\n  receives a permission error when attempting to create the external location.\n\n\n  Which role is required to unblock this setup, the principle of least privilege?","options":[{"key":"A","text":"Grant CREATE EXTERNAL LOCATION on both the metastore and the referenced storage credential so the engineer can\n\n     define the external location."},{"key":"B","text":"Grant ALL PRIVILEGES on the catalog so the engineer can create external locations under its schemas."},{"key":"C","text":"Promote the engineer to Workspace Admin so they can manage objects and jobs."},{"key":"D","text":"Assign the engineer as Metastore Admin because only Metastore Admins can create external locations."}],"correct":["A"],"explanation":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","wrongWhy":{"B":"ALL PRIVILEGES en catalog no permite automáticamente crear external locations ni es mínimo privilegio.","C":"Workspace Admin no sustituye los grants específicos de metastore/storage credentials.","D":"No se necesita hacer metastore admin para conceder una acción granular."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":217,"topic":"Exam A","question":"A data engineer needs to compute metrics such as:\n\n\n  • rolling 7-day sales\n  • percent of total revenue\n  • top-N most profitable categories\n\n\n  Which two approaches are appropriate for implementing these metrics with PySpark DataFrames? (Choose two.)","options":[{"key":"A","text":"Using RDD aggregations for better performance."},{"key":"B","text":"Using mapPartitions to manually implement rolling windows."},{"key":"C","text":"Using window functions for rolling and ranking calculations."},{"key":"D","text":"Collecting the DataFrame to the driver for faster iterative processing."},{"key":"E","text":"Using joins and groupBy to compute percent-of-total metrics."}],"correct":["C","E"],"explanation":"Las ventanas calculan rankings y métricas móviles; groupBy y joins permiten calcular agregaciones y participaciones sobre el total sin llevar datos al driver.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"Las ventanas calculan rankings y métricas móviles; groupBy y joins permiten calcular agregaciones y participaciones sobre el total sin llevar datos al driver.","wrongWhy":{"A":"RDDs pierden optimizaciones del plan SQL y no son la solución preferente para estas métricas.","B":"mapPartitions obliga a reimplementar ventanas manualmente.","D":"collect al driver rompe escalabilidad y puede causar OOM."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":218,"topic":"Exam A","question":"After a failed multi-task job run, a data engineer changes the cluster size and updates a notebook path for one task. The\n  data engineer wants to re-run just the failed/skipped tasks with the updated settings and keep the run lineage intact.\n\n\n  Which strategy should the data engineer use to preserve the run history?","options":[{"key":"A","text":"Use Jobs REST API repairRun to re-run failed tasks; the repair uses the current job and task settings and appears in\n\n     the run history."},{"key":"B","text":"Increase the task retry count and click 'Retry' on the failed task to automatically apply new cluster settings within the\n\n     same run."},{"key":"C","text":"Export the job as a Databricks Asset Bundle, redeploy it, and re-run only the modified tasks from the bundle."},{"key":"D","text":"Use 'Run now' to start a new run, so that the updated settings apply; the new run replaces the prior run history."}],"correct":["A"],"explanation":"Los Jobs permiten programar, monitorizar y recuperar trabajos. Repair run reejecuta tareas fallidas o pendientes sin repetir necesariamente toda la ejecución ya completada.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Los Jobs permiten programar, monitorizar y recuperar trabajos. Repair run reejecuta tareas fallidas o pendientes sin repetir necesariamente toda la ejecución ya completada.","wrongWhy":{"B":"Retry automático puede no aplicar ajustes de configuración tal como repair run ni conservar la misma semántica de historial.","C":"Redeploy del bundle no equivale a reparar selectivamente un run fallido.","D":"Run now crea otra ejecución y no conserva la línea de reparación de la anterior."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":219,"topic":"Exam A","question":"When using MERGE INTO in Delta Lake on Databricks, which clause allows you to automatically delete target rows that no\n  longer match any source rows?","options":[{"key":"A","text":"WHEN MATCHED BY SOURCE THEN UPDATE SET NULL"},{"key":"B","text":"WHEN MATCHED THEN DELETE"},{"key":"C","text":"WHEN NOT MATCHED BY SOURCE THEN DELETE"},{"key":"D","text":"WHEN NOT MATCHED THEN DELETE"}],"correct":["C"],"explanation":"MERGE INTO permite aplicar inserciones, actualizaciones y, con determinadas cláusulas, eliminaciones comparando una fuente con el destino mediante una condición de correspondencia. INSERT INTO únicamente añade filas.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"MERGE INTO permite aplicar inserciones, actualizaciones y, con determinadas cláusulas, eliminaciones comparando una fuente con el destino mediante una condición de correspondencia. INSERT INTO únicamente añade filas.","wrongWhy":{"A":"No existe esa cláusula para borrar filas ausentes de la fuente.","B":"WHEN MATCHED actúa sobre filas coincidentes.","D":"WHEN NOT MATCHED maneja filas que existen en la fuente y no en destino."},"sourceLinks":[{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"label":"Delta: operaciones MERGE","url":"https://docs.databricks.com/aws/en/delta/merge"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":220,"topic":"Exam A","question":"A data engineer must support self-serve BI dashboards for hundreds of business users who run ad hoc, high-concurrency\n  SQL queries throughout the day against governed Unity Catalog tables. The team needs a near-instant start, autoscaling\n  without manual tuning, and the best performance for SQL while minimizing operational overhead.\n\n\n  Which Databricks compute should the data engineer use?","options":[{"key":"A","text":"SQL Warehouse (Classic) with a fixed cluster size."},{"key":"B","text":"Jobs compute clusters triggered by dashboards on a schedule."},{"key":"C","text":"All-purpose classic cluster with manual autoscaling enabled."},{"key":"D","text":"SQL Warehouse (Serverless) with Photon enabled."}],"correct":["D"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"A":"Classic requiere gestionar cluster y puede arrancar más lento con alta concurrencia.","B":"Job compute es para workflows, no para serving interactivo BI continuo.","C":"All-purpose no optimiza SQL concurrency/gestión tanto como Serverless SQL Warehouse."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":221,"topic":"Exam A","question":"A team is using a Databricks workspace and needs to continuously ingest JSON files as they arrive.\n\n\n  Which code snippet shows a valid Auto Loader source configuration?","options":[{"key":"A","text":"spark.readStream.format(\"json\")\n\n        .option(\"cloudFiles.format\", \"json\")\n        .load(\"<path>\")"},{"key":"B","text":"spark.readStream.format(\"cloudFiles\")\n\n        .option(\"cloudFiles.format\", \"json\")\n        .load(\"jdbc:sqlserver://database=\")"},{"key":"C","text":"spark.readStream.format(\"cloudFiles\")\n\n        .option(\"format\", \"json\")\n        .load(\"<path>\")"},{"key":"D","text":"spark.readStream.format(\"cloudFiles\")\n\n        .option(\"cloudFiles.format\", \"json\")\n        .load(\"<path>\")"}],"correct":["D"],"explanation":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","wrongWhy":{"A":"format(\"json\") no activa Auto Loader cloudFiles y su seguimiento específico.","B":"Una URL JDBC no es ruta cloud object storage para Auto Loader.","C":"La opción del formato debe ser cloudFiles.format, no simplemente format."},"sourceLinks":[{"label":"Auto Loader","url":"https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/"}]},{"id":222,"topic":"Exam A","question":"A data engineering team is analyzing customer transactions using a PySpark DataFrame named transactions with columns\n  customer_id, amount, and category.\n\n\n  The team needs to compute, for each customer, the total transaction amount, the average transaction amount, and the\n  maximum amount - all in a single operation for efficiency.\n\n\n  Which code fragment should be used to achieve this in PySpark?","options":[{"key":"A","text":"transactions.groupBy(\"customer_id\")\n\n        .agg(sum(\"amount\"), avg(\"amount\"), max(\"amount\"))"},{"key":"B","text":"transactions.groupBy(\"customer_id\")\n\n        .select(sum(\"amount\"), avg(\"amount\"), max(\"amount\"))"},{"key":"C","text":"transactions.agg(groupBy(\"customer_id\"),\n\n            sum(\"amount\"),\n            avg(\"amount\"),\n            max(\"amount\"))"},{"key":"D","text":"transactions.groupBy(\"customer_id\")\n\n        .sum(\"amount\")\n            .avg(\"amount\").max(\"amount\")"}],"correct":["A"],"explanation":"groupBy(...).agg(...) aplica agregaciones Spark por clave de agrupación. sum, avg y count pueden combinarse en la misma operación y renombrarse con alias.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"groupBy(...).agg(...) aplica agregaciones Spark por clave de agrupación. sum, avg y count pueden combinarse en la misma operación y renombrarse con alias.","wrongWhy":{"B":"select() no se usa directamente sobre el objeto GroupedData de esa forma; debe usarse agg().","C":"groupBy es método del DataFrame, no argumento dentro de agg.","D":"Tras sum no existe encadenado avg().max() sobre un GroupedData de esa manera."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":223,"topic":"Exam A","question":"A Lakeflow Jobs workflow fails at the last task because of an error in a notebook task. This workflow is scheduled to run\n  daily. The data engineer fixes the notebook and wants to rerun the pipeline. This workflow is very compute-intensive and\n  expensive to run.\n\n\n  Which action should the data engineer take in order to minimize downtime and compute cost?","options":[{"key":"A","text":"Restart the cluster"},{"key":"B","text":"Re-run the entire workflow"},{"key":"C","text":"Switch to another cluster"},{"key":"D","text":"Repair run"}],"correct":["D"],"explanation":"Los Jobs permiten programar, monitorizar y recuperar trabajos. Repair run reejecuta tareas fallidas o pendientes sin repetir necesariamente toda la ejecución ya completada.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Los Jobs permiten programar, monitorizar y recuperar trabajos. Repair run reejecuta tareas fallidas o pendientes sin repetir necesariamente toda la ejecución ya completada.","wrongWhy":{"A":"Reiniciar el cluster solo reinicia infraestructura; no reanuda el DAG desde la tarea fallida.","B":"Volver a ejecutar todo repite tareas anteriores que ya se completaron y encarece el proceso.","C":"Cambiar de cluster no selecciona automáticamente solo las tareas fallidas."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":224,"topic":"Exam A","question":"A data engineer is investigating a Lakehouse ETL job on Databricks that has suddenly become four times slower.\n\n\n  They need to:\n\n\n  • Identify the specific Spark stages that regressed.\n  • Drill down to per-task metrics such as shuffle read/write size, spill, and GC time.\n  • Correlate these with executor resource usage during that run.\n\n\n  Which Databricks-native capability is the starting point for this detailed job-level root-cause analysis?","options":[{"key":"A","text":"Cluster Metrics (Metrics tab on the compute) to view historical Spark and hardware metrics, without using the Spark\n\n     UI."},{"key":"B","text":"The Jobs run details page timeline and graph views, without opening the Spark UI, to analyze all stage and task-level\n\n     Spark metrics."},{"key":"C","text":"Ganglia metrics for the cluster, which provide full visibility into Spark stages, tasks, and shuffle metrics for the job run."},{"key":"D","text":"Spark UI opened from the job run's compute, using the Jobs and Stages tabs to inspect task metrics."}],"correct":["D"],"explanation":"La Spark UI ayuda a localizar cuellos de botella de CPU, shuffle, spill, skew y memoria. El driver sufre al recoger datos localmente; los executors y el particionamiento afectan a los joins distribuidos.","issue":null,"scorable":true,"category":"Fundamentos / Otros","answerWhy":"La Spark UI ayuda a localizar cuellos de botella de CPU, shuffle, spill, skew y memoria. El driver sufre al recoger datos localmente; los executors y el particionamiento afectan a los joins distribuidos.","wrongWhy":{"A":"Cluster Metrics solo aporta vista de recursos, no los shuffle/spill por stage/task completos.","B":"La línea de tiempo del run no reemplaza las pestañas Stages/Tasks de Spark UI.","C":"Ganglia no ofrece el mismo nivel de análisis por operador y tareas Spark."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":225,"topic":"Exam A","question":"A data engineer is troubleshooting a Lakeflow Spark Declarative Pipelines (SDP) where several rows are dropped by\n  expectations. The product owner requests details on which expectation failed most frequently during the last run and the\n\n  corresponding affected table. The engineer wants to use Databricks' built-in observability data to answer this without\n  adding new logging code.\n\n\n  How should the data engineer troubleshoot SDP to verify the expectation failure?","options":[{"key":"A","text":"Export notebook run results to HTML and search for the expectations summary in the rendered output to compile\n\n     the metrics."},{"key":"B","text":"Query the Lakeflow Spark Declarative Pipelines event log to retrieve expectation metrics and failure details for the\n\n     pipeline's most recent update."},{"key":"C","text":"Use the Spark UI's SQL tab to identify failed rows and expectation names from physical query plans."},{"key":"D","text":"Increase the cluster's log level to DEBUG and parse the driver's Log4j logs for expectation metrics for the last run."}],"correct":["B"],"explanation":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","wrongWhy":{"A":"Exportar notebooks no incluye necesariamente métricas de expectativas del SDP.","C":"Spark UI sirve planes y tareas, no auditoría por regla EXPECT.","D":"Logs Log4j de driver no son la fuente estructurada adecuada; se usa event log."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":226,"topic":"Exam A","question":"A data engineer uses the Databricks workspace UI with Unity Catalog enabled. In Data Explorer, they select catalog\n  corp_marketing, then schema campaigns, and see table email_stats. The engineer must let the growth-analysts group\n  read email_stats from their SQL warehouses, but not create, alter, or delete any objects in corp_marketing or campaigns.\n\n\n  Which action sequence meets the requirement?","options":[{"key":"A","text":"1. On schema campaigns, open Permissions and grant USE SCHEMA to growth-analysts. 2. On the table email_stats,\n\n     open Permissions and grant SELECT and MODIFY to growth-analysts"},{"key":"B","text":"1. On catalog corp_marketing, open Permissions and grant USE CATALOG to growth-analysts. 2. On schema\n\n     campaigns, open Permissions and grant USE SCHEMA to growth-analysts. 3. On the table email_stats, open Permissions\n     and grant SELECT to growth-analysts"},{"key":"C","text":"1. On catalog corp_marketing, open Permissions and grant USE CATALOG and CREATE SCHEMA to growth-analysts. 2.\n\n     On schema campaigns, open Permissions and grant USE SCHEMA to growth-analysts. 3. On the table email_stats, open\n     Permissions and grant SELECT to growth-analysts"},{"key":"D","text":"1. On schema campaigns, open Permissions and grant USE SCHEMA and SELECT to growth-analysts. 2. On the table\n\n     email_stats, open Permissions and grant SELECT to growth-analysts"}],"correct":["B"],"explanation":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","wrongWhy":{"A":"Le falta USE CATALOG y añade MODIFY, que permitiría escritura.","C":"CREATE SCHEMA es un privilegio excesivo: los analistas solo necesitan lectura.","D":"Le falta USE CATALOG y no coloca SELECT en el ámbito correcto."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":227,"topic":"Exam A","question":"An organization is building a data lakehouse and needs to ingest data from multiple sources into Unity Catalog-managed\n  tables:\n\n\n  • Source 1: Salesforce (50+ objects, frequent schema changes, OAuth authentication required)\n  • Source 2: On-premises SQL server database (100+ tables, CDC enabled, requires network connectivity)\n  • Source 3: Daily JSON files landing in Azure Data Lake Storage Gen2\n\n  The organization wants all ingested data to be governed by Unity Catalog, to minimize data engineering effort for schema\n  changes, and to use serverless wherever possible to reduce operational overhead.\n\n\n  Which ingestion strategy meets these requirements?","options":[{"key":"A","text":"Use partner connectors (Fivetran) for all three sources via Partner Connect, as they provide the most comprehensive\n\n     integration with Unity Catalog and automated schema evolution."},{"key":"B","text":"Use Lakeflow Connect managed connectors for all three sources, as they provide consistent serverless execution and\n\n     Unity Catalog integration across all data source types."},{"key":"C","text":"Use Lakeflow Connect managed connectors for Salesforce and SQL Server, and Auto Loader for ADLS files, all within\n\n     Lakeflow Spark Declarative Pipelines."},{"key":"D","text":"Use Auto Loader for all three sources with custom Python code to handle Salesforce API calls and SQL server CDC\n\n     extraction, then write to Unity Catalog tables."}],"correct":["C"],"explanation":"Un patrón mixto utiliza conectores gestionados para SaaS/bases de datos y Auto Loader para ficheros que ya están en ADLS. Esto minimiza integración a medida y mantiene el destino gobernado por Unity Catalog.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Un patrón mixto utiliza conectores gestionados para SaaS/bases de datos y Auto Loader para ficheros que ya están en ADLS. Esto minimiza integración a medida y mantiene el destino gobernado por Unity Catalog.","wrongWhy":{"A":"Partner connectors para todo añade terceros innecesarios, especialmente para archivos ADLS.","B":"No hay managed connector único válido para archivos ADLS y fuentes SaaS/DB como si fueran la misma clase.","D":"Auto Loader no extrae Salesforce/SQL Server CDC de forma nativa sin construir código de API."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Auto Loader","url":"https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":228,"topic":"Exam A","question":"A data engineer has manually created several Databricks jobs and dashboards using the workspace UI. The team now\n  wants to manage these resources as code using Declarative Automation Bundles (formerly Databricks Asset Bundles),\n  store the configuration in a Git repository, and deploy changes through CI/CD.\n\n\n  Which approach converts the existing resources into a bundle project?","options":[{"key":"A","text":"Run databricks bundle init to create a new bundle project, then use databricks bundle deploy pointed at the\n\n     workspace to automatically detect and import all existing resources into the bundle configuration."},{"key":"B","text":"Use the Databricks REST API to export each job's JSON definition, save the JSON files into a Git repository, and\n\n     configure CI/CD to import them using the REST API on each deployment."},{"key":"C","text":"Run databricks bundle generate for each existing resource, use --bind to link the generated configuration to the\n\n     existing workspace resources, and commit the bundle project to Git for CI/CD deployment."},{"key":"D","text":"Clone an empty Git repository into a Git Folder, recreate each job and dashboard configuration in YAML by\n\n     referencing the settings using workspace UI, then commit and deploy with databricks bundle deploy."}],"correct":["C"],"explanation":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","wrongWhy":{"A":"deploy no descubre/importa por sí solo recursos existentes del workspace al bundle.","B":"JSON + API manual no aprovecha generación/bind de recursos y el bundle YAML.","D":"Rehacer los YAML a mano es menos fiable/eficiente que bundle generate y bind."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"}]},{"id":229,"topic":"Exam A","question":"A developer is building a data pipeline that processes records from a bronze table into a silver table. The bronze table,\n  bronze_events, contains duplicate records due to at-least-once delivery guarantees from the upstream ingestion system.\n  The developer writes the following PySpark code to prepare the data:\n\n    deduped_df = df.dropDuplicates()\n    deduped_df.summary(\"count\", \"mean\", \"stddev\").show()\n    from pyspark.sql.functions import approx_count_distinct\n    deduped_df.select(approx_count_distinct(\"user_id\")).show()\n\n  The developer notices that after running dropDuplicates() without arguments, some rows that differ only in the\n  event_timestamp column remain. The developer wants to de-duplicate based only on user_id and event_type, keeping\n  one row per unique combination of these two columns.\n\n\n  Which code change achieves this deduplication requirement?","options":[{"key":"A","text":"Replace df.dropDuplicates() with df.groupBy(\"user_id\", \"event_type\").count()"},{"key":"B","text":"Replace df.dropDuplicates() with df.distinct().select(\"user_id\", \"event_type\")"},{"key":"C","text":"Replace df.dropDuplicates() with df.dropDuplicates([\"user_id\", \"event_type\"])"},{"key":"D","text":"Replace df.dropDuplicates() with df.drop(\"event_timestamp\").dropDuplicates()"}],"correct":["C"],"explanation":"dropDuplicates([columnas]) define explícitamente las claves de deduplicación; sin columnas considera el registro completo, incluidos timestamps de ingestión.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"dropDuplicates([columnas]) define explícitamente las claves de deduplicación; sin columnas considera el registro completo, incluidos timestamps de ingestión.","wrongWhy":{"A":"GROUP BY + COUNT agrega y no conserva la fila original elegida.","B":"DISTINCT devuelve combinaciones únicas seleccionadas, pero descarta otras columnas.","D":"Eliminar timestamp puede alterar innecesariamente el esquema de salida."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":230,"topic":"Exam A","question":"A data engineer needs to enforce row-level security on main.secure.events(region STRING, event_id STRING). Members of\n  the account group all_regions need to see all rows. All other users need to see only rows where region = 'EU'.\n\n\n  Which SQL sequence satisfies the requirement?","options":[{"key":"A","text":"CREATE FUNCTION main.secure.region_filter(region STRING)\n\n    RETURN IF(is_account_group_member('all_regions'), true, region = 'EU');"},{"key":"B","text":"ALTER TABLE main.secure.events\n\n    SET ROW FILTER main.secure.region_filter ON (region);\n    CREATE FUNCTION main.secure.region_filter(region STRING)\n    RETURN IF(is_account_group_member('all_regions'), true, region = 'EU');"},{"key":"C","text":"ALTER VIEW main.secure.events\n\n    SET ROW FILTER main.secure.region_filter ON (region);\n\n    CREATE FUNCTION main.secure.region_filter(region STRING)\n    RETURN IF(is_account_group_member('all_regions'), true, region = 'EU');"},{"key":"D","text":"ALTER TABLE main.secure.events\n\n    ALTER COLUMN region\n    SET MASK main.secure.region_filter;\n    CREATE FUNCTION main.secure.region_filter(region STRING)\n    RETURN IF(is_account_group_member('all_regions'), true, region = 'EU');\n\n    ALTER TABLE main.secure.events\n    SET ROW FILTER main.secure.region_filter USING COLUMNS (region);"}],"correct":["A"],"explanation":"Crear la función SQL no basta para activar un row filter sobre una tabla. Se necesita además ALTER TABLE ... SET ROW FILTER ... ON (...), según la documentación de Unity Catalog.","issue":"La opción A únicamente crea una función de filtrado, pero no parece incluir su asociación con la tabla mediante SET ROW FILTER. Conviene revisar la pregunta y su clave.","scorable":true,"category":"Gobierno / Sharing","answerWhy":"El PDF marca A, pero solo definir una función SQL no impone seguridad en filas. Además se requiere asociar esa función a la tabla con ALTER TABLE ... SET ROW FILTER ... ON (region). Ninguna opción reproduce claramente esa secuencia correcta.","wrongWhy":{"B":"Crea/usa el filtro en orden incorrecto: primero debe existir la función antes de enlazarla.","C":"ALTER VIEW no aplica el row filter a la tabla requerida y además se invoca antes de crear la función.","D":"Column mask oculta valores de columna, no decide qué filas ve el usuario."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":231,"topic":"Exam A","question":"A governance team is evaluating whether to use Unity Catalog attribute-based access control (ABAC) policies or manually\n  applied row filters and column masks to protect sensitive data across their catalog.\n\n\n  Why should the team use ABAC policies instead of manually applied row filters and column masks?","options":[{"key":"A","text":"ABAC policies use governed tags to dynamically match tables and columns, so a single policy defined on a catalog\n\n       automatically applies to all current and future tables within that catalog without per-table configuration."},{"key":"B","text":"ABAC policies allow row filters and column masks to be written in Python and Scala directly, whereas manually\n\n       applied filters and masks can only use SQL user-defined functions."},{"key":"C","text":"ABAC policies can be applied to views and materialized views in addition to tables, whereas manually applied row\n\n       filters and column masks can only be applied to tables."},{"key":"D","text":"ABAC policies support applying multiple distinct row filters to the same table for a single user at query time, whereas\n\n       manually applied row filters are limited to one filter per table."}],"correct":["A"],"explanation":"Las políticas ABAC utilizan etiquetas gobernadas para aplicar restricciones de forma centralizada a los objetos etiquetados en vez de configurarlos tabla por tabla.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"Las políticas ABAC utilizan etiquetas gobernadas para aplicar restricciones de forma centralizada a los objetos etiquetados en vez de configurarlos tabla por tabla.","wrongWhy":{"B":"Las políticas ABAC se definen con funciones SQL y etiquetas gobernadas, no porque admitan directamente Python/Scala.","C":"No es el mecanismo principal de alcance por etiquetas para vistas arbitrarias.","D":"No se trata de aplicar simultáneamente múltiples filtros arbitrarios a una tabla, sino de políticas gobernadas centralizadas."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"}]},{"id":232,"topic":"Exam A","question":"A data engineering team needs to ingest historical CSV files from a cloud storage location that already contains 50,000\n  existing files. They also expect new files to arrive continuously going forward. The team wants to use Auto Loader to\n  incrementally process both existing files and new arrivals efficiently.\n\n\n  Which Auto Loader mode should the team configure for this use case?","options":[{"key":"A","text":"Use file notification mode because it scales efficiently for both large numbers of existing files and continuous new\n\n       arrivals by using cloud storage events rather than repeatedly listing directories."},{"key":"B","text":"Use directory listing mode because it provides better performance for the initial processing of 50,000 existing files\n\n       through optimized incremental listing capabilities."},{"key":"C","text":"Use directory listing mode initially to process the 50,000 existing files, then reconfigure the stream to use file\n\n       notification mode for ongoing ingestion of new arrivals."},{"key":"D","text":"Use file notification mode only after all existing files have been processed, as it cannot efficiently handle large\n\n     volumes of pre-existing files."}],"correct":["A"],"explanation":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","wrongWhy":{"B":"Directory listing puede generar un listado costoso para 50.000 archivos y continuo crecimiento.","C":"Cambiar de modo a mitad de streaming es operativo innecesario para este caso.","D":"Las notificaciones pueden combinar detección inicial y eventos nuevos, no requieren vaciar primero la fuente."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Auto Loader","url":"https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/"}]},{"id":233,"topic":"Exam A","question":"A data engineer has multiple Unity Catalog-managed Delta tables that require regular maintenance. Currently, the data\n  engineer manually schedules OPTIMIZE and VACUUM jobs for each table, adjusting the frequency based on how often\n  each table is queried and updated. The engineer needs to eliminate this manual maintenance overhead and have the\n  platform automatically determine when and how to run these operations.\n\n\n  Which action should the engineer take to meet the requirements?","options":[{"key":"A","text":"Enable Liquid Clustering with CLUSTER BY on each table to automatically compact and remove stale data file
