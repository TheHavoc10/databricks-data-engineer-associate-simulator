s on a\n\n     scheduled basis."},{"key":"B","text":"Set the delta.autoOptimize.autoCompact and delta.autoOptimize.optimizeWrite table properties to trigger automatic\n\n     VACUUM and file compaction."},{"key":"C","text":"Configure Auto Loader with schema evolution enabled to automatically trigger OPTIMIZE and VACUUM after each\n\n     data ingestion batch completes."},{"key":"D","text":"Enable predictive optimization at the account, catalog, or schema level so the platform automatically identifies and\n\n     runs OPTIMIZE and VACUUM on managed tables."}],"correct":["D"],"explanation":"OPTIMIZE reorganiza/compacta archivos Delta para mejorar lecturas; Liquid Clustering y predictive optimization gestionan el layout de forma más automática. DESCRIBE HISTORY permite revisar operaciones registradas.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"OPTIMIZE reorganiza/compacta archivos Delta para mejorar lecturas; Liquid Clustering y predictive optimization gestionan el layout de forma más automática. DESCRIBE HISTORY permite revisar operaciones registradas.","wrongWhy":{"A":"Liquid clustering reordena datos, no decide automáticamente cuándo lanzar VACUUM.","B":"Auto Compaction y Optimize Write no equivalen al servicio completo Predictive Optimization (OPTIMIZE y VACUUM).","C":"Auto Loader no planifica mantenimiento de tablas gestionadas UC."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Liquid clustering","url":"https://docs.databricks.com/aws/en/delta/clustering"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":234,"topic":"Exam A","question":"A data engineering team needs to incrementally ingest customer transactions from a SaaS app into Data Intelligence\n  Platform with:\n  • Built-in change data capture (including updates and deletes)\n  • Automatic schema evolution\n  • Serverless execution with retries and minimal maintenance\n  • OAuth support and basic monitoring\n\n\n  Which solution meets all of these requirements?","options":[{"key":"A","text":"Use a Lakeflow Connect managed connector for the SaaS app with built-in CDC, schema evolution, OAuth, and\n\n     serverless compute with retries, then process downstream with Lakeflow Spark Declarative Pipelines."},{"key":"B","text":"Use Auto Loader on exported SaaS files and an SDP that calls the SaaS APIs, handling CDC, schema changes, OAuth,\n\n     and retries in your own code."},{"key":"C","text":"Schedule batch jobs per region that call SaaS REST APIs and write directly to silver tables with custom CDC and\n\n     schema evolution, and use system tables for ad hoc basic monitoring."},{"key":"D","text":"Use a Lakeflow Connect standard connector, implement MERGE-based CDC, schema evolution, and retries in\n\n     workflows, and set up a dedicated monitoring dashboard."}],"correct":["A"],"explanation":"Lakeflow Connect managed connectors reducen código de integración con orígenes empresariales y permiten, cuando el conector lo soporta, CDC e ingestión incremental hacia tablas gobernadas.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Lakeflow Connect managed connectors reducen código de integración con orígenes empresariales y permiten, cuando el conector lo soporta, CDC e ingestión incremental hacia tablas gobernadas.","wrongWhy":{"B":"Auto Loader sobre exports exige construir CDC/OAuth/errores a medida.","C":"API REST custom añade desarrollo y mantenimiento de cambios y retries.","D":"Standard connector no aporta directamente todas las capacidades gestionadas del SaaS."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Auto Loader","url":"https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":235,"topic":"Exam A","question":"A data engineer is designing a cost-optimized, event-driven pipeline. They configure a Lakeflow Job with a File Arrival\n  trigger to watch an S3 bucket. The job runs a notebook that uses Auto Loader with trigger(availableNow=True) to ingest\n  data into a Bronze table.\n\n\n  What is the technical relationship between the File Arrival trigger and Auto Loader in this integration pattern?","options":[{"key":"A","text":"Auto Loader must be configured in File Notification mode to work with a Lakeflow Job File Arrival trigger."},{"key":"B","text":"The File Arrival trigger starts the job run, while Auto Loader uses its internal checkpoint to independently identify\n\n       and process only the new files that have arrived since the last successful commit."},{"key":"C","text":"The File Arrival trigger automatically passes the specific file path of the new arrival to Auto Loader, allowing the\n\n       engineer to skip the source path configuration in the code."},{"key":"D","text":"Using a File Arrival trigger requires the engineer to disable Auto Loader's checkpointing to prevent the job from\n\n       processing the same file multiple times."}],"correct":["B"],"explanation":"Un trigger de llegada de archivo despierta el job; Auto Loader decide qué entradas nuevas procesar usando sus checkpoints. AvailableNow procesa el lote disponible y libera el compute.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Un trigger de llegada de archivo despierta el job; Auto Loader decide qué entradas nuevas procesar usando sus checkpoints. AvailableNow procesa el lote disponible y libera el compute.","wrongWhy":{"A":"Un File Arrival trigger no obliga a Auto Loader a un modo concreto; ambos gestionan responsabilidades diferentes.","C":"El trigger despierta el Job, pero Auto Loader necesita su propio origen/checkpoint.","D":"Quitar checkpoint rompe seguimiento incremental y aumenta riesgo de duplicados."},"sourceLinks":[{"label":"Auto Loader","url":"https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":236,"topic":"Exam A","question":"A data engineer is transforming a bronze table containing API response data into a silver table. The bronze table has a\n  user_profile column of type STRING that contains JSON data. An example value is:\n\n    '{\"user_id\": \"12345\", \"name\": \"John Smith\", \"age\": 32, \"email\": \"john@example.com\"}'\n\n  The silver table needs to make this data easily queryable for analytics without requiring JSON parsing in every\n  downstream query.\n\n\n  Which approach standardizes this column for the silver table?","options":[{"key":"A","text":"SELECT\n\n        get_json_object(user_profile, 'user_id') AS user_id,\n        get_json_object(user_profile, 'name')    AS name,\n        get_json_object(user_profile, 'age')     AS age,\n        get_json_object(user_profile, 'email')   AS email\n    FROM bronze_table;"},{"key":"B","text":"SELECT\n\n        user_profile.user_id       AS user_id,\n        user_profile.name          AS name,\n        CAST(user_profile.age AS INT)    AS age,\n\n        user_profile.email                       AS email\n    FROM bronze_table;"},{"key":"C","text":"SELECT\n\n        from_json(\n            user_profile,\n            'user_id STRING, name STRING, age STRING, email STRING'\n        ) AS parsed_profile\n    FROM bronze_table;"},{"key":"D","text":"SELECT\n\n        get_json_object(user_profile, '$.user_id') AS user_id,\n        get_json_object(user_profile, '$.name')    AS name,\n        CAST(get_json_object(user_profile, '$.age') AS INT) AS age,\n        get_json_object(user_profile, '$.email')   AS email\n    FROM bronze_table;"}],"correct":["D"],"explanation":"Los campos JSON y STRUCT pueden proyectarse como columnas tipadas usando funciones específicas o rutas anidadas, evitando parsear el documento completo en cada consulta posterior.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"Los campos JSON y STRUCT pueden proyectarse como columnas tipadas usando funciones específicas o rutas anidadas, evitando parsear el documento completo en cada consulta posterior.","wrongWhy":{"A":"get_json_object necesita rutas JSONPath $., no simplemente el nombre del campo.","B":"user_profile es STRING y no admite acceso struct por punto hasta parsearse.","C":"from_json crea un struct parsed_profile, pero no expone directamente las columnas raíz tipadas como exige el ejemplo."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":237,"topic":"Exam A","question":"A data engineer is troubleshooting two different pipeline failures:\n  • Pipeline A fails with a java.lang.OutOfMemoryError is immediately thrown after the command display(df.collect()) is\n  called on a 100GB dataset.\n  • Pipeline B fails during a wide transformation (a join of two large tables) with an ExecutorLostFailure error message,\n  indicating executor memory exhaustion during shuffle.\n\n\n  Which action should the data engineer take to fix these two issues?","options":[{"key":"A","text":"For Pipeline A, switch to a Storage Optimized cluster; for Pipeline B, use a Compute Optimized cluster."},{"key":"B","text":"For Pipeline A, increase the spark.driver.memory; for Pipeline B, increase the spark.sql.shuffle.partitions or executor\n\n       memory."},{"key":"C","text":"For Pipeline A, increase the number of executors; for Pipeline B, increase the driver memory."},{"key":"D","text":"For both pipelines, enable Adaptive Query Execution (AQE) as it automatically manages memory allocation for both\n\n       the driver and executors."}],"correct":["B"],"explanation":"La Spark UI ayuda a localizar cuellos de botella de CPU, shuffle, spill, skew y memoria. El driver sufre al recoger datos localmente; los executors y el particionamiento afectan a los joins distribuidos.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"La Spark UI ayuda a localizar cuellos de botella de CPU, shuffle, spill, skew y memoria. El driver sufre al recoger datos localmente; los executors y el particionamiento afectan a los joins distribuidos.","wrongWhy":{"A":"Storage/Compute Optimized no identifica driver OOM vs executor shuffle OOM.","C":"Para el driver collect no se soluciona añadiendo ejecutores; aumenta memoria local o evita collect.","D":"AQE ayuda al shuffle pero no permite al driver albergar 100 GB colectados."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":238,"topic":"Exam A","question":"A data engineering team needs to integrate two data sources into Databricks:\n  • Clickstream Events: Ingesting 5,000 events per second from an Apache Kafka topic.\n  • Customer Master Data: Syncing only changed records every 4 hours from a Snowflake database.\n\n  The solution must meet two key requirements:\n  • Process the streaming clickstream data with a latency of under 30 seconds.\n  • Prevent the reprocessing of customer master data that has not changed.\n\n\n  Which data ingestion approach meets these requirements?","options":[{"key":"A","text":"Use Structured Streaming for Kafka and a Lakeflow Connect standard connector with full refresh for Snowflake."},{"key":"B","text":"Use Structured Streaming for Kafka and Lakeflow Connect managed connector with incremental mode for Snowflake."},{"key":"C","text":"Use spark.readStream() with Kafka and query Snowflake hourly with a time-based filter."},{"key":"D","text":"Use a non-incremental Snowflake connector with polling and fetch all data every 4 hours with MERGE operations."}],"correct":["B"],"explanation":"Lakeflow Connect managed connectors reducen código de integración con orígenes empresariales y permiten, cuando el conector lo soporta, CDC e ingestión incremental hacia tablas gobernadas.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Lakeflow Connect managed connectors reducen código de integración con orígenes empresariales y permiten, cuando el conector lo soporta, CDC e ingestión incremental hacia tablas gobernadas.","wrongWhy":{"A":"El full refresh de Snowflake reingiere registros sin cambios, incumpliendo incrementalidad.","C":"Un filtro temporal ad hoc requiere código/CDC y no garantiza deletes ni cambios.","D":"Extraer siempre la tabla completa añade trabajo y coste, aunque luego se haga MERGE."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"}]},{"id":239,"topic":"Exam A","question":"A data engineer configures a Databricks Lakeflow Job for daily customer data processing:\n  • Entry task: Single notebook loads raw data\n  • Parallel tasks:\n  o SQL query task for cleansing\n  o Notebook task for feature engineering\n  o Pipeline task for model updates\n  • Exit task: Dashboard refresh (must run after all parallel tasks complete)\n  • Requirement: Implement this dependency pattern using a DAG-based task graph\n\n\n  Which task configuration ensures all parallel tasks complete before the dashboard refresh task runs?","options":[{"key":"A","text":"Create separate Lakeflow Jobs for each parallel task and trigger them sequentially using external orchestration."},{"key":"B","text":"Add the dashboard task as dependent on all three parallel tasks using fan-in control flow."},{"key":"C","text":"Configure the parallel tasks with sequential dependencies so each task waits for the previous one to finish."},{"key":"D","text":"Set the dashboard task to depend only on the SQL query task; other tasks run independently."}],"correct":["B"],"explanation":"Lakeflow Jobs representa las tareas como un DAG. Las dependencias aseguran que una tarea se ejecute tras cumplir las condiciones de las anteriores, incluso con bifurcaciones paralelas y fan-in.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Lakeflow Jobs representa las tareas como un DAG. Las dependencias aseguran que una tarea se ejecute tras cumplir las condiciones de las anteriores, incluso con bifurcaciones paralelas y fan-in.","wrongWhy":{"A":"La orquestación externa adicional no es necesaria dentro de Lakeflow Jobs.","C":"Secuenciar las tres tareas elimina el paralelismo solicitado.","D":"Depender solo de SQL permitiría refrescar dashboard antes de que terminen feature/pipeline."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":240,"topic":"Exam A","question":"A data engineer has a PySpark DataFrame events_df which contains a nested device struct, which itself includes a nested\n  location struct, as shown:\n\n    event_id STRING,\n    device STRUCT<id: STRING, model: STRING, location: STRUCT<latitude: DOUBLE, longitude: DOUBLE>>,\n    event_ts TIMESTAMP\n\n  The goal is to flatten the nested fields into root-level columns while keeping the event identifiers and timestamp.\n\n\n  Which PySpark expression achieves this?","options":[{"key":"A","text":"events_df.select(\"event_id\", \"event_ts\", \"device.id\", \"device.model\", \"device.location.latitude\",\n\n    \"device.location.longitude\")"},{"key":"B","text":"events_df.withColumn(\"device_id\", events_df[\"device.id\"]).withColumn(\"device_model\",\n\n    events_df[\"device.model\"]).withColumn(\"location\", events_df[\"device.location\"])"},{"key":"C","text":"events_df.select(\"event_id\", \"device[id]\", \"device[model]\", \"device.location[latitude]\",\n\n    \"device.location[longitude]\", \"event_ts\")"},{"key":"D","text":"events_df.select(\"event_id\", \"event_ts\", \"device.*\")"}],"correct":["A"],"explanation":"Los campos JSON y STRUCT pueden proyectarse como columnas tipadas usando funciones específicas o rutas anidadas, evitando parsear el documento completo en cada consulta posterior.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"Los campos JSON y STRUCT pueden proyectarse como columnas tipadas usando funciones específicas o rutas anidadas, evitando parsear el documento completo en cada consulta posterior.","wrongWhy":{"B":"Solo añade campos nuevos y conserva location como struct sin aplanar lat/long.","C":"La notación entre corchetes no corresponde a esas rutas nested STRUCT como está escrita.","D":"device.* expande primer nivel, pero location sigue anidado."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":241,"topic":"Exam A","question":"A data engineer has developed a Python notebook in a Databricks workspace and has configured it to run as a scheduled\n  Job to process daily sales data. How are the storage and execution of this notebook managed within the Databricks\n  architecture?","options":[{"key":"A","text":"The notebook is stored securely and encrypted in the control plane, and the code executes in the compute plane\n\n       when the job runs."},{"key":"B","text":"The notebook is stored securely and encrypted in the compute plane, and the code executes in the control plane\n\n       when the job runs."},{"key":"C","text":"The notebook is stored securely and encrypted in Unity Catalog, and the code executes in Delta Lake when the job\n\n       runs."},{"key":"D","text":"The notebook is stored unencrypted in the workspace storage bucket, and the code executes on the cluster driver\n\n       node in the compute plane when the job runs."}],"correct":["A"],"explanation":"En la arquitectura clásica, el control plane alberga la interfaz web, los servicios de gestión y metadatos; el data plane ejecuta el cómputo y accede a los datos. El driver y los workers pertenecen al plano de ejecución.","issue":null,"scorable":true,"category":"Fundamentos / Otros","answerWhy":"En la arquitectura clásica, el control plane alberga la interfaz web, los servicios de gestión y metadatos; el data plane ejecuta el cómputo y accede a los datos. El driver y los workers pertenecen al plano de ejecución.","wrongWhy":{"B":"Invierte control/compute: la definición de notebook se guarda en servicio y la ejecución ocurre en compute.","C":"Unity Catalog no es el engine de ejecución de notebooks, ni Delta es compute.","D":"No se presupone almacenamiento sin cifrar ni gestión manual de archivos del notebook."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":242,"topic":"Exam A","question":"A data engineering team uses Declarative Automation Bundles (formerly Databricks Asset Bundles) to deploy the same\n  codebase across dev, test, and prod environments. The team wants environment-specific behavior to be applied only\n  through bundle configuration, without modifying notebooks, job definitions, or deployment logic during promotion.\n\n\n  Which approach applies environment-specific configuration while meeting this requirement?","options":[{"key":"A","text":"Use separate Git branches per environment so each branch can contain environment-specific configuration values."},{"key":"B","text":"Define bundle variables and reference them from bundle resources, then override variable values per environment\n\n     using bundle targets."},{"key":"C","text":"Parameterize environment-specific values inside notebooks and set those parameters when each job run is triggered."},{"key":"D","text":"Deploy the same bundle once and edit job settings in the workspace UI for each environment after deployment."}],"correct":["B"],"explanation":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","wrongWhy":{"A":"Las ramas no sustituyen la parametrización del bundle al promover el mismo código.","C":"Modificar valores en cada ejecución requiere coordinación adicional y no define recursos por target.","D":"Editar manualmente recursos después del deploy rompe reproducibilidad y CI/CD."},"sourceLinks":[{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":243,"topic":"Exam A","question":"A data engineer observes that an ETL job in Databricks has increased its execution time from 5 minutes (baseline) to 12\n  minutes over the past week. Using the Lakeflow Jobs run history view, the engineer needs to identify whether the\n  slowdown is consistent or intermittent and determine the root cause.\n\n\n  Which action should the engineer take to analyze execution time trends against the baseline?","options":[{"key":"A","text":"Compare cluster metrics in Lakeflow Jobs run history to spot resource spikes causing delays."},{"key":"B","text":"Archive old job runs and resets the baseline counter to ensure accurate comparison of current performance."},{"key":"C","text":"Rerun the job immediately to establish a new baseline since historical data becomes irrelevant after seven days."},{"key":"D","text":"Increase cluster size automatically whenever execution time exceeds the previous run's duration."}],"correct":["A"],"explanation":"La Spark UI ayuda a localizar cuellos de botella de CPU, shuffle, spill, skew y memoria. El driver sufre al recoger datos localmente; los executors y el particionamiento afectan a los joins distribuidos.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"La Spark UI ayuda a localizar cuellos de botella de CPU, shuffle, spill, skew y memoria. El driver sufre al recoger datos localmente; los executors y el particionamiento afectan a los joins distribuidos.","wrongWhy":{"B":"Archivar runs borra la línea de referencia histórica.","C":"Reejecutar sin revisar tendencias no determina si la regresión es recurrente o intermitente.","D":"Autoescalar por última duración no revela la causa del cambio de rendimiento."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":244,"topic":"Exam A","question":"A data engineer maintains a Declarative Automation Bundle (formerly Databricks Asset Bundle), which deploys a\n  dashboard.\n\n\n  The databricks.yml includes:\n\n    bundle:\n      name: workspace_assets\n\n    variables:\n      dataset_catalog:\n        default: catalog_dev\n\n    targets:\n      dev:\n        variables:\n           dataset_catalog: catalog_dev\n      prod:\n\n          variables:\n            dataset_catalog: catalog_prod\n\n  Which set of actions will enable the dashboard to be deployed in prod using catalog_prod without changing the resource\n  definition?","options":[{"key":"A","text":"Run databricks bundle deploy --profile prod so the CLI selects targets.prod and applies dataset_catalog: catalog_prod\n\n     automatically."},{"key":"B","text":"Run databricks bundle deploy --target prod so the deployment uses targets.prod and overrides dataset_catalog to\n\n     catalog_prod."},{"key":"C","text":"Run databricks bundle execute --profile prod so the CLI selects targets.prod and applies dataset_catalog:\n\n     catalog_prod automatically."},{"key":"D","text":"Run databricks bundle deploy --var dataset_catalog=catalog_prod so the CLI selects targets.prod and applies\n\n     dataset_catalog: catalog_prod automatically."}],"correct":["B"],"explanation":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","wrongWhy":{"A":"--profile selecciona credenciales/conexión; --target selecciona configuración por entorno.","C":"bundle execute no es el comando de despliegue del bundle.","D":"--var fija un valor, pero no selecciona automáticamente targets.prod."},"sourceLinks":[{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"}]},{"id":245,"topic":"Exam A","question":"A data engineering team is designing the Gold layer in their Unity Catalog-governed lakehouse for downstream BI and\n  analytics users. The team wants to expose business-ready metrics with fast query performance and consistent definitions,\n  while keeping the transformation logic in Spark notebooks.\n\n\n  Which type of Gold layer object meets this requirement?","options":[{"key":"A","text":"A materialized view that precomputes aggregations from Silver tables on a schedule and is queried by BI tools for\n\n     faster, consistent analytics."},{"key":"B","text":"A streaming table that continuously ingests raw events from source systems and exposes them directly to BI users."},{"key":"C","text":"A view that directly references raw Bronze tables so BI tools can define their own joins and aggregations."},{"key":"D","text":"A collection of CSV files stored in a cloud storage object. BI users will parse the files to query the gold layer data."}],"correct":["A"],"explanation":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","wrongWhy":{"B":"Streaming table ingiere eventos, pero no proporciona necesariamente agregados materializados listos para BI.","C":"Una vista de Bronze fuerza al consumidor a hacer transformación y joins en tiempo de consulta.","D":"CSV son archivos no gobernados como Gold SQL optimizada."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":246,"topic":"Exam A","question":"A company has a strict 15-minute Service Level Agreement (SLA) for updating its currency exchange dashboard. The\n  source data arrives in small increments every few minutes. The data engineering team needs a triggering strategy for their\n  Lakeflow Job that keeps end-to-end latency within the SLA while minimizing compute costs and DBU consumption.\n\n\n  Which triggering strategy for the Lakeflow Job is the recommended way to meet this 15-minute SLA?","options":[{"key":"A","text":"Use a Scheduled trigger set to run every 12 minutes, with the streaming task configured to use Trigger.AvailableNow."},{"key":"B","text":"Use a Scheduled trigger set to run every 1 minute to ensure the SLA is never at risk."},{"key":"C","text":"Use a File Arrival trigger configured to fire every time a single JSON file lands in the bucket."},{"key":"D","text":"Use a Continuous trigger to ensure data is processed as soon as it arrives."}],"correct":["A"],"explanation":"Un trigger de llegada de archivo despierta el job; Auto Loader decide qué entradas nuevas procesar usando sus checkpoints. AvailableNow procesa el lote disponible y libera el compute.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Un trigger de llegada de archivo despierta el job; Auto Loader decide qué entradas nuevas procesar usando sus checkpoints. AvailableNow procesa el lote disponible y libera el compute.","wrongWhy":{"B":"Cada minuto probablemente consume más DBUs de los necesarios para SLA de 15 minutos.","C":"Arrancar con cada fichero puede producir ejecuciones excesivas y overhead.","D":"Un stream continuo mantiene compute activo; el requisito pide coste mínimo con SLA de 15 min."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":247,"topic":"Exam A","question":"A data engineering team ingests customer transaction data from three enterprise sources (SQL database, S3, and Kafka\n  stream) into Unity Catalog tables. The data must maintain lineage and support compliance audits requiring historical\n  snapshots.\n\n\n  Which Lakeflow Connect configuration satisfies both the governance and audit requirements?","options":[{"key":"A","text":"Single Lakeflow connector with all three sources, direct Delta writes, and disabled table versioning to reduce storage\n\n     costs."},{"key":"B","text":"Separate connectors per source with CDC, individual Unity Catalog schemas per source, and table versioning enabled\n\n     for audit compliance."},{"key":"C","text":"Separate connectors with full-load sync only, archival of historical data, and external tables for audit queries."},{"key":"D","text":"Single connector with batch scheduling, shared Unity Catalog schema, and incremental snapshots stored externally."}],"correct":["B"],"explanation":"Separar los pipelines por origen permite aplicar captura de cambios, control de esquema, gobierno y versionado apropiados a cada tipo de fuente.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Separar los pipelines por origen permite aplicar captura de cambios, control de esquema, gobierno y versionado apropiados a cada tipo de fuente.","wrongWhy":{"A":"Un único conector para Kafka/SQL/S3 no representa adecuadamente protocolos diferentes y además deshabilita versiones.","C":"Full-load ignora CDC/eficiencia y pierde trazabilidad operativa fina.","D":"Un único conector batch no sirve para Kafka streaming y snapshot externo no asegura lineage UC."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":248,"topic":"Exam A","question":"A data engineer needs to support a Unity Catalog Delta table catalog.schema.sales that is currently registered as an\n  external table. New requirements state:\n  • Automatic file cleanup after a drop is handled by the platform.\n  • Minimal downtime during migration while keeping the same table name, permissions, and history.\n  • Enforced name-based access through Unity Catalog (no path-based access).\n\n\n  Which action should the data engineer take to meet the requirements?","options":[{"key":"A","text":"Run ALTER TABLE catalog.schema.sales SET MANAGED to convert and meet the goals"},{"key":"B","text":"Run DROP TABLE catalog.schema.sales PURGE to delete files and meet goals"},{"key":"C","text":"Run ALTER TABLE catalog.schema.sales SET LOCATION to switch external paths now"},{"key":"D","text":"Create a new managed table with CTAS and migrate workloads to that table today"}],"correct":["A"],"explanation":"Una tabla managed delega en la plataforma el ciclo de vida de datos y metadatos; en una tabla external, los archivos permanecen en la ubicación externa al borrar el registro del catálogo. Las migraciones deben validar dependencias.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"La conversión SET MANAGED requiere comprobar prerequisitos de versión/runtime y compatibilidad de tablas; no asumir que conserva todas las propiedades en todas las versiones.","wrongWhy":{"B":"DROP TABLE PURGE implica pérdida de datos y no conserva nombre/historial/permisos de forma segura.","C":"SET LOCATION cambia ruta pero no convierte lifecycle external a managed.","D":"CTAS crea un objeto nuevo y requiere migración de permisos/historial."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":249,"topic":"Exam A","question":"A data engineer has finished developing a new Declarative Automation Bundle (formerly Databricks Asset Bundle) for a\n  streaming pipeline. They need to ensure the configuration is syntactically correct, push the code to the workspace, and\n  finally trigger the pipeline to verify it runs as expected.\n\n\n  Which sequence of Databricks CLI commands should the engineer use to perform these steps in the correct order?","options":[{"key":"A","text":"databricks bundle init -> databricks bundle deploy -> databricks bundle run"},{"key":"B","text":"databricks bundle validate -> databricks bundle deploy -> databricks bundle run"},{"key":"C","text":"databricks bundle validate -> databricks bundle sync -> databricks bundle execute"},{"key":"D","text":"databricks bundle check -> databricks bundle upload -> databricks bundle start"}],"correct":["B"],"explanation":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","wrongWhy":{"A":"init crea un scaffold, no valida un bundle ya construido; faltaría validate.","C":"bundle sync no reemplaza deploy/run para publicar y ejecutar un resource.","D":"Esos subcomandos no conforman el flujo oficial bundle validate/deploy/run."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":250,"topic":"Exam A","question":"A data engineer has configured a Lakeflow Job that runs daily to ingest customer transaction data from a legacy relational\n  database. The extracted data must be written directly to a Unity Catalog table and be immediately queryable via SQL. The\n  team needs to ensure full data lineage is preserved.\n\n\n  Which action enables this data ingestion with direct landing in Unity Catalog, preserved lineage, and immediate SQL query\n  ability?","options":[{"key":"A","text":"Stage data in cloud storage via REST API, then load with a separate job"},{"key":"B","text":"Use spark.read.format(\"jdbc\") and write with saveAsTable(\"catalog.schema.table\")"},{"key":"C","text":"Extract to Pandas DataFrame, convert to Spark, then save() to external path"},{"key":"D","text":"Use ODBC pooling to extract all records in one batch and write to /dbfs/"}],"correct":["B"],"explanation":"El acceso JDBC permite leer bases de datos mediante el conector adecuado; para registrar una tabla gestionada por catálogo se puede escribir el DataFrame con saveAsTable.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"El acceso JDBC permite leer bases de datos mediante el conector adecuado; para registrar una tabla gestionada por catálogo se puede escribir el DataFrame con saveAsTable.","wrongWhy":{"A":"Staging por REST añade una fase innecesaria y dificulta lineage directo.","C":"Pandas local no escala con tablas grandes y guardarlo solo por path evita metadata UC.","D":"Escribir en /dbfs no registra automáticamente una tabla gobernada en Unity Catalog."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":251,"topic":"Exam A","question":"A data engineer is designing a bronze-to-silver pipeline on the Databricks Data Intelligence Platform. The source system\n  sends daily CSV files, and over time, new optional columns are added.\n\n\n  The data engineer wants a storage format and table feature that together ensure the following:\n  • The table prevents writes that do not conform to the defined schema.\n  • The table can evolve its schema to include new optional columns without having to manually recreate the table.\n  • Previous versions of the table can be queried later for debugging and auditing.\n\n\n  Which solution fulfills the requirements?","options":[{"key":"A","text":"Use a Parquet table with Spark's default schema inference and rely on re-running the job when the schema changes."},{"key":"B","text":"Use an external table with Auto Loader schema inference for CSV files."},{"key":"C","text":"Use a Delta table with its native capabilities."},{"key":"D","text":"Use a Delta table with schema enforcement and recreate the table whenever new columns are added."}],"correct":["C"],"explanation":"Delta Lake aporta transacciones ACID, esquema y un registro de versiones sobre almacenamiento abierto. Esto permite lecturas y escrituras fiables, recuperación histórica y convivencia de batch y streaming.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Delta Lake aporta transacciones ACID, esquema y un registro de versiones sobre almacenamiento abierto. Esto permite lecturas y escrituras fiables, recuperación histórica y convivencia de batch y streaming.","wrongWhy":{"A":"Parquet puro no incluye transaction log ACID, Time Travel y enforcement completos.","B":"External table + inferencia no garantiza transaccionalidad/historial Delta.","D":"No es necesario recrear Delta cada vez: schema evolution permite ampliar columnas bajo control."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":252,"topic":"Exam A","question":"A data engineer is designing a Databricks Job that includes a Notebook task for data cleansing and a SQL Query task for\n  generating a summary report. The summary report must only execute after the cleansing task completes successfully.\n\n\n  How should the dependency be configured in the Lakeflow Jobs task graph?","options":[{"key":"A","text":"Select the cleansing task as a 'Run if' dependency in the summary report task configuration."},{"key":"B","text":"Set both tasks to run on the same schedule with a five-minute start delay for the report."},{"key":"C","text":"Configure the cleansing task to use an 'On Failure' trigger to start the summary report."},{"key":"D","text":"Place both tasks in the same notebook and use a standard Python function call."}],"correct":["A"],"explanation":"Lakeflow Jobs representa las tareas como un DAG. Las dependencias aseguran que una tarea se ejecute tras cumplir las condiciones de las anteriores, incluso con bifurcaciones paralelas y fan-in.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Lakeflow Jobs representa las tareas como un DAG. Las dependencias aseguran que una tarea se ejecute tras cumplir las condiciones de las anteriores, incluso con bifurcaciones paralelas y fan-in.","wrongWhy":{"B":"Retrasar cinco minutos no asegura que la limpieza haya terminado con éxito.","C":"On Failure ejecutaría el informe justo cuando falla limpieza.","D":"Un único notebook puede secuenciar, pero la pregunta exige dependencia entre tareas de Lakeflow Job."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":253,"topic":"Exam A","question":"A notebook task check_volume calculates a daily data volume and writes it to a Lakeflow Jobs taskValue named\n  record_count. If the count is greater than 1 million, the job should run high_volume_pipeline; otherwise, it should run\n  normal_pipeline.\n\n\n  Which control-flow feature should be used?","options":[{"key":"A","text":"Add an If/else condition task that reads the record_count task value and routes to different downstream tasks."},{"key":"B","text":"Use a For each task over the record_count and stop when it is below the threshold."},{"key":"C","text":"Configure additional retries for check_volume until the count exceeds the threshold."},{"key":"D","text":"Configure Run if conditions based purely on task status."}],"correct":["A"],"explanation":"Una tarea If/else utiliza valores de salida de tareas anteriores para dirigir la ejecución del DAG hacia ramas alternativas.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Una tarea If/else utiliza valores de salida de tareas anteriores para dirigir la ejecución del DAG hacia ramas alternativas.","wrongWhy":{"B":"For each itera listas de elementos; no es la bifurcación por un umbral único.","C":"Los retries de un paso no son una condición para ramificar workflows.","D":"Run if basado solo en status no puede comparar record_count con 1M."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":254,"topic":"Exam A","question":"A data engineer is cleaning a bronze table that receives the same customer records from multiple source systems.\n  Duplicate rows have the same customer_id and email but different ingestion_timestamp values. The silver table should\n  contain only one record per unique combination of customer_id and email.\n\n\n  Which PySpark operation correctly deduplicates based on the business keys?","options":[{"key":"A","text":"df.dropDuplicates(['customer_id', 'email'])"},{"key":"B","text":"df.groupBy('customer_id', 'email').agg(max('ingestion_timestamp').alias('latest_ts'))"},{"key":"C","text":"df.select('customer_id', 'email').distinct()"},{"key":"D","text":"df.distinct()"}],"correct":["A"],"explanation":"dropDuplicates([columnas]) define explícitamente las claves de deduplicación; sin columnas considera el registro completo, incluidos timestamps de ingestión.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"dropDuplicates([columnas]) define explícitamente las claves de deduplicación; sin columnas considera el registro completo, incluidos timestamps de ingestión.","wrongWhy":{"B":"groupBy con max convierte registros en agregados y pierde otras columnas del registro original.","C":"select+distinct pierde campos que Silver debe conservar.","D":"distinct compara todas las columnas, incluyendo timestamp, por eso quedan duplicados lógicos."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":255,"topic":"Exam A","question":"A data engineer ingests semi-structured JSON logs into a Delta table using Auto Loader with schema evolution enabled. A\n  new string field userAgent appears in the JSON.\n\n\n  What happens to the new userAgent field?","options":[{"key":"A","text":"All existing data is backfilled with a default value for userAgent and made non-nullable."},{"key":"B","text":"The new userAgent field is added as a new nullable column in the Delta table, populated for new data."},{"key":"C","text":"Ingestion fails with a schema-mismatch error until the table is altered."},{"key":"D","text":"The new userAgent field is silently ignored, and its data is dropped for all new files."}],"correct":["B"],"explanation":"En ingesta de CSV/JSON hay que distinguir inferencia de esquema, schema hints y evolución del esquema. Un esquema nuevo puede añadirse de forma controlada o provocar un error, según la configuración.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"En ingesta de CSV/JSON hay que distinguir inferencia de esquema, schema hints y evolución del esquema. Un esquema nuevo puede añadirse de forma controlada o provocar un error, según la configuración.","wrongWhy":{"A":"Las filas antiguas reciben NULL salvo backfill explícito, no un valor por defecto obligatorio.","C":"Con schema evolution, la columna nueva puede incorporarse sin ALTER manual previo.","D":"La evolución habilitada evita ignorar silenciosamente el nuevo campo."},"sourceLinks":[{"label":"Auto Loader","url":"https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":256,"topic":"Exam A","question":"A data engineer is tasked with cleaning a bronze table. The requirement is to eliminate rows where either the\n  customer_email or the customer_phone field is null. This data cleaning must be performed in a single operation using a\n  single method call.\n\n\n  Which PySpark approach supports filtering multiple columns for nulls in one call?","options":[{"key":"A","text":"df.dropna(subset=['customer_email', 'customer_phone'])"},{"key":"B","text":"df.where('customer_email IS NOT NULL').where('customer_phone IS NOT NULL')"},{"key":"C","text":"df.na.drop(how='all')"},{"key":"D","text":"df.filter(col('customer_email').isNotNull() & col('customer_phone').isNotNull())"}],"correct":["A"],"explanation":"dropna(subset=[...]) descarta en una sola operación las filas con NULL en cualquiera de las columnas indicadas.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"dropna(subset=[...]) descarta en una sola operación las filas con NULL en cualquiera de las columnas indicadas.","wrongWhy":{"B":"Se puede obtener el mismo filtro, pero hace dos llamadas, no una.","C":"how=all no elimina filas con un único NULL entre los campos.","D":"Es funcionalmente razonable, pero se usa filter en lugar de un único método dropna como requiere el test."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":257,"topic":"Exam A","question":"A data engineer converts an external table to a managed table. A structured streaming job that reads from this table\n  continues running during the conversion. After the conversion completes, the streaming job stops processing new\n  records.\n\n\n  How should the data engineer resolve this?","options":[{"key":"A","text":"Grant the streaming job additional permissions on the new managed storage location"},{"key":"B","text":"Restart the streaming job, so it picks up the new managed table location"},{"key":"C","text":"Run REFRESH TABLE on the converted table to update the streaming checkpoint"},{"key":"D","text":"Delete the streaming checkpoint directory and let the job reprocess from the beginning"}],"correct":["B"],"explanation":"Una tabla managed delega en la plataforma el ciclo de vida de datos y metadatos; en una tabla external, los archivos permanecen en la ubicación externa al borrar el registro del catálogo. Las migraciones deben validar dependencias.","issue":null,"scorable":true,"category":"Fundamentos / Otros","answerWhy":"Una tabla managed delega en la plataforma el ciclo de vida de datos y metadatos; en una tabla external, los archivos permanecen en la ubicación externa al borrar el registro del catálogo. Las migraciones deben validar dependencias.","wrongWhy":{"A":"No es simplemente un grant sobre storage: la conversión modifica la referencia física que usa el stream.","C":"REFRESH TABLE no reescribe el estado y rutas conservadas por el checkpoint de streaming.","D":"Borrar checkpoint provoca reprocess y posible duplicado, siendo una acción destructiva innecesaria."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":258,"topic":"Exam A","question":"A data engineer needs to find all customers who have never placed an order. The customers table contains customer_id,\n  customer_name, and other customer attributes. The orders table contains order_id, customer_id, and other order\n  attributes. Both tables share customer_id as the join key. The result must include only customer columns with no order-\n  related columns in the output.\n\n\n  Which expression exactly achieves this requirement?","options":[{"key":"A","text":"Inner join, then filter for NULL order_id"},{"key":"B","text":"Left anti-join from customers to orders"},{"key":"C","text":"Left outer join from orders to customers"},{"key":"D","text":"Full outer join, then filter where order_id is NULL"}],"correct":["B"],"explanation":"Un left anti join conserva únicamente las filas del DataFrame de la izquierda que no tienen coincidencia en la derecha, sin añadir columnas del lado derecho.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"Un left anti join conserva únicamente las filas del DataFrame de la izquierda que no tienen coincidencia en la derecha, sin añadir columnas del lado derecho.","wrongWhy":{"A":"Un INNER JOIN elimina precisamente las filas sin pedido.","C":"Parte de los pedidos, no de todos los clientes.","D":"Un FULL JOIN genera columnas de ambos lados y requiere filtros adicionales."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":259,"topic":"Exam A","question":"A data engineering team runs nightly batch ETL pipelines that transform large volumes of data stored in Delta Lake. The\n  workloads are predictable and run on a fixed schedule. The team wants automatic scaling and cost efficiency, paying only\n  for compute used during job execution.\n\n\n  Which Databricks compute option is appropriate for this workload?","options":[{"key":"A","text":"An all-purpose compute cluster configured with autoscaling."},{"key":"B","text":"A Databricks SQL warehouse configured for serverless execution."},{"key":"C","text":"A single-node compute cluster configured without autoscaling."},{"key":"D","text":"A job compute cluster triggered by a scheduled workflow."}],"correct":["D"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"A":"All-purpose puede quedar encendido entre jobs y requiere mayor operación.","B":"Serverless SQL warehouse sirve consultas SQL, no es el compute genérico del ETL batch del caso.","C":"Un nodo fijo sin escalado no se adapta al volumen variable."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":260,"topic":"Exam A","question":"A data engineer is attempting to grant a user access to a view. They successfully run GRANT SELECT ON VIEW\n  sales_catalog.market_data.summary TO analyst_group.\n\n\n  However, the analyst still receives an \"Insufficient Permissions\" error when trying to query the view.\n\n\n  In which order should the engineer verify the Hierarchy of Securable Objects to ensure the analyst has the necessary\n  usage permissions?","options":[{"key":"A","text":"CATALOG -> SCHEMA -> VIEW"},{"key":"B","text":"METASTORE -> TABLE -> VIEW"},{"key":"C","text":"STORAGE CREDENTIAL -> EXTERNAL LOCATION -> VIEW"},{"key":"D","text":"WORKSPACE -> CLUSTER -> VIEW"}],"correct":["A"],"explanation":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","wrongWhy":{"B":"No hay necesidad de recorrer objetos TABLE ajenos a la ruta catalog.schema.view.","C":"Las credenciales/location aplican a storage, pero el error de SELECT del consumidor exige analizar USAGE jerárquico.","D":"Workspace/cluster permiten ejecución pero no dan USE CATALOG/SCHEMA."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":261,"topic":"Exam A","question":"A data engineer needs Task C to run ONLY if Task A succeeds AND Task B fails.\n\n\n  Which dependency configuration implements this conditional logic?","options":[{"key":"A","text":"Task C depends on Task A (All done) and Task B (All done) with a condition widget."},{"key":"B","text":"Task C depends on Task A (Success) with Task B listed as a negative dependency."},{"key":"C","text":"Task C uses two dependency chains: Task A with All succeeded, Task B with at least one failed."},{"key":"D","text":"Create a Python task that checks dbutils.jobs.taskValues from Tasks A and B before running Task C."}],"correct":["C"],"explanation":"Lakeflow Jobs representa las tareas como un DAG. Las dependencias aseguran que una tarea se ejecute tras cumplir las condiciones de las anteriores, incluso con bifurcaciones paralelas y fan-in.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Lakeflow Jobs representa las tareas como un DAG. Las dependencias aseguran que una tarea se ejecute tras cumplir las condiciones de las anteriores, incluso con bifurcaciones paralelas y fan-in.","wrongWhy":{"A":"All done solo valida finalización, no impone por sí mismo A=success y B=failure.","B":"No existe una dependencia negativa simple así en el grafo estándar.","D":"Un Python task adicional puede implementar reglas pero se pide configurar el DAG sin código extra."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":262,"topic":"Exam A","question":"A data engineer is preparing a Declarative Automation Bundle (formerly Databricks Asset Bundle) to deploy a Lakeflow\n  pipeline.\n\n\n  To ensure the pipeline is deployed to the correct environment, where should the workspace-specific configurations, such\n  as the host URL and root storage path, be defined within the bundle project?","options":[{"key":"A","text":"In a global environment variable on the local development machine"},{"key":"B","text":"Within the Python source code of the Lakeflow pipeline"},{"key":"C","text":"In the targets section of the databricks.yml file"},{"key":"D","text":"Inside the README.md file of the bundle root directory"}],"correct":["C"],"explanation":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","wrongWhy":{"A":"Variables locales sin declaración de targets no hacen el despliegue portable y versionado.","B":"Incrustar URL/path en notebooks mezcla lógica de negocio con configuración del entorno.","D":"README documenta, no configura el target del bundle."},"sourceLinks":[{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":263,"topic":"Exam A","question":"A data engineer needs to ingest JSON change data from Salesforce into Unity Catalog-governed Delta tables with a low-\n  code, fully managed experience.\n\n\n  Which Databricks capability should the data engineer use?","options":[{"key":"A","text":"A Lakeflow Connect managed Salesforce connector that writes into Unity Catalog Delta tables"},{"key":"B","text":"Use the Salesforce REST API in a PySpark notebook to query changed records and write them to Delta tables"},{"key":"C","text":"Auto Loader reading JSON files from an S3 bucket exported by Salesforce"},{"key":"D","text":"Auto Loader with a file arrival trigger on DBFS"}],"correct":["A"],"explanation":"Lakeflow Connect managed connectors reducen código de integración con orígenes empresariales y permiten, cuando el conector lo soporta, CDC e ingestión incremental hacia tablas gobernadas.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Lakeflow Connect managed connectors reducen código de integración con orígenes empresariales y permiten, cuando el conector lo soporta, CDC e ingestión incremental hacia tablas gobernadas.","wrongWhy":{"B":"API Salesforce manual añade OAuth/CDC/retries a desarrollar.","C":"Exportar a S3 necesita un paso anterior, no es ingestión gestionada Salesforce directa.","D":"Auto Loader sobre DBFS detecta archivos, no implementa CDC SaaS."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":264,"topic":"Exam A","question":"A data engineer triggers a scheduled job but finds that the new run was not executed. The run history shows the run was\n  skipped with a concurrency-related queue message.\n\n\n  Which configuration should the engineer investigate?","options":[{"key":"A","text":"The SQL warehouse permissions for the task"},{"key":"B","text":"The task-level timeout_seconds configuration"},{"key":"C","text":"The job-level max_concurrent_runs setting and whether queueing is enabled"},{"key":"D","text":"The cluster spot-instance availability in the cloud provider"}],"correct":["C"],"explanation":"Los Jobs permiten programar, monitorizar y recuperar trabajos. Repair run reejecuta tareas fallidas o pendientes sin repetir necesariamente toda la ejecución ya completada.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Los Jobs permiten programar, monitorizar y recuperar trabajos. Repair run reejecuta tareas fallidas o pendientes sin repetir necesariamente toda la ejecución ya completada.","wrongWhy":{"A":"Permisos SQL warehouse provocan errores de autorización de tareas, no una cola de concurrencia.","B":"Timeout aplica a una ejecución ya lanzada, no a la cola max_concurrent_runs.","D":"Falta de instancias Spot puede provocar fallos de aprovisionamiento, no es el ajuste de concurrencia del Job."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":265,"topic":"Exam A","question":"A pipeline uses COPY INTO to ingest CSV files from cloud object storage into a Unity Catalog Delta table. Some files are\n  occasionally re-uploaded with corrections using the same filename.\n\n\n  The engineer needs the corrected data ingested as soon as it occurs.\n\n\n  What should the engineer do?","options":[{"key":"A","text":"Reload all files from the source path on each run"},{"key":"B","text":"Load corrections as new files and apply updates to the target table"},{"key":"C","text":"Recreate the target table before each run"},{"key":"D","text":"Overwrite the target Delta table on each run"}],"correct":["B"],"explanation":"COPY INTO recuerda qué archivos ya se han procesado y normalmente no los vuelve a cargar. Las correcciones deben gestionarse como nuevas entradas o mediante un proceso de actualización del destino.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"COPY INTO recuerda qué archivos ya se han procesado y normalmente no los vuelve a cargar. Las correcciones deben gestionarse como nuevas entradas o mediante un proceso de actualización del destino.","wrongWhy":{"A":"Recargar todo es costoso y no garantiza tratar reemplazo sobre mismos nombres sin duplicar.","C":"Recrear tabla pierde historia/permisos y es innecesario.","D":"Sobrescribir tabla completa borra contenido no afectado y genera coste."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":266,"topic":"Exam A","question":"A data engineer is running a Spark SQL job on Databricks and notices that joins between a small lookup table and a large\n  fact table are slow. The data engineer wants Spark to automatically send the small lookup table to all executors to speed\n  up the join.\n\n\n  Which configuration parameter should the data engineer adjust?","options":[{"key":"A","text":"spark.sql.shuffle.partitions"},{"key":"B","text":"spark.executor.memory"},{"key":"C","text":"spark.sql.autoBroadcastJoinThreshold"},{"key":"D","text":"spark.default.parallelism"}],"correct":["C"],"explanation":"El broadcast join replica una tabla pequeña entre los ejecutores, evitando redistribuir la tabla grande durante el join. El umbral automático es configurable.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El broadcast join replica una tabla pequeña entre los ejecutores, evitando redistribuir la tabla grande durante el join. El umbral automático es configurable.","wrongWhy":{"A":"shuffle.partitions afecta particiones tras shuffle pero no cuándo Spark decide usar broadcast.","B":"Aumentar memoria no cambia el umbral del optimizador para broadcast.","D":"default.parallelism no es la regla de broadcast join."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":267,"topic":"Exam A","question":"A data engineer is joining a very large events_df (billions of rows) with a small country_lookup_df (fewer than 10,000\n  rows) on the country_code column. The join is slow due to data shuffling.\n\n\n  How should the data engineer improve performance?","options":[{"key":"A","text":"Cache both DataFrames, then run the same join"},{"key":"B","text":"Persist both DataFrames, then run the same join"},{"key":"C","text":"broadcast events_df when performing the join"},{"key":"D","text":"broadcast country_lookup_df when performing the join"}],"correct":["D"],"explanation":"El broadcast join replica una tabla pequeña entre los ejecutores, evitando redistribuir la tabla grande durante el join. El umbral automático es configurable.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El broadcast join replica una tabla pequeña entre los ejecutores, evitando redistribuir la tabla grande durante el join. El umbral automático es configurable.","wrongWhy":{"A":"Cachear ambos DataFrames no evita automáticamente el shuffle.","B":"Persistir ambos tampoco impone estrategia broadcast.","C":"No se debe distribuir una tabla de miles de millones de filas a todos los executors."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":268,"topic":"Exam A","question":"A data engineer runs df.toPandas() on a wide DataFrame containing 50 million rows. The notebook cell fails with a\n  java.lang.OutOfMemoryError on the driver.\n\n\n  Which memory configuration is directly responsible for this failure?","options":[{"key":"A","text":"spark.memory.fraction is too low, limiting the storage memory available for caching"},{"key":"B","text":"spark.executor.memory is too low to process the DataFrame transformations"},{"key":"C","text":"spark.sql.shuffle.partitions is set too high, causing excessive memory consumption during shuffles"},{"key":"D","text":"spark.driver.memory is too low to hold the collected result set"}],"correct":["D"],"explanation":"La Spark UI ayuda a localizar cuellos de botella de CPU, shuffle, spill, skew y memoria. El driver sufre al recoger datos localmente; los executors y el particionamiento afectan a los joins distribuidos.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"La Spark UI ayuda a localizar cuellos de botella de CPU, shuffle, spill, skew y memoria. El driver sufre al recoger datos localmente; los executors y el particionamiento afectan a los joins distribuidos.","wrongWhy":{"A":"spark.memory.fraction reparte memoria gestionada, pero el OOM ocurre al colectar en driver.","B":"executor.memory es el heap de nodos de trabajo, no el del driver.","C":"Número de particiones de shuffle no es el parámetro directamente responsable de toPandas()."},"sourceLinks":[{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":269,"topic":"Exam A","question":"A data engineer investigates a slow stage in the Databricks Spark UI. The engineer scrolls down to the Summary Metrics\n  section for task durations, and they observe for that stage:\n  • 25th percentile duration: 40 seconds\n  • Median duration: 45 seconds\n  • 75th percentile duration: 50 seconds\n  • Max duration: 80 seconds\n\n\n  What is the interpretation of these metrics?","options":[{"key":"A","text":"There is a GC issue."},{"key":"B","text":"The stage likely suffers from data skew."},{"key":"C","text":"The stage is healthy."},{"key":"D","text":"The cluster is under-provisioned."}],"correct":["B"],"explanation":"La Spark UI ayuda a localizar cuellos de botella de CPU, shuffle, spill, skew y memoria. El driver sufre al recoger datos localmente; los executors y el particionamiento afectan a los joins distribuidos.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"La Spark UI ayuda a localizar cuellos de botella de CPU, shuffle, spill, skew y memoria. El driver sufre al recoger datos localmente; los executors y el particionamiento afectan a los joins distribuidos.","wrongWhy":{"A":"Esas diferencias de duración no señalan explícitamente GC; falta métrica de tiempo GC.","C":"Max de 80s frente a mediana de 45s indica dispersión y posibles stragglers.","D":"Cluster pequeño tendería a afectar a más tareas uniformemente; hay que estudiar skew primero."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":270,"topic":"Exam A","question":"A data engineer uploads a CSV file using the \"Create or modify a table using file upload\" option in Databricks. To avoid\n  incorrect schema inference, they disable Automatically detect column types before creating a Unity Catalog-managed\n  table.\n\n\n  What is the outcome?","options":[{"key":"A","text":"All columns are created with the STRING data type."},{"key":"B","text":"Numeric columns are inferred as numeric types; others are STRING."},{"key":"C","text":"Previously inferred column types are preserved."},{"key":"D","text":"Table creation fails because column types are not specified."}],"correct":["A"],"explanation":"En ingesta de CSV/JSON hay que distinguir inferencia de esquema, schema hints y evolución del esquema. Un esquema nuevo puede añadirse de forma controlada o provocar un error, según la configuración.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"En ingesta de CSV/JSON hay que distinguir inferencia de esquema, schema hints y evolución del esquema. Un esquema nuevo puede añadirse de forma controlada o provocar un error, según la configuración.","wrongWhy":{"B":"Con autodetección desactivada no se infieren automáticamente tipos numéricos de datos.","C":"No persisten inferencias que se han deshabilitado.","D":"El asistente puede crear columnas como STRING sin bloquear la tabla."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"}]},{"id":271,"topic":"Exam A","question":"A data engineer has a bundle with a job resource keyed as etl_job in databricks.yml. After running 'databricks bundle\n  deploy', the job appears in the workspace but has not executed.\n\n\n  Which command triggers execution of the deployed job?","options":[{"key":"A","text":"databricks jobs submit --json"},{"key":"B","text":"databricks bundle run etl_job"},{"key":"C","text":"databricks bundle deploy --run"},{"key":"D","text":"databricks bundle execute etl_job"}],"correct":["B"],"explanation":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","wrongWhy":{"A":"jobs submit podría ejecutar una tarea específica, pero no usa el recurso lógico etl_job del bundle como se pide.","C":"deploy publica recursos, no incorpora un --run estándar para ejecutarlos.","D":"bundle execute no es el comando para lanzar un job desde el bundle."},"sourceLinks":[{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":272,"topic":"Exam A","question":"A data engineering team is building a new data transformation notebook. During development, they need fast testing,\n  quick code changes, and easy debugging. Later, the notebook will run nightly as a scheduled job without human\n  intervention. They want to optimize for development speed.\n\n\n  Which compute should they use during development?","options":[{"key":"A","text":"Use instance pools."},{"key":"B","text":"Use classic job compute."},{"key":"C","text":"Use interactive compute."},{"key":"D","text":"Use SQL warehouses."}],"correct":["C"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"A":"Instance pools aceleran aprovisionamiento, pero no son el tipo de compute interactivo de iteración pedido.","B":"Job compute arranca para tareas automatizadas; no es lo óptimo al depurar manualmente.","D":"SQL Warehouse no es el compute de notebooks PySpark de desarrollo."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":273,"topic":"Exam A","question":"A data engineer is designing a Gold layer table for a BI team that needs to query complex aggregations. The requirements\n  state that the data should be precomputed to ensure low latency for dashboard users, but the underlying data changes\n  only once every few hours.\n\n\n  Which object type should be implemented in Unity Catalog to meet these requirements?","options":[{"key":"A","text":"Streaming table"},{"key":"B","text":"External table"},{"key":"C","text":"Materialized view"},{"key":"D","text":"View"}],"correct":["C"],"explanation":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","wrongWhy":{"A":"Streaming tables están centradas en ingesta incremental, no necesariamente agregación BI materializada.","B":"External table representa almacenamiento externo, no la materialización automática periódica de métricas.","D":"View normal calcula al consultar, sin precomputar las agregaciones."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":274,"topic":"Exam A","question":"A data engineer is building a Silver layer pipeline that should only execute after the Bronze layer table has been\n  successfully updated with new records.\n\n\n  Which trigger type in Databricks Jobs is specifically designed to orchestrate this dependency by reacting to changes in the\n  upstream Unity Catalog table?","options":[{"key":"A","text":"Table update trigger"},{"key":"B","text":"File arrival trigger"},{"key":"C","text":"Scheduled trigger"},{"key":"D","text":"Continuous trigger"}],"correct":["A"],"explanation":"Los Jobs permiten programar, monitorizar y recuperar trabajos. Repair run reejecuta tareas fallidas o pendientes sin repetir necesariamente toda la ejecución ya completada.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Los Jobs permiten programar, monitorizar y recuperar trabajos. Repair run reejecuta tareas fallidas o pendientes sin repetir necesariamente toda la ejecución ya completada.","wrongWhy":{"B":"File arrival detecta ficheros; el requisito es reaccionar a una tabla UC actualizada.","C":"Scheduled corre por reloj, no por evento de actualización de tabla.","D":"Continuous ejecuta de forma continua, sin depender exactamente de cambios en Bronze."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Data engineering / Lakeflow","url":"https://docs.databri
