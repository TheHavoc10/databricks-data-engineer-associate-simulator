  let links=el('div','evidence-list');for(const src of (q.sourceLinks||[])){let a=el('a','tiny doc-link',src.label+' ↗');a.href=src.url;a.target='_blank';a.rel='noopener noreferrer';links.append(a)}detail.append(links);
  detail.append(el('p','tiny muted','Criterios técnicos por opción. En preguntas con aviso, la marca refleja el PDF, no una validación de exactitud.'));box.append(detail)
 }
}
function addNumberGrid(box,s){let grid=el('div','nav-grid');s.ids.forEach((id,i)=>{let q=BY_ID.get(id);let stat=status(q,s);let cls='number-btn'+(i===s.pos?' now':'')+(stat?' '+stat:'')+(!q.scorable?' issue':'')+(app.bookmarks[id]?' bookmarked':'');let b=btn(String(i+1),()=>{if(s.finished){s.pos=i;explainOpen=false;save();go('review')}else move(i)},cls,{title:`Pregunta original ${id}`});grid.append(b)});box.append(grid);let legend=el('div','status-legend');legend.append(el('span','','● Verde: correcta'),el('span','','● Rojo: error'),el('span','','● Borde naranja: guardada'));box.append(legend)}
function sessionCounts(s){let n={correct:0,wrong:0,unanswered:0,invalid:0};for(const id of s.ids){let a=s.checks[id];if(a==='correct')n.correct++;else if(a==='wrong')n.wrong++;else if(a==='invalid')n.invalid++;else n.unanswered++}return n}
function showSummary(){let r=$('#root'),s=app.session,c=sessionCounts(s);let assessed=s.mode==='exam'?s.ids.length:c.correct+c.wrong,score=assessed?Math.round(c.correct/assessed*100):0;r.append(heading('Resultados de tu sesión','Análisis y próximos pasos para mejorar.','SESIÓN FINALIZADA'));
 let panel=makePanel('padded');let hero=el('div','summary-hero');let ring=el('div','score-circle');ring.style.setProperty('--p',score);let inside=el('div','score-circle-inner');inside.append(el('strong','',score+'%'),el('span','',s.mode==='exam'?'sobre examen':'sobre respondidas'));ring.append(inside);let v=el('div','');v.append(el('h2','minititle',`${c.correct} correctas · ${c.wrong} incorrectas`),el('p','small muted',`${c.unanswered} sin responder · ${s.ids.length} en la sesión`));let br=el('div','flex');br.append(btn('Revisar respuestas',()=>{s.pos=0;save();go('review')},'btn primary'),btn('Nueva sesión',()=>{app.session=null;go('home')},'btn'),btn('Repasar fallos',()=>startSession('errors'),'btn',{disabled:!QUESTIONS.some(q=>app.history[q.id]?.lastCorrect===false)}));v.append(br);hero.append(ring,v);panel.append(hero);r.append(panel);
 let stats=makePanel('padded');stats.style.marginTop='16px';stats.append(el('h2','minititle','Rendimiento por materia (histórico)'));topicBars(stats,s.ids);r.append(stats);let qnav=makePanel('padded');qnav.style.marginTop='16px';qnav.append(el('h2','minititle','Revisar una pregunta'));addNumberGrid(qnav,s);r.append(qnav)}
function showReview(){const root=$('#root'),s=app.session;if(!s||!s.finished){go('practice');return}let q=current(),index=s.pos;root.append(heading(`Revisión: pregunta ${index+1} de ${s.ids.length}`,`Pregunta original #${q.id} · ${q.category}`,'RESULTADOS DEL SIMULACRO'));let panel=makePanel('padded');let b=el('div','question-title');b.append(renderRich(q.question));panel.append(b);let choices=el('div','option-grid');let selected=s.answers[q.id]||[];for(const o of q.options){let c='option'+(q.correct.includes(o.key)?' correct':selected.includes(o.key)?' wrong':'');let d=el('div',c);d.append(el('span','choice',o.key));let body=el('div','option-body');body.append(renderRich(o.text));d.append(body);choices.append(d)}panel.append(choices);showFeedback(panel,q,s,true);panel.append(ratingButtons(q));if(q.issue){let issue=el('div','result-notice warn');issue.append(el('strong','','Aviso de revisión'),el('p','',q.issue));panel.append(issue)}let row=el('div','action-footer');row.append(btn('← Anterior',()=>{s.pos=Math.max(0,index-1);explainOpen=false;whyOpen=false;save();draw()},'btn',{disabled:index===0}),btn(index===s.ids.length-1?'Volver al resumen':'Siguiente →',()=>{if(index===s.ids.length-1)go('practice');else{s.pos++;explainOpen=false;whyOpen=false;save();draw()}},'btn dark'));panel.append(row);root.append(panel)}
function errorsPage(){let root=$('#root');root.append(heading('Repasar errores','Vuelve a intentarlo hasta consolidar lo que fallaste.'));let wrong=QUESTIONS.filter(q=>app.history[q.id]?.lastCorrect===false);let dueQs=QUESTIONS.filter(due);let box=makePanel('padded');box.append(el('h2','minititle',`${wrong.length} falladas en tu último intento`));box.append(el('p','small muted',`${dueQs.length} preguntas ya están programadas para repasar. Al acertar, desaparecen del listado de fallos; si aciertas por descarte, volverán pronto.`));let act=el('div','flex');act.append(btn('Repasar fallos →',()=>startSession('errors'),'btn primary',{disabled:!wrong.length}),btn('Repaso espaciado →',()=>{app.settings.selection='due';app.settings.mode='practice';startSession()},'btn',{disabled:!dueQs.length}));box.append(act);if(wrong.length){box.append(el('p','caps','Preguntas originales'));let list=el('div','flex');for(const q of wrong){let b=btn('#'+q.id,()=>{let ids=wrong.map(x=>x.id);app.session={ids,mode:'practice',kind:'errors',pos:ids.indexOf(q.id),answers:{},checks:{},finished:false,startedAt:Date.now()};go('practice')},'btn sm');list.append(b)}box.append(list)}root.append(box)}
function statsPage(){let root=$('#root'),h=allHistory();root.append(heading('Tu evolución','Histórico de sesiones, confianza y rendimiento por área.'));topStats(root);
 let wrap=makePanel('padded');wrap.append(el('h2','minititle','Progreso de estudio'));let first=QUESTIONS.filter(q=>app.history[q.id]?.firstCorrect===true).length,attempted=QUESTIONS.filter(q=>app.history[q.id]?.attempts>0).length;wrap.append(el('p','small muted',`${h.correct} aciertos y ${h.wrong} fallos en ${h.attempts} intentos. Aciertos a la primera: ${first} de ${attempted} preguntas vistas (${attempted?Math.round(first/attempted*100):0} %).`));let prog=el('div','progress-track');let fill=el('div','progress-fill');fill.style.width=(h.seen/QUESTIONS.length*100)+'%';prog.append(fill);wrap.append(prog);wrap.append(el('p','small muted',`${h.seen} de ${QUESTIONS.length} preguntas vistas · ${QUESTIONS.filter(mastered).length} dominadas · ${QUESTIONS.filter(due).length} pendientes de repaso.`));let line=el('div','action-footer');line.append(btn('Compartir progreso',shareProgress,'btn primary'),btn('Exportar progreso',exportData,'btn'),btn('Importar progreso',()=>$('#importFile').click(),'btn'),btn('Borrar historial',resetData,'btn outline-red'));wrap.append(line);root.append(wrap);
 let trend=makePanel('padded');trend.style.marginTop='16px';trend.append(el('h2','minititle','Evolución de los resultados'));trendChart(trend);root.append(trend);
 let cats=makePanel('padded');cats.style.marginTop='16px';cats.append(el('h2','minititle','Rendimiento por temática'));topicBars(cats);cats.append(el('p','tiny muted','Las tasas por tema son históricas e incluyen repeticiones. Usa también los aciertos a la primera para medir aprendizaje real.'));root.append(cats);
 let issues=makePanel('padded');issues.style.marginTop='16px';issuesList(issues);root.append(issues)}
function toast(msg){let x=$('.toast');if(x)x.remove();x=el('div','toast',msg);document.body.append(x);setTimeout(()=>x.remove(),4000)}

const SYNC_HASH='#progreso=';
function portData(){return {history:app.history,bookmarks:app.bookmarks,settings:app.settings,session:app.session,sessionResults:app.sessionResults}}
function viewedCount(d){return Object.values(d.history||{}).filter(x=>x&&x.attempts>0).length}
function b64Encode(a){let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64Decode(s){if(!/^[A-Za-z0-9_-]+$/.test(s))throw Error('Enlace inválido');const t=atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4));return Uint8Array.from(t,c=>c.charCodeAt(0))}
async function encodeProgress(){
 let bytes=new TextEncoder().encode(JSON.stringify({version:1,progress:portData()}));
 if(typeof CompressionStream==='function'){try{bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());return 'g'+b64Encode(bytes)}catch(e){}}
 return 'b'+b64Encode(bytes);
}
async function decodeProgress(t){
 if(!t||t.length>200000)throw Error('Enlace demasiado largo o incompleto');
 let bytes=b64Decode(t.slice(1));
 if(t[0]==='g'){if(typeof DecompressionStream!=='function')throw Error('Actualiza Safari para abrir este enlace comprimido');bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}
 else if(t[0]!=='b')throw Error('Formato desconocido');
 if(bytes.length>3000000)throw Error('Datos demasiado grandes');
 const x=JSON.parse(new TextDecoder().decode(bytes));
 if(x.version!==1||!x.progress||!x.progress.history||!x.progress.bookmarks||!Array.isArray(x.progress.sessionResults))throw Error('Datos del progreso inválidos');
 if(x.progress.session&&(!Array.isArray(x.progress.session.ids)||!x.progress.session.answers||!x.progress.session.checks))throw Error('Sesión inválida');
 return x.progress;
}
function progressModal(title){
 const backdrop=el('div','modal-scrim'),panel=el('section','modal share-modal');
 panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');panel.append(el('h2','',title));
 backdrop.append(panel);document.body.append(backdrop);
 backdrop.onclick=e=>{if(e.target===backdrop)backdrop.remove()};
 return {panel,close:()=>backdrop.remove()};
}
function modalActions(panel){const r=el('div','share-actions');panel.append(r);return r}
async function copyProgress(field){
 try{await navigator.clipboard.writeText(field.value);toast('Enlace copiado');return}catch(e){}
 field.focus();field.select();field.setSelectionRange(0,field.value.length);
 if(document.execCommand('copy'))toast('Enlace copiado');else toast('Selecciona y copia el enlace manualmente');
}
async function shareProgress(){
 const m=progressModal('Compartir progreso'),p=el('p','','Generando enlace…');m.panel.append(p);
 try{
  const url=location.href.split('#')[0]+SYNC_HASH+await encodeProgress();
  p.textContent='Abre este enlace desde Safari o tu ordenador. Al abrirlo podrás decidir si importar los datos.';
  const field=el('textarea','share-url');field.value=url;field.readOnly=true;m.panel.append(field);
  if(url.length>8000)m.panel.append(el('p','','Enlace largo: si la aplicación lo recorta, utiliza la exportación JSON.'));
  m.panel.append(el('p','','El enlace incluye tu progreso; quien lo reciba podrá consultarlo. No se sincroniza automáticamente.'));
  const row=modalActions(m.panel);
  row.append(btn('Copiar enlace',()=>copyProgress(field),'btn primary'));
  if(navigator.share)row.append(btn('Compartir…',async()=>{try{await navigator.share({title:'Progreso Databricks',url})}catch(e){}},'btn'));
  row.append(btn('Cerrar',m.close,'btn'));
 }catch(e){p.textContent='No se pudo generar el enlace: '+e.message;modalActions(m.panel).append(btn('Cerrar',m.close,'btn'))}
}
async function importProgressLink(){
 if(!location.hash.startsWith(SYNC_HASH))return;
 const token=location.hash.slice(SYNC_HASH.length);
 try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
 let incoming;
 try{incoming=await decodeProgress(token)}catch(e){const m=progressModal('Enlace inválido');m.panel.append(el('p','',e.message));modalActions(m.panel).append(btn('Cerrar',m.close,'btn'));return}
 const m=progressModal('Importar progreso compartido');
 m.panel.append(el('p','','Progreso recibido: '+viewedCount(incoming)+' preguntas vistas, '+Object.values(incoming.bookmarks).filter(Boolean).length+' favoritas y '+incoming.sessionResults.length+' sesiones.'));
 const local=viewedCount(app);
 m.panel.append(el('p','','Progreso local: '+local+' preguntas vistas. Importar sustituirá el progreso de este navegador, sin fusionarlo.'));
 const row=modalActions(m.panel);
 if(local||app.session||app.sessionResults.length)row.append(btn('Guardar copia local',exportData,'btn'));
 row.append(btn('Importar y continuar',()=>{
  if((local||app.session||app.sessionResults.length)&&!confirm('¿Sustituir el progreso local por el del enlace?'))return;
  app={...EMPTY(),...incoming,settings:{...EMPTY().settings,...(incoming.settings||{})},sessionResults:incoming.sessionResults||[]};
  page=app.session&&!app.session.finished?'practice':'home';save();m.close();draw();window.scrollTo(0,0);toast('Progreso importado');
 },'btn primary'));
 row.append(btn('Cancelar',m.close,'btn'));
}

function exportData(){let d=JSON.stringify({version:2,exportedAt:new Date().toISOString(),payload:app},null,2);let b=new Blob([d],{type:'application/json'}),url=URL.createObjectURL(b);let a=document.createElement('a');a.href=url;a.download='databricks_progreso_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Copia de seguridad descargada')}
$('#importFile').addEventListener('change',async function(){let f=this.files?.[0];if(!f)return;try{let json=JSON.parse(await f.text()),x=json.payload;if(!x||typeof x.history!=='object'||typeof x.bookmarks!=='object')throw Error('Formato inválido');if(!confirm('¿Sustituir el progreso local por el del archivo importado?'))return;app={...EMPTY(),...x,settings:{...EMPTY().settings,...(x.settings||{})},sessionResults:x.sessionResults||[]};save();go('home');toast('Progreso importado correctamente')}catch(e){alert('No se pudo importar el archivo: '+e.message)}this.value=''});
function resetData(){if(!confirm('¿Eliminar todos los intentos, favoritos y sesiones guardadas de este navegador?'))return;app=EMPTY();save();go('home');toast('Progreso reiniciado')}
function draw(){const root=$('#root');root.replaceChildren();nav();if(page==='home')home();else if(page==='practice')showQuestion();else if(page==='review')showReview();else if(page==='errors')errorsPage();else if(page==='stats')statsPage();else home();}
window.addEventListener('keydown',(e)=>{if(e.altKey||e.ctrlKey||e.metaKey||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;let s=app.session;if(!s||s.finished||page!=='practice')return;if(/^[1-5]$/.test(e.key)){let q=current(),opt=q.options[Number(e.key)-1];if(opt)answerClick(opt.key)}else if(e.key==='ArrowRight'){e.preventDefault();move(s.pos+1)}else if(e.key==='ArrowLeft'){e.preventDefault();move(s.pos-1)}});
clockHandle=setInterval(()=>{let s=app.session;if(!s||s.finished||s.mode!=='exam')return;if(Date.now()-s.startedAt>=s.durationMs){finish(true);toast('Tiempo agotado: el examen se ha entregado automáticamente')}else{let label=[...document.querySelectorAll('.pill')].find(x=>x.textContent.startsWith('⏱ '));if(label)label.textContent=timerText(s)}},1000);
draw();
importProgressLink();
</script>
