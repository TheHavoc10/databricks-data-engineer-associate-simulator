 have the appropriate\n  permissions.\n\n\n  In which location can the data engineer review their permissions on the table?","options":[{"key":"A","text":"Jobs"},{"key":"B","text":"Dashboards"},{"key":"C","text":"Catalog Explorer"},{"key":"D","text":"Repos"}],"correct":["C"],"explanation":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","wrongWhy":{"A":"Jobs muestra ejecuciones; los grants de una tabla están en Catalog Explorer.","B":"Dashboards muestran análisis, no permisos técnicos de tabla.","D":"Repos es gestión de código, no de grants UC."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":97,"topic":"Exam A","question":"A data engineer is running code in a Databricks Repo that is cloned from a central Git repository. A colleague of the data\n  engineer informs them that changes have been made and synced to the central Git repository. The data engineer now\n  needs to sync their Databricks Repo to get the changes from the central Git repository.\n\n\n  Which Git operation does the data engineer need to run to accomplish this task?","options":[{"key":"A","text":"Clone"},{"key":"B","text":"Pull"},{"key":"C","text":"Merge"},{"key":"D","text":"Push"}],"correct":["B"],"explanation":"Git Pull incorpora cambios remotos; Commit registra cambios locales y los branches permiten desarrollar versiones paralelas. Algunas operaciones de Git se gestionan en el proveedor remoto.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Git Pull incorpora cambios remotos; Commit registra cambios locales y los branches permiten desarrollar versiones paralelas. Algunas operaciones de Git se gestionan en el proveedor remoto.","wrongWhy":{"A":"Clone crea una copia nueva, no refresca una existente.","C":"Merge resuelve integrar ramas, no traer simplemente los commits remotos.","D":"Push publica desde local hacia remoto."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":98,"topic":"Exam A","question":"Which file format is used for storing Delta Lake Table?","options":[{"key":"A","text":"CSV"},{"key":"B","text":"Parquet"},{"key":"C","text":"JSON"},{"key":"D","text":"Delta"}],"correct":["B"],"explanation":"Una tabla Delta combina archivos de datos Parquet con el registro transaccional _delta_log, que almacena metadatos y el historial de cambios.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Una tabla Delta combina archivos de datos Parquet con el registro transaccional _delta_log, que almacena metadatos y el historial de cambios.","wrongWhy":{"A":"CSV no es el formato físico principal de los datos Delta.","C":"JSON se utiliza en entradas del log, no como formato tabular principal.","D":"Delta es el formato de tabla, que normalmente usa Parquet para los archivos de datos."},"sourceLinks":[{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":99,"topic":"Exam A","question":"A data architect has determined that a table of the following format is necessary:\n\n\n    employeeId       startDate       avgRating\n    a1               2009-01-06      5.5\n    a2               2018-11-21      7.1\n    ...              ...             ...\n\n  Which code block is used by SQL DDL command to create an empty Delta table in the above format regardless of whether\n  a table already exists with this name?","options":[{"key":"A","text":"CREATE OR REPLACE TABLE table_name ( employeeId STRING, startDate DATE, avgRating FLOAT )"},{"key":"B","text":"CREATE OR REPLACE TABLE table_name WITH COLUMNS ( employeeId STRING, startDate DATE, avgRating FLOAT\n\n    ) USING DELTA"},{"key":"C","text":"CREATE TABLE IF NOT EXISTS table_name ( employeeId STRING, startDate DATE, avgRating FLOAT )"},{"key":"D","text":"CREATE TABLE table_name AS SELECT employeeId STRING, startDate DATE, avgRating FLOAT"}],"correct":["A"],"explanation":"CREATE TABLE es una instrucción DDL. CREATE OR REPLACE TABLE permite sustituir una tabla existente con una nueva definición, a diferencia de IF NOT EXISTS.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"CREATE TABLE es una instrucción DDL. CREATE OR REPLACE TABLE permite sustituir una tabla existente con una nueva definición, a diferencia de IF NOT EXISTS.","wrongWhy":{"B":"WITH COLUMNS no es esa sintaxis CREATE TABLE.","C":"IF NOT EXISTS conservaría una tabla anterior con definición antigua; se solicita reemplazar si existe.","D":"CTAS necesita SELECT de datos con expresiones, no una declaración de tipos como ésta."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":100,"topic":"Exam A","question":"A data engineer has been given a new record of data:\n\n    id STRING = 'a1'\n    rank INTEGER = 6\n    rating FLOAT = 9.4\n\n  Which SQL commands can be used to append the new record to an existing Delta table my_table?","options":[{"key":"A","text":"INSERT INTO my_table VALUES ('a1', 6, 9.4)"},{"key":"B","text":"INSERT VALUES ('a1', 6, 9.4) INTO my_table"},{"key":"C","text":"UPDATE my_table VALUES ('a1', 6, 9.4)"},{"key":"D","text":"UPDATE VALUES ('a1', 6, 9.4) my_table"}],"correct":["A"],"explanation":"INSERT INTO ... VALUES permite añadir una fila nueva a una tabla con los valores indicados en el orden esperado.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"INSERT INTO ... VALUES permite añadir una fila nueva a una tabla con los valores indicados en el orden esperado.","wrongWhy":{"B":"INSERT INTO tabla VALUES es el orden SQL, no INSERT VALUES ... INTO.","C":"UPDATE necesita SET y filtro; no sirve para añadir una fila con VALUES.","D":"No es sintaxis válida de UPDATE ni de INSERT."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":101,"topic":"Exam A","question":"A data engineer has realized that the data files associated with a Delta table are incredibly small. They want to compact\n  the small files to form larger files to improve performance.\n\n\n  Which keyword can be used to compact the small files?","options":[{"key":"A","text":"OPTIMIZE"},{"key":"B","text":"VACUUM"},{"key":"C","text":"COMPACTION"},{"key":"D","text":"REPARTITION"}],"correct":["A"],"explanation":"OPTIMIZE reorganiza/compacta archivos Delta para mejorar lecturas; Liquid Clustering y predictive optimization gestionan el layout de forma más automática. DESCRIBE HISTORY permite revisar operaciones registradas.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"OPTIMIZE reorganiza/compacta archivos Delta para mejorar lecturas; Liquid Clustering y predictive optimization gestionan el layout de forma más automática. DESCRIBE HISTORY permite revisar operaciones registradas.","wrongWhy":{"B":"VACUUM elimina archivos obsoletos, no compacta.","C":"No es el comando admitido.","D":"Repartition modifica particiones Spark, no realiza OPTIMIZE Delta."},"sourceLinks":[{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":102,"topic":"Exam A","question":"A data engineer wants to create a data entity from a couple of tables. The data entity must be used by other data\n  engineers in other sessions. It also must be saved to a physical location.\n\n\n  Which of the following data entities should the data engineer create?","options":[{"key":"A","text":"Table"},{"key":"B","text":"Function"},{"key":"C","text":"View"},{"key":"D","text":"Temporary view"}],"correct":["A"],"explanation":"Una vista temporal se limita a la sesión y no materializa datos; una tabla persiste los datos para poder ser consultados desde otras sesiones.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Una vista temporal se limita a la sesión y no materializa datos; una tabla persiste los datos para poder ser consultados desde otras sesiones.","wrongWhy":{"B":"Una función calcula datos, no es una tabla persistida.","C":"Una vista lógica normalmente no materializa archivos propios.","D":"Una vista temporal ni persiste datos ni es reusable entre sesiones."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":103,"topic":"Exam A","question":"A data engineer runs a statement every day to copy the previous day’s sales into the table transactions. Each day's\n  sales are in their own file in the location \"/transactions/raw\".\n\n\n  Today, the data engineer runs the following command to complete this task:\n\n    COPY INTO transactions\n    FROM \"/transactions/raw\"\n    FILEFORMAT = PARQUET;\n\n  After running the command today, the data engineer notices that the number of records in table transactions has not\n  changed.\n\n\n  What explains why the statement might not have copied any new records into the table?","options":[{"key":"A","text":"The format of the files to be copied were not included with the FORMAT_OPTIONS keyword."},{"key":"B","text":"The COPY INTO statement requires the table to be refreshed to view the copied rows."},{"key":"C","text":"The previous day's file has already been copied into the table."},{"key":"D","text":"The PARQUET file format does not support COPY INTO."}],"correct":["C"],"explanation":"COPY INTO recuerda qué archivos ya se han procesado y normalmente no los vuelve a cargar. Las correcciones deben gestionarse como nuevas entradas o mediante un proceso de actualización del destino.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"COPY INTO recuerda qué archivos ya se han procesado y normalmente no los vuelve a cargar. Las correcciones deben gestionarse como nuevas entradas o mediante un proceso de actualización del destino.","wrongWhy":{"A":"FILEFORMAT indica el tipo de archivo sin necesitar FORMAT_OPTIONS.","B":"La tabla refleja nuevas escrituras sin REFRESH especial.","D":"COPY INTO soporta Parquet."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":104,"topic":"Exam A","question":"Which command can be used to write data into a Delta table while avoiding the writing of duplicate records?","options":[{"key":"A","text":"DROP"},{"key":"B","text":"INSERT"},{"key":"C","text":"MERGE"},{"key":"D","text":"APPEND"}],"correct":["C"],"explanation":"MERGE INTO permite aplicar inserciones, actualizaciones y, con determinadas cláusulas, eliminaciones comparando una fuente con el destino mediante una condición de correspondencia. INSERT INTO únicamente añade filas.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"MERGE INTO permite aplicar inserciones, actualizaciones y, con determinadas cláusulas, eliminaciones comparando una fuente con el destino mediante una condición de correspondencia. INSERT INTO únicamente añade filas.","wrongWhy":{"A":"DROP elimina objetos, no evita duplicados dentro de una tabla.","B":"INSERT no comprueba claves existentes.","D":"APPEND añade sin realizar matching."},"sourceLinks":[{"label":"Delta: operaciones MERGE","url":"https://docs.databricks.com/aws/en/delta/merge"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":105,"topic":"Exam A","question":"A data analyst has created a Delta table sales that is used by the entire data analysis team. They want help from the data\n  engineering team to implement a series of tests to ensure the data is clean. However, the data engineering team uses\n  Python for its tests rather than SQL.\n\n  Which command could the data engineering team use to access sales in PySpark?","options":[{"key":"A","text":"SELECT * FROM sales"},{"key":"B","text":"`spark.table(\"sales\")`"},{"key":"C","text":"`spark.sql(\"sales\")`"},{"key":"D","text":"`spark.delta.table(\"sales\")`"}],"correct":["B"],"explanation":"spark.table(nombre) obtiene una tabla como DataFrame; spark.sql(consulta) ejecuta una sentencia SQL y devuelve el resultado como DataFrame.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"spark.table(nombre) obtiene una tabla como DataFrame; spark.sql(consulta) ejecuta una sentencia SQL y devuelve el resultado como DataFrame.","wrongWhy":{"A":"Es SQL aislado, no devuelve un DataFrame desde Python.","C":"spark.sql exige SELECT u otra sentencia SQL completa, no solo el identificador sales.","D":"spark.delta.table no es una API estándar PySpark."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":106,"topic":"Exam A","question":"A data engineer has created a new database using the following command:\n\n    CREATE DATABASE IF NOT EXISTS customer360;\n\n  In which location will the customer360 database be located?","options":[{"key":"A","text":"dbfs:/user/hive/database/customer360"},{"key":"B","text":"dbfs:/user/hive/warehouse"},{"key":"C","text":"dbfs:/user/hive/customer360"},{"key":"D","text":"dbfs:/user/hive/database"}],"correct":["B"],"explanation":"DESCRIBE DATABASE muestra propiedades del esquema/base de datos, incluida su ubicación en los entornos donde se expone. Los valores de ubicación por defecto pueden depender del metastore y del tipo de catálogo.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"DESCRIBE DATABASE muestra propiedades del esquema/base de datos, incluida su ubicación en los entornos donde se expone. Los valores de ubicación por defecto pueden depender del metastore y del tipo de catálogo.","wrongWhy":{"A":"Esa ruta no corresponde al warehouse por defecto de esquemas Hive clásicos.","C":"Falta el directorio warehouse; la ubicación se organiza bajo ese almacén.","D":"Tampoco corresponde a la ruta predeterminada usada en el ejemplo."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":107,"topic":"Exam A","question":"A data engineer is attempting to drop a Spark SQL table my_table and runs the following command:\n\n    DROP TABLE IF EXISTS my_table;\n\n  After running this command, the engineer notices that the data files and metadata files have been deleted from the file\n  system.\n\n\n  What is the reason behind the deletion of all these files?","options":[{"key":"A","text":"The table was managed"},{"key":"B","text":"The table's data was smaller than 10 GB"},{"key":"C","text":"The table did not have a location"},{"key":"D","text":"The table was external"}],"correct":["A"],"explanation":"Una tabla managed delega en la plataforma el ciclo de vida de datos y metadatos; en una tabla external, los archivos permanecen en la ubicación externa al borrar el registro del catálogo. Las migraciones deben validar dependencias.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Una tabla managed delega en la plataforma el ciclo de vida de datos y metadatos; en una tabla external, los archivos permanecen en la ubicación externa al borrar el registro del catálogo. Las migraciones deben validar dependencias.","wrongWhy":{"B":"No existe regla de borrado basada en si una tabla tiene menos de 10 GB.","C":"Una managed también tiene ubicación física; lo que importa es quién gestiona su ciclo de vida.","D":"En external, DROP TABLE retira metadatos pero normalmente no elimina sus archivos."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":108,"topic":"Exam A","question":"A data engineer needs to create a table in Databricks using data from a CSV file at location /path/to/csv.\n\n\n  They run the following command:\n\n    CREATE TABLE new_table\n    ______\n    OPTIONS (\n        header = \"true\",\n        delimiter = \"|\"\n    )\n    LOCATION \"path/to/csv\"\n\n  Which of the following lines of code fills in the above blank to successfully complete the task?","options":[{"key":"A","text":"`FROM \"path/to/csv\"`"},{"key":"B","text":"`USING CSV`"},{"key":"C","text":"`FROM CSV`"},{"key":"D","text":"`USING DELTA`"}],"correct":["B"],"explanation":"El acceso JDBC permite leer bases de datos mediante el conector adecuado; para registrar una tabla gestionada por catálogo se puede escribir el DataFrame con saveAsTable.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"El acceso JDBC permite leer bases de datos mediante el conector adecuado; para registrar una tabla gestionada por catálogo se puede escribir el DataFrame con saveAsTable.","wrongWhy":{"A":"FROM path no es cláusula de formato de datos en CREATE TABLE; hace falta USING CSV.","C":"FROM CSV no es la sintaxis para identificar datasource de una tabla.","D":"USING DELTA trataría la ruta como Delta, pero son ficheros CSV."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":109,"topic":"Exam A","question":"What is a benefit of creating an external table from Parquet rather than CSV when using a CREATE TABLE AS SELECT\n  statement?","options":[{"key":"A","text":"Parquet files can be partitioned"},{"key":"B","text":"Parquet files will become Delta tables"},{"key":"C","text":"Parquet files have a well-defined schema"},{"key":"D","text":"Parquet files have the ability to be optimized"}],"correct":["C"],"explanation":"Parquet almacena metadatos de esquema y datos en formato columnar, facilitando lecturas tipadas y eficientes frente a texto CSV.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Parquet almacena metadatos de esquema y datos en formato columnar, facilitando lecturas tipadas y eficientes frente a texto CSV.","wrongWhy":{"A":"Particionar no es una propiedad exclusiva que diferencia Parquet frente a CSV.","B":"Parquet no se convierte automáticamente por arte de magia en Delta.","D":"Que pueda optimizarse no es la característica decisiva preguntada."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":110,"topic":"Exam A","question":"Which SQL keyword can be used to convert a table from a long format to a wide format?","options":[{"key":"A","text":"TRANSFORM"},{"key":"B","text":"PIVOT"},{"key":"C","text":"SUM"},{"key":"D","text":"CONVERT"}],"correct":["B"],"explanation":"PIVOT transforma categorías que estaban representadas en filas en nuevas columnas, pasando del formato largo al ancho.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"PIVOT transforma categorías que estaban representadas en filas en nuevas columnas, pasando del formato largo al ancho.","wrongWhy":{"A":"TRANSFORM no convierte categorías a columnas.","C":"SUM agrega valores pero no pivota.","D":"CONVERT no es el operador de pivoteado."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":111,"topic":"Exam A","question":"A data engineer has a Python variable table_name that they would like to use in a SQL query. They want to construct a\n  Python code block that will run the query using table_name.\n\n\n  They have the following incomplete code block:\n\n    ___(f\"SELECT customer_id, spend FROM {table_name}\")\n\n  What can be used to fill in the blank to successfully complete the task?","options":[{"key":"A","text":"`spark.delta.sql`"},{"key":"B","text":"`spark.sql`"},{"key":"C","text":"`spark.table`"},{"key":"D","text":"`dbutils.sql`"}],"correct":["B"],"explanation":"spark.table(nombre) obtiene una tabla como DataFrame; spark.sql(consulta) ejecuta una sentencia SQL y devuelve el resultado como DataFrame.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"spark.table(nombre) obtiene una tabla como DataFrame; spark.sql(consulta) ejecuta una sentencia SQL y devuelve el resultado como DataFrame.","wrongWhy":{"A":"No existe método spark.delta.sql estándar en SparkSession.","C":"spark.table() solo recibe nombre de tabla, no una consulta SQL compuesta dinámicamente.","D":"dbutils.sql no es la API de Spark SQL para ejecutar la consulta del ejemplo."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":112,"topic":"Exam A","question":"A data engineer is working with two tables. Each of these tables is displayed below in its entirety.\n\n\n  sales:\n\n\n    customer_id       spend         units\n    a1                28.94         7\n    a3                874.1223\n    a4                8.99          1\n\n  favorite_stores:\n\n\n    customer_id       store_id\n    a1                s1\n    a2                s1\n    a4                s2\n\n  The data engineer runs the following query to join these tables together:\n\n    SELECT\n        sales.customer_id,\n        sales.spend,\n        favorite_stores.store_id\n    FROM sales\n    LEFT JOIN favorite_stores\n    ON sales.customer_id = favorite_stores.customer_id;","options":[{"key":"A","text":"customer_id       spend     store_id\n\n    a1                28.94     s1\n    a2                NULL      s1\n    a4                8.99      s2"},{"key":"B","text":"customer_id       spend     store_id\n\n    a1                28.94     s1\n    a4                8.99      s2"},{"key":"C","text":"customer_id       spend      store_id\n\n    a1                28.94      s1\n    a3                874.12     NULL\n    a4                8.99       s2"},{"key":"D","text":"customer_id       spend      store_id\n\n    a1                28.94      s1\n    a2                NULL       s1\n    a3                874.12     NULL\n    a4                8.99       s2"}],"correct":["C"],"explanation":"Un LEFT JOIN conserva todas las filas de la tabla de la izquierda. Cuando no existe coincidencia en la derecha, las columnas de esa tabla aparecen como NULL; no se incorpora la fila a2 que solo existe a la derecha.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"Un LEFT JOIN conserva todas las filas de la tabla de la izquierda. Cuando no existe coincidencia en la derecha, las columnas de esa tabla aparecen como NULL; no se incorpora la fila a2 que solo existe a la derecha.","wrongWhy":{"A":"Incluye a2 que no existe en sales y omite a3, contrariando LEFT JOIN.","B":"Omite a3 aunque no tenga favorite_store: debería figurar como NULL.","D":"Incluye a2 del lado derecho, que LEFT JOIN desde sales no debe añadir."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":113,"topic":"Exam A","question":"A data engineer needs to apply custom logic to identify employees with more than 5 years of experience in array column\n  employees in table stores. The custom logic should create a new column exp_employees that is an array of all of the\n  employees with more than 5 years of experience for each row. In order to apply this custom logic at scale, the data\n  engineer wants to use the FILTER higher-order function.\n\n\n  Which code block successfully completes this task?","options":[{"key":"A","text":"SELECT\n\n        store_id,\n        employees,\n        FILTER (employees, i -> i.years_exp > 5) AS exp_employees\n    FROM stores;"},{"key":"B","text":"SELECT\n\n        store_id,\n        employees,\n        FILTER (exp_employees, i -> i.years_exp > 5) AS exp_employees\n    FROM stores;"},{"key":"C","text":"SELECT\n\n        store_id,\n        employees,\n        FILTER (employees, years_exp > 5) AS exp_employees\n    FROM stores;"},{"key":"D","text":"SELECT\n\n        store_id,\n        employees,\n        CASE WHEN employees.years_exp > 5 THEN employees\n            ELSE NULL\n        END AS exp_employees\n    FROM stores"}],"correct":["A"],"explanation":"Las funciones sobre arrays de Spark SQL permiten procesar estructuras anidadas y filtrar elementos con expresiones lambda sin expandir necesariamente todas las filas.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"Las funciones sobre arrays de Spark SQL permiten procesar estructuras anidadas y filtrar elementos con expresiones lambda sin expandir necesariamente todas las filas.","wrongWhy":{"B":"Filtra sobre la nueva columna exp_employees todavía inexistente, en vez del array employees.","C":"FILTER necesita lambda para referirse al elemento i y su campo years_exp.","D":"CASE no filtra el array ni construye una matriz de empleados seleccionados."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":114,"topic":"Exam A","question":"A data engineer that is new to using Python needs to create a Python function to add two integers together and return\n  the sum.\n\n  Which code block can the data engineer use to complete this task?","options":[{"key":"A","text":"function add_integers(x, y):\n\n        return x + y"},{"key":"B","text":"def add_integers(x, y):\n\n        print(x + y)"},{"key":"C","text":"def add_integers(x, y):\n\n        x + y"},{"key":"D","text":"def add_integers(x, y):\n\n        return x + y"}],"correct":["D"],"explanation":"El control de flujo de Python permite condicionar qué fragmentos se ejecutan. En una función Python hay que declararla con def y devolver el valor con return si se espera un resultado.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"El control de flujo de Python permite condicionar qué fragmentos se ejecutan. En una función Python hay que declararla con def y devolver el valor con return si se espera un resultado.","wrongWhy":{"A":"En Python se define con def y no function.","B":"print no equivale a return: la función retornaría None.","C":"Sin return Python devuelve None aunque evalúe la suma."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":115,"topic":"Exam A","question":"A data engineer has configured a Structured Streaming job to read from a table, manipulate the data, and then perform a\n  streaming write into a new table.\n\n\n  The code block used by the data engineer is below:\n\n    (spark.table(\"sales\")\n        .withColumn(\"avg_price\", col(\"sales\") / col(\"units\"))\n        .writeStream\n        .option(\"checkpointLocation\", checkpointPath)\n        .outputMode(\"complete\")\n        ___\n        .table(\"new_sales\")\n    )\n\n  Which line of code should the data engineer use to fill in the blank if the data engineer only wants the query to execute a\n  micro-batch to process data every 5 seconds?","options":[{"key":"A","text":"`trigger(\"5 seconds\")`"},{"key":"B","text":"`trigger(continuous=\"5 seconds\")`"},{"key":"C","text":"`trigger(once=\"5 seconds\")`"},{"key":"D","text":"`trigger(processingTime=\"5 seconds\")`"}],"correct":["D"],"explanation":"Los triggers de Structured Streaming controlan cuándo se disparan los microbatches. processingTime define una frecuencia; availableNow procesa los datos disponibles y finaliza.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Los triggers de Structured Streaming controlan cuándo se disparan los microbatches. processingTime define una frecuencia; availableNow procesa los datos disponibles y finaliza.","wrongWhy":{"A":"trigger(\"5 seconds\") no tiene la sintaxis necesaria; se utiliza processingTime=\"5 seconds\".","B":"continuous configura modo continuo, no microbatch temporal.","C":"once no acepta una duración para lanzar cada 5 segundos."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":116,"topic":"Exam A","question":"A data engineer is maintaining a data pipeline. Upon data ingestion, the data engineer notices that the source data is\n  starting to have a lower level of quality. The data engineer would like to automate the process of monitoring the quality\n  level.\n\n\n  Which of the following tools can the data engineer use to solve this problem?","options":[{"key":"A","text":"Auto Loader"},{"key":"B","text":"Unity Catalog"},{"key":"C","text":"Delta Lake"},{"key":"D","text":"Delta Live Tables"}],"correct":["D"],"explanation":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","wrongWhy":{"A":"Auto Loader gestiona archivos, no las expectativas de calidad entre capas.","B":"Unity Catalog aporta gobierno y grants, no expectativas ETL.","C":"Delta Lake aporta ACID, no monitorización de reglas personalizada."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":117,"topic":"Exam A","question":"A data engineer has three tables in a Delta Live Tables (DLT) pipeline. They have configured the pipeline to drop invalid\n  records at each table. They notice that some data is being dropped due to quality concerns at some point in the DLT\n  pipeline. They would like to determine at which table in their pipeline the data is being dropped.\n\n\n  Which approach can the data engineer take to identify the table that is dropping the records?","options":[{"key":"A","text":"They can set up separate expectations for each table when developing their DLT pipeline."},{"key":"B","text":"They can navigate to the DLT pipeline page, click on the “Error” button, and review the present errors."},{"key":"C","text":"They can set up DLT to notify them via email when records are dropped."},{"key":"D","text":"They can navigate to the DLT pipeline page, click on each table, and view the data quality statistics."}],"correct":["D"],"explanation":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","wrongWhy":{"A":"Crear expectations ayuda a validar, pero para saber cuál cayó hay que consultar estadísticas/observabilidad de cada dataset.","B":"El botón Error no refleja necesariamente filas válidas descartadas por EXPECT DROP ROW.","C":"Alertas genéricas no sustituyen métricas de calidad por tabla."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":118,"topic":"Exam A","question":"What is used by Spark to record the offset range of the data being processed in each trigger in order for Structured\n  Streaming to reliably track the exact progress of the processing so that it can handle any kind of failure by restarting\n  and/or reprocessing?","options":[{"key":"A","text":"Checkpointing and Write-ahead Logs"},{"key":"B","text":"Replayable Sources and Idempotent Sinks"},{"key":"C","text":"Write-ahead Logs and Idempotent Sinks"},{"key":"D","text":"Checkpointing and Idempotent Sinks"}],"correct":["D"],"explanation":"Structured Streaming registra el progreso mediante checkpoints, incluidos offsets y estado necesario para reanudar el flujo. La semántica de escritura depende también del destino.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Structured Streaming registra el progreso mediante checkpoints, incluidos offsets y estado necesario para reanudar el flujo. La semántica de escritura depende también del destino.","wrongWhy":{"A":"Write-ahead logs forman parte de los mecanismos, pero la opción marcada por el PDF enfatiza checkpoint e idempotencia del destino.","B":"Fuentes reproducibles y sinks idempotentes son propiedades deseables, pero no citan el checkpoint solicitado.","C":"Logs + sink idempotente no especifican el checkpoint de offsets."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":119,"topic":"Exam A","question":"What describes the relationship between Gold tables and Silver tables?","options":[{"key":"A","text":"Gold tables are more likely to contain aggregations than Silver tables."},{"key":"B","text":"Gold tables are more likely to contain valuable data than Silver tables."},{"key":"C","text":"Gold tables are more likely to contain a less refined view of data than Silver tables."},{"key":"D","text":"Gold tables are more likely to contain truthful data than Silver tables."}],"correct":["A"],"explanation":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","wrongWhy":{"B":"No es que Silver contenga datos sin valor; Gold suele estar preparada para agregaciones de consumo.","C":"Gold es más refinada, no menos.","D":"Gold no es necesariamente más veraz que Silver; ambos deben contener datos correctos."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":120,"topic":"Exam A","question":"What describes when to use the CREATE STREAMING LIVE TABLE (formerly CREATE INCREMENTAL LIVE TABLE) syntax over\n  the CREATE LIVE TABLE syntax when creating Delta Live Tables (DLT) tables using SQL?","options":[{"key":"A","text":"CREATE STREAMING LIVE TABLE should be used when the subsequent step in the DLT pipeline is static."},{"key":"B","text":"CREATE STREAMING LIVE TABLE should be used when data needs to be processed incrementally."},{"key":"C","text":"CREATE STREAMING LIVE TABLE should be used when data needs to be processed through complicated aggregations."},{"key":"D","text":"CREATE STREAMING LIVE TABLE should be used when the previous step in the DLT pipeline is static."}],"correct":["B"],"explanation":"Las tablas de streaming procesan cambios incrementalmente; el modo continuo mantiene el pipeline activo mientras que el modo triggered realiza una actualización y se detiene.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Las tablas de streaming procesan cambios incrementalmente; el modo continuo mantiene el pipeline activo mientras que el modo triggered realiza una actualización y se detiene.","wrongWhy":{"A":"La etapa siguiente estática no define si hay que procesar incrementos ahora.","C":"Las agregaciones complejas pueden ocurrir tanto en streaming como en materializadas.","D":"El carácter estático de la etapa previa no obliga a usar streaming."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":121,"topic":"Exam A","question":"A Delta Live Table pipeline includes two datasets defined using STREAMING LIVE TABLE. Three datasets are defined against\n  Delta Lake table sources using LIVE TABLE.\n\n\n  The table is configured to run in Production mode using the Continuous Pipeline Mode.\n\n\n  What is the expected outcome after clicking Start to update the pipeline assuming previously unprocessed data exists and\n  all definitions are valid?","options":[{"key":"A","text":"All datasets will be updated at set intervals until the pipeline is shut down. The compute resources will persist to\n\n     allow for additional testing."},{"key":"B","text":"All datasets will be updated once and the pipeline will shut down. The compute resources will persist to allow for\n\n     additional testing."},{"key":"C","text":"All datasets will be updated at set intervals until the pipeline is shut down. The compute resources will be deployed\n\n     for the update and terminated when the pipeline is stopped."},{"key":"D","text":"All datasets will be updated once and the pipeline will shut down. The compute resources will be terminated."}],"correct":["C"],"explanation":"Las tablas de streaming procesan cambios incrementalmente; el modo continuo mantiene el pipeline activo mientras que el modo triggered realiza una actualización y se detiene.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Las tablas de streaming procesan cambios incrementalmente; el modo continuo mantiene el pipeline activo mientras que el modo triggered realiza una actualización y se detiene.","wrongWhy":{"A":"Describe compute persistente de desarrollo; el modo producción no lo mantiene simplemente para tests.","B":"El pipeline Continuous no se limita a una sola actualización.","D":"El compute de continuous no se apaga tras una sola actualización."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":122,"topic":"Exam A","question":"Which type of workloads are compatible with Auto Loader?","options":[{"key":"A","text":"Streaming workloads"},{"key":"B","text":"Machine learning workloads"},{"key":"C","text":"Serverless workloads"},{"key":"D","text":"Batch workloads"}],"correct":["A"],"explanation":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","wrongWhy":{"B":"Machine learning consume datos, pero no define una fuente de ingestión Auto Loader.","C":"Serverless es modalidad de cómputo, no un tipo de fuente/processing en Auto Loader.","D":"Auto Loader usa la API de Spark Structured Streaming, aunque haya disparos finitos."},"sourceLinks":[{"label":"Auto Loader","url":"https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/"}]},{"id":123,"topic":"Exam A","question":"A data engineer has developed a data pipeline to ingest data from a JSON source using Auto Loader, but the engineer has\n  not provided any type inference or schema hints in their pipeline. Upon reviewing the data, the data engineer has noticed\n  that all of the columns in the target table are of the string type despite some of the fields only including float or boolean\n  values.\n\n\n  Why has Auto Loader inferred all of the columns to be of the string type?","options":[{"key":"A","text":"Auto Loader cannot infer the schema of ingested data"},{"key":"B","text":"JSON data is a text-based format"},{"key":"C","text":"Auto Loader only works with string data"},{"key":"D","text":"All of the fields had at least one null value"}],"correct":["B"],"explanation":"En ingesta de CSV/JSON hay que distinguir inferencia de esquema, schema hints y evolución del esquema. Un esquema nuevo puede añadirse de forma controlada o provocar un error, según la configuración.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"En ingesta de CSV/JSON hay que distinguir inferencia de esquema, schema hints y evolución del esquema. Un esquema nuevo puede añadirse de forma controlada o provocar un error, según la configuración.","wrongWhy":{"A":"Auto Loader puede inferir esquemas: no es imposible.","C":"No solo soporta strings; la opción por defecto es conservadora para JSON.","D":"Los NULL no obligan a que todas las columnas inferidas sean STRING."},"sourceLinks":[{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"label":"Auto Loader","url":"https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":124,"topic":"Exam A","question":"Which statement regarding the relationship between Silver tables and Bronze tables is always true?","options":[{"key":"A","text":"Silver tables contain a less refined, less clean view of data than Bronze data."},{"key":"B","text":"Silver tables contain aggregates while Bronze data is unaggregated."},{"key":"C","text":"Silver tables contain more data than Bronze tables."},{"key":"D","text":"Silver tables contain less data than Bronze tables."}],"correct":["D"],"explanation":"La regla general de Medallion es que Silver contiene datos más limpios y conformados que Bronze. No existe una norma que obligue a Silver a tener menos filas, por lo que la clave original requiere revisión.","issue":"La solución marca que Silver siempre tiene menos filas que Bronze; eso no es una regla general. La característica fundamental de Silver es la depuración y conformidad, no un número fijo de filas.","scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Esta pregunta carece de respuesta universal válida: Silver no tiene por qué contener menos filas que Bronze. Lo garantizado es su limpieza, tipado y conformidad, por lo que el solucionario D es discutible.","wrongWhy":{"A":"Elimina la jerarquía correcta: Silver debe ser más depurada que Bronze.","B":"Agregados suelen vivir en Gold y no distinguen universalmente Silver.","C":"Silver no tiene que tener más filas siempre."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":125,"topic":"Exam A","question":"Which query is performing a streaming hop from raw data to a Bronze table?","options":[{"key":"A","text":"(spark.table(\"sales\")\n\n        .groupBy(\"store\")\n        .agg(sum(\"sales\"))\n        .writeStream\n        .option(\"checkpointLocation\", checkpointPath)\n        .outputMode(\"complete\")\n\n\n           .table(\"newSales\")\n    )"},{"key":"B","text":"(spark.read.load(rawSalesLocation)\n\n        .write\n        .mode(\"append\")\n        .table(\"newSales\")\n    )"},{"key":"C","text":"(spark.table(\"sales\")\n\n        .withColumn(\"avgPrice\", col(\"sales\") / col(\"units\"))\n        .writeStream\n        .option(\"checkpointLocation\", checkpointPath)\n        .outputMode(\"append\")\n        .table(\"newSales\")\n    )"},{"key":"D","text":"(spark.readStream.load(rawSalesLocation)\n\n        .writeStream\n        .option(\"checkpointLocation\", checkpointPath)\n        .outputMode(\"append\")\n        .table(\"newSales\")\n    )"}],"correct":["D"],"explanation":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","wrongWhy":{"A":"Aggregación de una tabla existente se orienta a Gold, no ingestion raw a Bronze.","B":"read + write son batch, no streaming.","C":"Derivar avgPrice desde tabla es transformación posterior a Bronze."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":126,"topic":"Exam A","question":"A dataset has been defined using Delta Live Tables and includes an expectations clause:\n\n    CONSTRAINT valid_timestamp EXPECT (timestamp > '2020-01-01') ON VIOLATION DROP ROW\n\n  What is the expected behavior when a batch of data containing data that violates these constraints is processed?","options":[{"key":"A","text":"Records that violate the expectation cause the job to fail."},{"key":"B","text":"Records that violate the expectation are added to the target dataset and flagged as invalid in a field added to the\n\n       target dataset."},{"key":"C","text":"Records that violate the expectation are dropped from the target dataset and recorded as invalid in the event log."},{"key":"D","text":"Records that violate the expectation are added to the target dataset and recorded as invalid in the event log."}],"correct":["C"],"explanation":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","wrongWhy":{"A":"DROP ROW no hace fallar el job; eso sería FAIL UPDATE.","B":"No marca filas inválidas con una columna automática.","D":"WARN permitiría escribir inválidas y registrarlas; DROP ROW no las escribe."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":127,"topic":"Exam A","question":"A data engineer has a Job with multiple tasks that runs nightly. Each of the tasks runs slowly because the clusters take a\n  long time to start.\n\n\n  Which action can the data engineer perform to improve the start up time for the clusters used for the Job?","options":[{"key":"A","text":"They can use endpoints available in Databricks SQL"},{"key":"B","text":"They can use jobs clusters instead of all-purpose clusters"},{"key":"C","text":"They can configure the clusters to autoscale for larger data sizes"},{"key":"D","text":"They can use clusters that are from a cluster pool"}],"correct":["D"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"A":"SQL endpoints no aceleran el aprovisionamiento de clusters Spark de Jobs.","B":"Job clusters se crean al ejecutarse y también necesitan boot.","C":"Autoscaling actúa durante la carga; no elimina cold start."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":128,"topic":"Exam A","question":"A data engineer has a single-task Job that runs each morning before they begin working. After identifying an upstream\n  data issue, they need to set up another task to run a new notebook prior to the original task.\n\n\n  Which approach can the data engineer use to set up the new task?","options":[{"key":"A","text":"They can clone the existing task in the existing Job and update it to run the new notebook."},{"key":"B","text":"They can create a new task in the existing Job and then add it as a dependency of the original task."},{"key":"C","text":"They can create a new task in the existing Job and then add the original task as a dependency of the new task."},{"key":"D","text":"They can create a new job from scratch and add both tasks to run concurrently."}],"correct":["B"],"explanation":"Lakeflow Jobs representa las tareas como un DAG. Las dependencias aseguran que una tarea se ejecute tras cumplir las condiciones de las anteriores, incluso con bifurcaciones paralelas y fan-in.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Lakeflow Jobs representa las tareas como un DAG. Las dependencias aseguran que una tarea se ejecute tras cumplir las condiciones de las anteriores, incluso con bifurcaciones paralelas y fan-in.","wrongWhy":{"A":"Clonar la tarea sin configurar dependencia no garantiza el orden.","C":"Invertir el Depends On haría correr la tarea original primero.","D":"Concurrente no cumple el requisito de ejecutar la tarea nueva antes."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":129,"topic":"Exam A","question":"A single Job runs two notebooks as two separate tasks. A data engineer has noticed that one of the notebooks is running\n  slowly in the Job’s current run. The data engineer asks a tech lead for help in identifying why this might be the case.\n\n\n  Which approach can the tech lead use to identify why the notebook is running slowly as part of the Job?","options":[{"key":"A","text":"They can navigate to the Runs tab in the Jobs UI to immediately review the processing notebook."},{"key":"B","text":"They can navigate to the Tasks tab in the Jobs UI and click on the active run to review the processing notebook."},{"key":"C","text":"They can navigate to the Runs tab in the Jobs UI and click on the active run to review the processing notebook."},{"key":"D","text":"They can navigate to the Tasks tab in the Jobs UI to immediately review the processing notebook."}],"correct":["C"],"explanation":"Lakeflow Jobs representa las tareas como un DAG. Las dependencias aseguran que una tarea se ejecute tras cumplir las condiciones de las anteriores, incluso con bifurcaciones paralelas y fan-in.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Lakeflow Jobs representa las tareas como un DAG. Las dependencias aseguran que una tarea se ejecute tras cumplir las condiciones de las anteriores, incluso con bifurcaciones paralelas y fan-in.","wrongWhy":{"A":"Runs muestra historia, pero falta abrir la ejecución activa concreta para inspeccionar la tarea.","B":"Tasks sirve definición de tareas; para diagnosticar una ejecución se abre el run activo desde Runs.","D":"Estar en Tasks no revela automáticamente la telemetría de una ejecución lenta."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":130,"topic":"Exam A","question":"A data analysis team has noticed that their Databricks SQL queries are running too slowly when connected to their always-\n  on SQL endpoint. They claim that this issue is present when many members of the team are running small queries\n\n\n  simultaneously. They ask the data engineering team for help. The data engineering team notices that each of the\n  team’s queries uses the same SQL endpoint.\n\n\n  Which approach can the data engineering team use to improve the latency of the team’s queries?","options":[{"key":"A","text":"They can increase the cluster size of the SQL endpoint."},{"key":"B","text":"They can increase the maximum bound of the SQL endpoint’s scaling range."},{"key":"C","text":"They can turn on the Auto Stop feature for the SQL endpoint."},{"key":"D","text":"They can turn on the Serverless feature for the SQL endpoint."}],"correct":["B"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"A":"Aumentar tamaño de cluster puede acelerar una consulta aislada, no necesariamente mejorar concurrencia de muchas consultas pequeñas.","C":"Auto Stop controla compute ocioso, no la cola de consultas concurrentes.","D":"Serverless puede facilitar escalado, pero la clave del caso de SQL endpoint siempre activo es ampliar capacidad de concurrencia."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":131,"topic":"Exam A","question":"A data engineer has been using a Databricks SQL dashboard to monitor the cleanliness of the input data to an ELT job. The\n  ELT job has its Databricks SQL query that returns the number of input records containing unexpected NULL values. The\n  data engineer wants their entire team to be notified via a messaging webhook whenever this value reaches 100.\n\n\n  Which approach can the data engineer use to notify their entire team via a messaging webhook whenever the number of\n  NULL values reaches 100?","options":[{"key":"A","text":"They can set up an Alert with a custom template."},{"key":"B","text":"They can set up an Alert with a new email alert destination."},{"key":"C","text":"They can set up an Alert with a new webhook alert destination."},{"key":"D","text":"They can set up an Alert with one-time notifications."}],"correct":["C"],"explanation":"Una alerta SQL puede ejecutar una regla de umbral y notificar por un destino de tipo webhook, que integra la notificación con herramientas externas.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Una alerta SQL puede ejecutar una regla de umbral y notificar por un destino de tipo webhook, que integra la notificación con herramientas externas.","wrongWhy":{"A":"Una plantilla personalizada cambia el contenido de alerta, no crea destino webhook.","B":"Email no es destino webhook solicitado.","D":"Frecuencia de avisos no sustituye configuración de webhook."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":132,"topic":"Exam A","question":"A company uses Delta Sharing to collaborate with partners across different cloud providers and geographic regions.\n\n\n  What will result in additional costs due to cross-region or egress fees?","options":[{"key":"A","text":"Sharing data within the same cloud provider and region"},{"key":"B","text":"Transferring data via Delta Sharing across clouds and across different geographic regions"},{"key":"C","text":"Accessing Delta Sharing data using a VPN within the same data center"},{"key":"D","text":"Utilizing Delta Sharing for internal data analytics within a single cloud environment"}],"correct":["B"],"explanation":"Delta Sharing ofrece intercambio de datos con otras organizaciones/plataformas, con protocolos y permisos adecuados. Las transferencias entre regiones y nubes pueden generar costes de salida de datos.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"Delta Sharing ofrece intercambio de datos con otras organizaciones/plataformas, con protocolos y permisos adecuados. Las transferencias entre regiones y nubes pueden generar costes de salida de datos.","wrongWhy":{"A":"Compartir en una misma región/nube típicamente evita muchos costes egress interregionales, no es el escenario de sobrecoste indicado.","C":"Una VPN dentro de un datacenter no es una transferencia entre nubes/regiones.","D":"El consumo interno en una sola región no representa un egress intercloud."},"sourceLinks":[{"label":"Delta Sharing","url":"https://docs.databricks.com/aws/en/delta-sharing/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":133,"topic":"Exam A","question":"A data engineer is writing a script that is meant to ingest new data from cloud storage. In the event of the Schema change,\n  the ingestion should fail. It should fail until the changes downstream source can be found and verified as intended\n  changes.\n\n  Which command will meet the requirements?","options":[{"key":"A","text":"failOnNewColumns"},{"key":"B","text":"none"},{"key":"C","text":"rescue"},{"key":"D","text":"addNewColumns"}],"correct":["A"],"explanation":"En ingesta de CSV/JSON hay que distinguir inferencia de esquema, schema hints y evolución del esquema. Un esquema nuevo puede añadirse de forma controlada o provocar un error, según la configuración.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"En ingesta de CSV/JSON hay que distinguir inferencia de esquema, schema hints y evolución del esquema. Un esquema nuevo puede añadirse de forma controlada o provocar un error, según la configuración.","wrongWhy":{"B":"none no obliga a fallar al aparecer columnas inesperadas.","C":"rescue guarda datos no ajustados en _rescued_data, no rompe el pipeline inmediatamente.","D":"addNewColumns evoluciona el esquema, justo lo contrario de fallar por un cambio."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":134,"topic":"Exam A","question":"Which SQL code snippet will correctly demonstrate a Data Definition Language (DDL) operation used to create a table?","options":[{"key":"A","text":"CREATE TABLE employees (id INT, name STRING);"},{"key":"B","text":"DROP TABLE employees;"},{"key":"C","text":"ALTER TABLE employees ADD COLUMN salary DECIMAL(10,2);"},{"key":"D","text":"INSERT INTO employees (id, name) VALUES (1 'Alice');"}],"correct":["A"],"explanation":"CREATE TABLE es una instrucción DDL. CREATE OR REPLACE TABLE permite sustituir una tabla existente con una nueva definición, a diferencia de IF NOT EXISTS.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"CREATE TABLE es una instrucción DDL. CREATE OR REPLACE TABLE permite sustituir una tabla existente con una nueva definición, a diferencia de IF NOT EXISTS.","wrongWhy":{"B":"DROP también es DDL, pero elimina una tabla; no la crea.","C":"ALTER también es DDL, pero cambia la definición.","D":"INSERT es DML y además tiene sintaxis incorrecta en el ejemplo."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":135,"topic":"Exam A","question":"A data engineer is working in a Databricks notebook to design and manage a batch ETL pipeline. The engineer is writing\n  SQL and Python code to clean data, transform it, and join large datasets from different sources. The engineer wants to\n  organize these steps into a structured process that can be run regularly and scheduled as part of a data pipeline.\n\n\n  Which Databricks notebook feature is applicable in the use case?","options":[{"key":"A","text":"Real-time streaming support"},{"key":"B","text":"Collaborative editing"},{"key":"C","text":"Task workflows and job scheduling"},{"key":"D","text":"Notebook version control"}],"correct":["C"],"explanation":"Los Jobs permiten programar, monitorizar y recuperar trabajos. Repair run reejecuta tareas fallidas o pendientes sin repetir necesariamente toda la ejecución ya completada.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Los Jobs permiten programar, monitorizar y recuperar trabajos. Repair run reejecuta tareas fallidas o pendientes sin repetir necesariamente toda la ejecución ya completada.","wrongWhy":{"A":"El procesamiento streaming no es la característica principal para organizar y programar un ETL batch.","B":"Editar conjuntamente es útil, pero no crea workflow/scheduler.","D":"El versionado conserva cambios de código, no automatiza su ejecución recurrente."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":136,"topic":"Exam A","question":"A data engineer needs to develop integration tests for an ETL process and deploy a version-controlled, packaged workflow\n  into production using an external job scheduler.\n\n\n  Which tool should the data engineer use for this job?","options":[{"key":"A","text":"Databricks Connect"},{"key":"B","text":"Databricks Asset Bundles"},{"key":"C","text":"Databricks Command Line Interface"},{"key":"D","text":"Databricks Software Development Kit"}],"correct":["B"],"explanation":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","wrongWhy":{"A":"Databricks Connect facilita ejecutar Spark desde IDE local, no empaqueta recursos/targets de despliegue.","C":"La CLI despliega, pero el empaquetado declarativo y versionable se define con bundles.","D":"El SDK automatiza llamadas API, no es en sí una declaración de infraestructura/código del proyecto."},"sourceLinks":[{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":137,"topic":"Exam A","question":"Which Databricks asset bundle format is valid?","options":[{"key":"A","text":"resources:\n\n  jobs:\n  hello-job:\n  name: hello-job\n  tasks:\n  - task_key: hello-task\n  existing_cluster_id: 1234-567890-abcde123\n  notebook_task:\n  notebook_path: ./hello.py"},{"key":"B","text":"\"resources\":{\"jobs\":{ \"name\":\"hello-job\", \"tasks\":{ \"task_key\":\"hello-task\", \"existing_cluster_id\":\"1234-567890-\n\n     abcde123\", \"notebook_task\":{ \"notebook_path\": \".hello.py\" }}}}"},{"key":"C","text":"configuration = {\"resources\":{ \"jobs\":{\"name\":\"hello-job\", \"tasks\":{\"task_key\":\"hello-task\",\n\n     \"existing_cluster_id\":\"1234-567890-abcde123\", \"notebook_task\":{\"notebook_path\":\".hello.py\" }}}}"},{"key":"D","text":"resources { jobs { name = \"hello-job\" tasks { task_key = \"hello-task\" existing_cluster_id = \"1234-567890-abcde123\"\n\n     notebook_task { notebook_path = \".hello.py\" }}}}"}],"correct":["A"],"explanation":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","wrongWhy":{"B":"Es estructura JSON, no el esquema YAML de recursos presentado para DAB.","C":"Es asignación Python/JSON, no YAML de configuración del bundle.","D":"Es estilo HCL/otro DSL, no el YAML esperado."},"sourceLinks":[{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":138,"topic":"Exam A","question":"A data engineer needs to ingest from both streaming and batch sources for a firm that relies on highly accurate data.\n  Occasionally, some of the data picked up by the sensors that provide a streaming input are outside the expected\n  parameters. If this occurs, the data must be dropped, but the stream should not fail.\n\n\n  Which feature of Delta Live Tables meets this requirement?","options":[{"key":"A","text":"Change Data Capture"},{"key":"B","text":"Error Handling"},{"key":"C","text":"Monitoring"},{"key":"D","text":"Expectations"}],"correct":["D"],"explanation":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","wrongWhy":{"A":"CDC trata cambios del origen, no la validación de datos fuera de rango con DROP ROW.","B":"El manejo genérico de errores no sustituye una regla EXPECT con política de descarte.","C":"Monitorizar detecta problemas, pero no descarta registros automáticamente."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":139,"topic":"Exam A","question":"A data engineer has inherited a Databricks pipeline from a previous team. The pipeline is missing SLAs and costs more\n  than the allotted budget. On analysis, it is noted that the cluster is not being fully utilized, and the dataset is getting\n  skewed.\n\n\n  How should the data engineer resolve this issue?","options":[{"key":"A","text":"Use coalesce() on the dataset to merge partitions and reduce skew."},{"key":"B","text":"Increase the number of executors for the job."},{"key":"C","text":"Repartition the dataset to have it be more optimally spread across all nodes."},{"key":"D","text":"Increase the executor memory for the job."}],"correct":["C"],"explanation":"Cuando existe data skew, repartir mejor los registros entre particiones evita que unas pocas tareas concentren todo el trabajo y retrasen la etapa.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"Cuando existe data skew, repartir mejor los registros entre particiones evita que unas pocas tareas concentren todo el trabajo y retrasen la etapa.","wrongWhy":{"A":"Coalesce puede juntar particiones y empeorar skew si no las redistribuye.","B":"Más executors no resuelven que una partición concentre la mayoría de filas.","D":"Más memoria alivia spill, pero no corrige el desequilibrio de trabajo."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":140,"topic":"Exam A","question":"An organization is looking for an optimized storage layer that supports ACID transactions and schema enforcement.\n\n\n  Which technology should the organization use?","options":[{"key":"A","text":"Delta Lake"},{"key":"B","text":"Unity Catalog"},{"key":"C","text":"Cloud File Storage"},{"key":"D","text":"Data lake"}],"correct":["A"],"explanation":"Delta Lake aporta transacciones ACID, esquema y un registro de versiones sobre almacenamiento abierto. Esto permite lecturas y escrituras fiables, recuperación histórica y convivencia de batch y streaming.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Delta Lake aporta transacciones ACID, esquema y un registro de versiones sobre almacenamiento abierto. Esto permite lecturas y escrituras fiables, recuperación histórica y convivencia de batch y streaming.","wrongWhy":{"B":"Unity Catalog gobierna objetos, pero no es por sí solo el formato ACID de almacenamiento.","C":"Object storage no implementa el transaction log Delta.","D":"Un data lake clásico necesita una capa como Delta para disponer de ACID/enforcement."},"sourceLinks":[{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":141,"topic":"Exam A","question":"What are the transformations typically included in building the Bronze layer?","options":[{"key":"A","text":"Include columns Load date/time, process ID"},{"key":"B","text":"Business rules and transformations"},{"key":"C","text":"Perform extensive data cleansing"},{"key":"D","text":"Aggregate data from multiple sources"}],"correct":["A"],"explanation":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","wrongWhy":{"B":"Reglas de negocio y conformado son típicas de Silver/Gold.","C":"La limpieza exhaustiva suele hacerse después de Bronze.","D":"Las agregaciones son más propias de Gold."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":142,"topic":"Exam A","question":"An organization has data stored across multiple external systems, including MySQL, Amazon Redshift, and Google\n  BigQuery. The data engineer wants to perform analytics without ingesting directly into Databricks, ensuring unified\n  governance and minimizing data duplication.\n\n\n  Which feature of Databricks enables querying these external data sources while maintaining centralized governance?","options":[{"key":"A","text":"Delta Lake"},{"key":"B","text":"Lakehouse Federation"},{"key":"C","text":"MLflow"},{"key":"D","text":"Databricks Connect"}],"correct":["B"],"explanation":"Lakehouse Federation consulta sistemas externos sin necesidad de ingerir y duplicar previamente todos sus datos en Delta.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"Lakehouse Federation consulta sistemas externos sin necesidad de ingerir y duplicar previamente todos sus datos en Delta.","wrongWhy":{"A":"Delta es el formato transaccional, no la conexión federada.","C":"MLflow gestiona ciclo de vida de ML, no federation.","D":"Databricks Connect sirve para desarrollo remoto."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"}]},{"id":143,"topic":"Exam A","question":"An organization needs to share a dataset stored in its Databricks Unity Catalog with an external partner who uses a\n  different data platform that is not Databricks. The goal is to maintain data security and ensure the partner can access the\n  data efficiently.\n\n\n  Which method should the data engineer use to securely share the dataset with the external partner?","options":[{"key":"A","text":"Using Delta Sharing with the open sharing protocol"},{"key":"B","text":"Exporting data as CSV files and emailing them"},{"key":"C","text":"Using a third-party API to access the Delta table"},{"key":"D","text":"Databricks-to-Databricks Sharing"}],"correct":["A"],"explanation":"Delta Sharing ofrece intercambio de datos con otras organizaciones/plataformas, con protocolos y permisos adecuados. Las transferencias entre regiones y nubes pueden generar costes de salida de datos.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"Delta Sharing ofrece intercambio de datos con otras organizaciones/plataformas, con protocolos y permisos adecuados. Las transferencias entre regiones y nubes pueden generar costes de salida de datos.","wrongWhy":{"B":"Email con CSV rompe la seguridad y control de acceso gobernado del protocolo de sharing.","C":"Una API a medida no aprovecha gobernanza y interoperabilidad estándar.","D":"Databricks-to-Databricks Sharing requiere que el receptor use Databricks/UC; aquí usa otra plataforma."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Delta Sharing","url":"https://docs.databricks.com/aws/en/delta-sharing/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":144,"topic":"Exam A","question":"A data engineer streams customer orders into a Kafka topic (orders_topic) and is currently writing the ingestion script of a\n  DLT pipeline. The data engineer needs to ingest the data from Kafka brokers to DLT using Databricks.\n\n\n  What is the correct code for ingesting the data?","options":[{"key":"A","text":"import dlt\n\n\n    @dlt.table(\n        name = \"orders_raw\",\n    )\n    def orders_raw():\n        return (\n            spark.readStream\n                 .format(\"kafka\")\n                 .option(\"kafka.bootstrap.servers\", \"broker:9092\")\n                 .option(\"subscribe\", \"orders_topic\")\n                 .option(\"startingOffsets\", \"earliest\")\n                 .load()\n        )"},{"key":"B","text":"import dlt\n\n\n    @dlt.table(\n\n\n        name = \"orders_raw\",\n    )\n    def orders_raw():\n        return (\n            spark.readStream\n                 .format(\"cloud_files\")\n                 .option(\"cloudFiles.format\", \"json\")\n                 .option(\"cloudFiles.schemaLocation\", \"/schema/location\")\n                 .load(\"kafka://broker:9092/orders_topic\")\n        )"},{"key":"C","text":"CREATE LIVE TABLE orders_raw\n\n    AS SELECT\n        CAST(value AS STRING) AS json_data\n    FROM STREAM kafka.`broker:9092/orders_topic`;"},{"key":"D","text":"CREATE STREAMING LIVE TABLE orders_raw\n\n    AS SELECT\n        value:order_id AS order_id,\n        value:customer_id AS customer_id,\n        value:amount AS amount,\n        value:order_status AS order_status,\n        value:order_timestamp AS order_timestamp\n    FROM cloud_files(\"kafka://broker:9092/orders_topic\", \"json\");"}],"correct":["A"],"explanation":"La fuente kafka de spark.readStream necesita las opciones de brokers, topic y offsets para consumir un flujo de eventos.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"La fuente kafka de spark.readStream necesita las opciones de brokers, topic y offsets para consumir un flujo de eventos.","wrongWhy":{"B":"cloud_files no soporta kafka:// para consumir topics.","C":"La referencia kafka.`...` en SQL no es configuración equivalente al conector Structured Streaming Kafka mostrado.","D":"cloud_files es para archivos de object storage, no para streams Kafka."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":145,"topic":"Exam A","question":"A global retail company sells products across multiple categories (e.g., Electronics, Clothing) and regions (e.g., North,\n  South, East, West). The sales team has provided the data engineer with a PySpark dataframe named sales_df as below\n  and the team wants the data engineer to analyze the sales data to help them make strategic decisions.\n\n\n  sales_df\n\n\n    product_id      category        sales_amount       region\n    1               Electronics     100                North\n    2               Clothing        200                South\n    3               Electronics     150                North\n    4               Clothing        300                South\n    5               Electronics     250                East\n    6               Clothing        400                West\n\n  Calculate the total sales amount for each product category and store the results in a new dataframe called category_sales.\n\n\n  What will generate the expected result of category_sales?\n\n\n    category        total_sales_amount\n    Electronics     500\n    Clothing        900","options":[{"key":"A","text":"category_sales = sales_df.groupBy(\"category\").agg(sum(\"sales_amount\").alias(\"total_sales_amount\"))"},{"key":"B","text":"category_sales = sales_df.sum(\"sales_amount\").groupBy(\"category\").alias(\"total_sales_amount\")"},{"key":"C","text":"category_sales = sales_df.agg(sum(\"sales_amount\").groupBy(\"category\").alias(\"total_sales_amount\"))"},{"key":"D","text":"category_sales = sales_df.groupBy(\"region\").agg(sum(\"sales_amount\").alias(\"total_sales_amount\"))"}],"correct":["A"],"explanation":"groupBy(...).agg(...) aplica agregaciones Spark por clave de agrupación. sum, avg y count pueden combinarse en la misma operación y renombrarse con alias.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"groupBy(...).agg(...) aplica agregaciones Spark por clave de agrupación. sum, avg y count pueden combinarse en la misma operación y renombrarse con alias.","wrongWhy":{"B":"No puede aplicarse sum y después groupBy así; debe agruparse primero.","C":"GROUP BY se aplica al DataFrame antes de agg, no como argumento de sum/agg.","D":"Agrupa por region en vez de category."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":146,"topic":"Exam A","question":"A data engineer is designing an ETL pipeline to process both streaming and batch data from multiple sources. The pipeline\n  must ensure data quality, handle schema evolution, and provide easy maintenance. The team is considering using Delta\n  Live Tables (DLT) in Databricks to achieve these goals. They want to understand the key features and benefits of DLT that\n  make it suitable for this use case.\n\n\n  Why is Delta Live Tables (DLT) an appropriate choice?","options":[{"key":"A","text":"Automatic data quality checks, built-in support for schema evolution, and declarative pipeline development"},{"key":"B","text":"Manual schema enforcement, high operational overhead, and limited scalability"},{"key":"C","text":"Requires custom code for data quality checks, no support for streaming data, and complex pipeline maintenance"},{"key":"D","text":"Supports only batch processing, no data versioning, and high infrastructure costs"}],"correct":["A"],"explanation":"Las canalizaciones declarativas describen datasets y sus dependencias, con soporte para SQL o Python y fuentes de streaming. La pl
