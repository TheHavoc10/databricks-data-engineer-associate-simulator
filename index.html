:true,"category":"JOIN / SQL","answerWhy":"El control de flujo de Python permite condicionar qué fragmentos se ejecutan. En una función Python hay que declararla con def y devolver el valor con return si se espera un resultado.","wrongWhy":{"A":"En Python = asigna; las condiciones deben comparar con ==.","B":"También emplea = en day_of_week y compara booleanos innecesariamente como cadenas.","C":"El operador & no sustituye el AND lógico aquí, y también usa = incorrectamente."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":49,"topic":"Exam A","question":"Which of the following describes a scenario in which a data engineer will want to use a single-node cluster?","options":[{"key":"A","text":"When they are working interactively with a small amount of data"},{"key":"B","text":"When they are running automated reports to be refreshed as quickly as possible"},{"key":"C","text":"When they are working with SQL within Databricks SQL"},{"key":"D","text":"When they are concerned about the ability to automatically scale with larger data"},{"key":"E","text":"When they are manually running reports with a large amount of data"}],"correct":["A"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"B":"Reportes rápidos y automatizados no requieren necesariamente single node.","C":"Databricks SQL usa SQL Warehouses, no clusters single-node de notebook como regla.","D":"Un único nodo es menos apto para escalado distribuido.","E":"Muchos datos requieren paralelismo, no un nodo aislado."},"sourceLinks":[{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":50,"topic":"Exam A","question":"Which of the following describes the relationship between Bronze tables and raw data?","options":[{"key":"A","text":"Bronze tables contain less data than raw data files."},{"key":"B","text":"Bronze tables contain more truthful data than raw data."},{"key":"C","text":"Bronze tables contain raw data with a schema applied."},{"key":"D","text":"Bronze tables contain a less refined view of data than raw data."}],"correct":["C"],"explanation":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","wrongWhy":{"A":"Bronze suele preservar fidelidad de los registros; no tiene por qué almacenar menos filas.","B":"Bronze no es más verdadero que raw; aplica un esquema sin hacer limpieza profunda.","D":"Raw está menos refinado: Bronze no debería ser menos refinado que el origen en bruto."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":51,"topic":"Exam A","question":"A data engineer has realized that the data files associated with a Delta table are incredibly small. They want to compact\n  the small files to form larger files to improve performance.\n\n\n  Which of the following keywords can be used to compact the small files?","options":[{"key":"A","text":"REDUCE"},{"key":"B","text":"OPTIMIZE"},{"key":"C","text":"COMPACTION"},{"key":"D","text":"REPARTITION"},{"key":"E","text":"VACUUM"}],"correct":["B"],"explanation":"OPTIMIZE reorganiza/compacta archivos Delta para mejorar lecturas; Liquid Clustering y predictive optimization gestionan el layout de forma más automática. DESCRIBE HISTORY permite revisar operaciones registradas.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"OPTIMIZE reorganiza/compacta archivos Delta para mejorar lecturas; Liquid Clustering y predictive optimization gestionan el layout de forma más automática. DESCRIBE HISTORY permite revisar operaciones registradas.","wrongWhy":{"A":"REDUCE no es el comando SQL de compactación.","C":"COMPACTION no es el comando esperado.","D":"REPARTITION redistribuye datos, no ejecuta mantenimiento Delta por sí solo.","E":"VACUUM borra archivos obsoletos según retención; no compacta."},"sourceLinks":[{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":52,"topic":"Exam A","question":"A data engineer has realized that they made a mistake when making a daily update to a table. They need to use Delta time\n  travel to restore the table to a version that is 3 days old. However, when the data engineer attempts to time travel to the\n  older version, they are unable to restore the data because the data files have been deleted.\n\n\n  Which of the following explains why the data files are no longer present?","options":[{"key":"A","text":"The VACUUM command was run on the table"},{"key":"B","text":"The TIME TRAVEL command was run on the table"},{"key":"C","text":"The DELETE HISTORY command was run on the table"},{"key":"D","text":"The OPTIMIZE command was run on the table"}],"correct":["A"],"explanation":"El registro Delta conserva versiones para time travel e historial. VACUUM puede eliminar archivos antiguos necesarios para consultar o restaurar ciertas versiones.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"El registro Delta conserva versiones para time travel e historial. VACUUM puede eliminar archivos antiguos necesarios para consultar o restaurar ciertas versiones.","wrongWhy":{"B":"Time Travel consulta versiones, no elimina automáticamente los archivos antiguos.","C":"DELETE HISTORY no es el comando Delta estándar causante de borrado de archivos.","D":"OPTIMIZE reorganiza archivos, pero su eliminación física se controla mediante VACUUM/retención."},"sourceLinks":[{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":53,"topic":"Exam A","question":"A data engineer needs to apply custom logic to string column city in table stores for a specific use case. In order to apply\n  this custom logic at scale, the data engineer wants to create a SQL user-defined function (UDF).\n\n\n  Which of the following code blocks creates this SQL UDF?","options":[{"key":"A","text":"CREATE FUNCTION combine_nyc(city STRING)\n\n    RETURNS STRING\n    RETURN CASE\n         WHEN city = \"brooklyn\" THEN \"new york\"\n         ELSE city\n    END;"},{"key":"B","text":"CREATE UDF combine_nyc(city STRING)\n\n    RETURNS STRING\n    CASE\n         WHEN city = \"brooklyn\" THEN \"new york\"\n         ELSE city\n    END;"},{"key":"C","text":"CREATE FUNCTION combine_nyc(city STRING)\n\n    RETURN CASE\n         WHEN city = \"brooklyn\" THEN \"new york\"\n         ELSE city\n    END;"},{"key":"D","text":"CREATE UDF combine_nyc(city STRING)\n\n    RETURNS STRING\n    RETURN CASE\n         WHEN city = \"brooklyn\" THEN \"new york\"\n         ELSE city\n    END;"}],"correct":["A"],"explanation":"Una función SQL personalizada se define con CREATE FUNCTION, la firma de parámetros y tipo devuelto, más una expresión RETURN.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"Una función SQL personalizada se define con CREATE FUNCTION, la firma de parámetros y tipo devuelto, más una expresión RETURN.","wrongWhy":{"B":"CREATE UDF no es la declaración SQL esperada para crear una función persistente.","C":"Falta RETURNS STRING y sintaxis completa de CREATE FUNCTION.","D":"CREATE UDF no es la sintaxis SQL correspondiente a CREATE FUNCTION."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":54,"topic":"Exam A","question":"Which of the following can be used to simplify and unify siloed data architectures that are specialized for specific use\n  cases?","options":[{"key":"A","text":"None of these"},{"key":"B","text":"Data lake"},{"key":"C","text":"Data warehouse"},{"key":"D","text":"All of these"},{"key":"E","text":"Data lakehouse"}],"correct":["E"],"explanation":"El lakehouse intenta unificar ingeniería y analítica sobre los mismos datos. El uso de tecnologías abiertas ayuda a reducir dependencias de formatos propietarios.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"El lakehouse intenta unificar ingeniería y analítica sobre los mismos datos. El uso de tecnologías abiertas ayuda a reducir dependencias de formatos propietarios.","wrongWhy":{"A":"Sí existe una arquitectura diseñada para unificar analítica y data engineering: el Lakehouse.","B":"El data lake almacena datos diversos, pero por sí solo no unifica las capacidades de warehouse y gobierno transaccional.","C":"El warehouse resuelve BI estructurado, pero no incluye necesariamente ingeniería en formatos abiertos, streaming y ML.","D":"No todas las alternativas unifican las cargas: lake y warehouse por separado no sustituyen un lakehouse."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":55,"topic":"Exam A","question":"An engineering manager uses a Databricks SQL query to monitor ingestion latency for each data source. The manager\n  checks the results of the query every day, but they are manually rerunning the query each day and waiting for the results.\n\n\n  Which of the following approaches can the manager use to ensure the results of the query are updated each day?","options":[{"key":"A","text":"They can schedule the query to refresh every 1 day from the SQL endpoint's page in Databricks SQL."},{"key":"B","text":"They can schedule the query to refresh every 12 hours from the SQL endpoint's page in Databricks SQL."},{"key":"C","text":"They can schedule the query to refresh every 1 day from the query's page in Databricks SQL."},{"key":"D","text":"They can schedule the query to run every 12 hours from the Jobs UI."}],"correct":["C"],"explanation":"Los schedules controlan cuándo refrescar consultas o dashboards; Auto Stop reduce costes deteniendo compute inactivo. Para limitar ejecuciones hay que configurar correctamente las fechas de fin.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Los schedules controlan cuándo refrescar consultas o dashboards; Auto Stop reduce costes deteniendo compute inactivo. Para limitar ejecuciones hay que configurar correctamente las fechas de fin.","wrongWhy":{"A":"El calendario de una consulta se establece desde la query, no desde una página genérica del SQL Warehouse.","B":"Un ajuste de 12 horas no coincide con la frecuencia diaria y se aplica desde lugar incorrecto.","D":"Programar Jobs cada 12 horas no cumple 1 vez al día y es más complejo de lo necesario."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":56,"topic":"Exam A","question":"A data engineer has a Python notebook in Databricks, but they need to use SQL to accomplish a specific task within a cell.\n  They still want all of the other cells to use Python without making any changes to those cells.\n\n\n  Which of the following describes how the data engineer can use SQL within a cell of their Python notebook?","options":[{"key":"A","text":"It is not possible to use SQL in a Python notebook"},{"key":"B","text":"They can attach the cell to a SQL endpoint rather than a Databricks cluster"},{"key":"C","text":"They can simply write SQL syntax in the cell"},{"key":"D","text":"They can add %sql to the first line of the cell"},{"key":"E","text":"They can change the default language of the notebook to SQL"}],"correct":["D"],"explanation":"Databricks permite alternar el lenguaje de distintas celdas en un notebook mediante magic commands, como %sql. No se mezclan libremente varios lenguajes en una misma celda.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"Databricks permite alternar el lenguaje de distintas celdas en un notebook mediante magic commands, como %sql. No se mezclan libremente varios lenguajes en una misma celda.","wrongWhy":{"A":"Sí se puede alternar idioma por celda.","B":"No hace falta conectar la celda a otro warehouse.","C":"En un notebook Python se necesita cambiar el intérprete de esa celda.","E":"Cambiar el idioma de todo el notebook afectaría a otras celdas."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":57,"topic":"Exam A","question":"Which of the following SQL keywords can be used to convert a table from a long format to a wide format?","options":[{"key":"A","text":"TRANSFORM"},{"key":"B","text":"PIVOT"},{"key":"C","text":"SUM"},{"key":"D","text":"CONVERT"},{"key":"E","text":"WHERE"}],"correct":["B"],"explanation":"PIVOT transforma categorías que estaban representadas en filas en nuevas columnas, pasando del formato largo al ancho.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"PIVOT transforma categorías que estaban representadas en filas en nuevas columnas, pasando del formato largo al ancho.","wrongWhy":{"A":"TRANSFORM no es el operador para pivotar.","C":"SUM solo agrega.","D":"CONVERT suele tratar conversiones de tipos, no pivotado.","E":"WHERE filtra filas."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":58,"topic":"Exam A","question":"Which of the following describes a benefit of creating an external table from Parquet rather than CSV when using a\n  CREATE TABLE AS SELECT statement?","options":[{"key":"A","text":"Parquet files can be partitioned"},{"key":"B","text":"CREATE TABLE AS SELECT statements cannot be used on files"},{"key":"C","text":"Parquet files have a well-defined schema"},{"key":"D","text":"Parquet files have the ability to be optimized"},{"key":"E","text":"Parquet files will become Delta tables"}],"correct":["C"],"explanation":"Parquet almacena metadatos de esquema y datos en formato columnar, facilitando lecturas tipadas y eficientes frente a texto CSV.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Parquet almacena metadatos de esquema y datos en formato columnar, facilitando lecturas tipadas y eficientes frente a texto CSV.","wrongWhy":{"A":"También se puede particionar datasets de otros formatos; no es una ventaja exclusiva y decisiva de Parquet aquí.","B":"Sí pueden realizarse lecturas de archivos desde SQL para CTAS.","D":"La optimización del formato no es la diferencia principal preguntada.","E":"Parquet no se convierte necesariamente en Delta solo por existir; depende de cómo se materializa la tabla."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":59,"topic":"Exam A","question":"The Delta transaction log for the ‘students’ tables is shown using the ‘DESCRIBE HISTORY students’\n  command. A Data Engineer needs to query the table as it existed before the UPDATE operation listed in the log.\n\n\n  Which command should the Data Engineer use to achieve this? (Choose two.)\n\n\n         version     timestamp                       operation\n    1    8           2024-04-22T14:33:31.000         OPTIMIZE\n    2    7           2024-04-22T14:33:16.000         MERGE\n    3    6           2024-04-22T14:33:06.000         DELETE\n    4    5           2024-04-22T14:32:58.000         UPDATE\n    5    4           2024-04-22T14:32:47.000         WRITE\n    6    3           2024-04-22T14:32:44.000         WRITE\n    7    2           2024-04-22T14:32:23.000         WRITE\n    8    1           2024-04-22T14:32:20.000         WRITE\n    9    0           2024-04-22T14:31:49.000         CREATE TABLE","options":[{"key":"A","text":"SELECT * FROM students@v4"},{"key":"B","text":"SELECT * FROM students TIMESTAMP AS OF '2024-04-22T14:32:47.000+00:00'"},{"key":"C","text":"SELECT * FROM students FROM HISTORY VERSION AS OF 3"},{"key":"D","text":"SELECT * FROM students VERSION AS OF 5"},{"key":"E","text":"SELECT * FROM students TIMESTAMP AS OF '2024-04-22T14:32:58.000+00:00'"}],"correct":["A","B"],"explanation":"El registro Delta conserva versiones para time travel e historial. VACUUM puede eliminar archivos antiguos necesarios para consultar o restaurar ciertas versiones.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"El registro Delta conserva versiones para time travel e historial. VACUUM puede eliminar archivos antiguos necesarios para consultar o restaurar ciertas versiones.","wrongWhy":{"C":"FROM HISTORY VERSION AS OF no es sintaxis válida de Time Travel.","D":"La versión 5 incluye precisamente la operación UPDATE; la foto previa es versión 4.","E":"El timestamp de UPDATE apunta al momento del cambio, no al estado anterior."},"sourceLinks":[{"label":"Delta: operaciones MERGE","url":"https://docs.databricks.com/aws/en/delta/merge"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":60,"topic":"Exam A","question":"Which method should a Data Engineer apply to ensure Workflows are being triggered on schedule?","options":[{"key":"A","text":"Scheduled Workflows require an always-running cluster, which is more expensive but reduces processing latency."},{"key":"B","text":"Scheduled Workflows process data as it arrives at configured sources."},{"key":"C","text":"Scheduled Workflows can reduce resource consumption and expense since the cluster runs only long enough to\n\n     execute the pipeline."},{"key":"D","text":"Scheduled Workflows run continuously until manually stopped."}],"correct":["C"],"explanation":"La respuesta C del solucionario describe una ventaja operativa de los jobs programados: el cómputo puede arrancar para la ejecución y detenerse después, reduciendo inactividad. Pero esto no verifica por sí mismo que un schedule se dispare correctamente; hay que observar el historial de runs, los triggers y las alertas del job.","issue":"El enunciado habla de scheduled workflows pero pregunta por garantizar triggers; la solución C describe una ventaja de coste, no un método de verificación del scheduling. Revisar la formulación.","scorable":true,"category":"Lakeflow / Medallion","answerWhy":"El PDF señala C. Es cierto que ejecutar Jobs con compute que se detiene tras la ejecución reduce coste, pero no demuestra que se activen puntualmente. Para verificar horarios se consulta la configuración de triggers, run history y monitorización.","wrongWhy":{"A":"Un schedule no necesita un cluster encendido permanentemente.","B":"Eso describe un trigger basado en llegada de datos, no uno programado.","D":"No se ejecuta continuamente por el mero hecho de estar programado."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":61,"topic":"Exam A","question":"A data engineer needs to access the view created by the sales team, using a shared cluster. The data engineer has been\n  provided usage permissions on the catalog and schema. In order to access the view created by sales team.\n\n\n  What are the minimum permissions the data engineer would require in addition?","options":[{"key":"A","text":"Needs SELECT permission on the VIEW and the underlying TABLE."},{"key":"B","text":"Needs SELECT permission only on the VIEW"},{"key":"C","text":"Needs ALL PRIVILEGES on the VIEW"},{"key":"D","text":"Needs ALL PRIVILEGES at the SCHEMA level"}],"correct":["B"],"explanation":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","wrongWhy":{"A":"Unity Catalog evalúa acceso a tablas base con los permisos del owner de la vista, no exige SELECT directo del consumidor sobre ellas.","C":"ALL PRIVILEGES excede el permiso SELECT requerido para leer una vista.","D":"No se necesita ALL PRIVILEGES sobre el schema para ejecutar una vista."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":62,"topic":"Exam A","question":"A data engineer needs to apply custom logic to identify employees with more than 5 years of experience in array column\n  employees in table stores. The custom logic should create a new column exp_employees that is an array of all of the\n  employees with more than 5 years of experience for each row. In order to apply this custom logic at scale, the data\n  engineer wants to use the FILTER higher-order function.\n\n\n  Which of the following code blocks successfully completes this task?","options":[{"key":"A","text":"SELECT\n\n        store_id,\n        employees,\n        FILTER (employees, i -> i.years_exp > 5) AS exp_employees\n    FROM stores;"},{"key":"B","text":"SELECT\n\n        store_id,\n        employees,\n        FILTER (exp_employees, years_exp > 5) AS exp_employees\n    FROM stores;"},{"key":"C","text":"SELECT\n\n        store_id,\n        employees,\n\n        FILTER (employees, years_exp > 5) AS exp_employees\n    FROM stores;"},{"key":"D","text":"SELECT\n\n        store_id,\n        employees,\n        CASE WHEN employees.years_exp > 5 THEN employees\n            ELSE NULL\n        END AS exp_employees\n    FROM stores;"},{"key":"E","text":"SELECT\n\n        store_id,\n        employees,\n        FILTER (exp_employees, i -> i.years_exp > 5) AS exp_employees\n    FROM stores;"}],"correct":["A"],"explanation":"Las funciones sobre arrays de Spark SQL permiten procesar estructuras anidadas y filtrar elementos con expresiones lambda sin expandir necesariamente todas las filas.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"Las funciones sobre arrays de Spark SQL permiten procesar estructuras anidadas y filtrar elementos con expresiones lambda sin expandir necesariamente todas las filas.","wrongWhy":{"B":"exp_employees es la columna de salida que aún se está construyendo, no el ARRAY de entrada.","C":"FILTER sobre arrays exige función lambda para identificar el elemento que se filtra.","D":"CASE no recorre cada elemento del ARRAY ni produce el subconjunto de empleados >5.","E":"Toma como entrada exp_employees antes de existir."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":63,"topic":"Exam A","question":"Identify the impact of ON VIOLATION DROP ROW and ON VIOLATION FAIL UPDATE for a constraint violation.\n\n\n  A data engineer has created an ETL pipeline using Delta Live Table to manage their company travel reimbursement detail,\n  they want to ensure that the if the location details has not been provided by the employee, the pipeline needs to be\n  terminated.\n\n\n  How can the scenario be implemented?","options":[{"key":"A","text":"CONSTRAINT valid_location EXPECT (location = NULL)"},{"key":"B","text":"CONSTRAINT valid_location EXPECT (location != NULL) ON VIOLATION FAIL UPDATE"},{"key":"C","text":"CONSTRAINT valid_location EXPECT (location != NULL) ON VIOLATION DROP ROW"},{"key":"D","text":"CONSTRAINT valid_location EXPECT (location != NULL) ON VIOLATION FAIL"}],"correct":["B"],"explanation":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","issue":"La opción marcada usa «location != NULL». En SQL, normalmente las comprobaciones de valores nulos se hacen con IS NOT NULL. Posible errata del banco de preguntas.","scorable":true,"category":"Gobierno / Sharing","answerWhy":"El solucionario señala B para fallar ante un campo vacío; lo esencial es FAIL UPDATE, pero «location != NULL» no expresa una comprobación SQL correcta: debería emplearse location IS NOT NULL.","wrongWhy":{"A":"EXPECT con comparación = NULL nunca devuelve verdadero para validar ausencia.","C":"DROP ROW descarta filas, pero el requisito es terminar el update.","D":"La palabra clave completa es ON VIOLATION FAIL UPDATE."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":64,"topic":"Exam A","question":"Identify a scenario to use an external table.\n\n\n  A Data Engineer needs to create a parquet bronze table and wants to ensure that it gets stored in a specific path in an\n  external location.\n\n  Which table can be created in this scenario?","options":[{"key":"A","text":"An external table where the location is pointing to specific path in external location."},{"key":"B","text":"An external table where the schema has managed location pointing to specific path in external location."},{"key":"C","text":"A managed table where the catalog has managed location pointing to specific path in external location."},{"key":"D","text":"A managed table where the location is pointing to specific path in external location."}],"correct":["A"],"explanation":"Una tabla managed delega en la plataforma el ciclo de vida de datos y metadatos; en una tabla external, los archivos permanecen en la ubicación externa al borrar el registro del catálogo. Las migraciones deben validar dependencias.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Una tabla managed delega en la plataforma el ciclo de vida de datos y metadatos; en una tabla external, los archivos permanecen en la ubicación externa al borrar el registro del catálogo. Las migraciones deben validar dependencias.","wrongWhy":{"B":"La ubicación gestionada de schema no establece que esta tabla external apunte a un path explícito.","C":"La ubicación del catálogo gobierna almacenamiento managed, no define una ruta external a voluntad.","D":"Managed no proporciona la misma gestión manual de ruta física que external con LOCATION."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":65,"topic":"Exam A","question":"Data engineer and data analysts are working together on a data pipeline. The data engineer is working on the raw, bronze,\n  and silver layers of the pipeline using Python, and the data analyst is working on the gold layer of the pipeline using SQL.\n  The raw source of the pipeline is a streaming input. They now want to migrate their pipeline to use Delta Live Tables.\n\n\n  Which of the following changes will need to be made to the pipeline when migrating to Delta Live Tables?","options":[{"key":"A","text":"The pipeline can have different notebook sources in SQL & Python"},{"key":"B","text":"The pipeline will need to be written entirely in SQL"},{"key":"C","text":"The pipeline will need to use a batch source in place of a streaming source"},{"key":"D","text":"The pipeline will need to be written entirely in Python"}],"correct":["A"],"explanation":"Las canalizaciones declarativas describen datasets y sus dependencias, con soporte para SQL o Python y fuentes de streaming. La plataforma gestiona la ejecución del grafo.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Las canalizaciones declarativas describen datasets y sus dependencias, con soporte para SQL o Python y fuentes de streaming. La plataforma gestiona la ejecución del grafo.","wrongWhy":{"B":"No es obligatorio unificar todo el pipeline en SQL.","C":"DLT admite streaming; no se exige batch.","D":"No es obligatorio unificar todo en Python."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":66,"topic":"Exam A","question":"A data engineer that is new to using Python needs to create a Python function to add two integers together and return\n  the sum?\n\n\n  Which of the following code blocks can the data engineer use to complete this task?","options":[{"key":"A","text":"function add_integers(x, y):\n\n        return x + y"},{"key":"B","text":"function add_integers(x, y):\n\n        x + y"},{"key":"C","text":"def add_integers(x, y):\n\n        print(x + y)"},{"key":"D","text":"def add_integers(x, y):\n\n        return x + y"},{"key":"E","text":"def add_integers(x, y):\n\n        x + y"}],"correct":["D"],"explanation":"El control de flujo de Python permite condicionar qué fragmentos se ejecutan. En una función Python hay que declararla con def y devolver el valor con return si se espera un resultado.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"El control de flujo de Python permite condicionar qué fragmentos se ejecutan. En una función Python hay que declararla con def y devolver el valor con return si se espera un resultado.","wrongWhy":{"A":"Python declara funciones con def, no con la palabra function.","B":"Además de usar function, no devuelve el cálculo.","C":"print visualiza pero no retorna el resultado esperado.","E":"No contiene return, así que devuelve None."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":67,"topic":"Exam A","question":"A data engineer has configured a Structured Streaming job to read from a table, manipulate the data, and then perform a\n  streaming write into a new table.\n\n\n  The code block used by the data engineer is below:\n\n    (spark.readStream\n        .table(\"sales\")\n        .withColumn(\"avg_price\", col(\"sales\") / col(\"units\"))\n        .writeStream\n        .option(\"checkpointLocation\", checkpointPath)\n        .outputMode(\"complete\")\n        .[blank]\n        .table(\"new_sales\")\n    )\n\n  The data engineer only wants the query to process all of the available data in as many batches as required.\n\n\n  Which line of code should the data engineer use to fill in the blank?","options":[{"key":"A","text":"trigger(availableNow=True)"},{"key":"B","text":"trigger(processingTime=\"once\")"},{"key":"C","text":"trigger(continuous=\"once\")"},{"key":"D","text":"trigger(once=True)"}],"correct":["A"],"explanation":"Los triggers de Structured Streaming controlan cuándo se disparan los microbatches. processingTime define una frecuencia; availableNow procesa los datos disponibles y finaliza.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Los triggers de Structured Streaming controlan cuándo se disparan los microbatches. processingTime define una frecuencia; availableNow procesa los datos disponibles y finaliza.","wrongWhy":{"B":"processingTime=\"once\" no es un trigger de un lote de todo lo pendiente.","C":"continuous=\"once\" no expresa la semántica AvailableNow.","D":"once=True puede procesar un microbatch y no necesariamente agota todas las tandas disponibles como AvailableNow."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":68,"topic":"Exam A","question":"A data engineer is working with two tables. Each of these tables is displayed below in its entirety.\n\n\n  sales\n\n    customer_id       spend      units\n    a1                28.94      7\n    a3                874.12     23\n    a4                8.99       1\n\n  favorite_stores\n\n\n    customer_id       store_id\n    a1                s1\n    a2                s1\n    a4                s2\n\n  The data engineer runs the following query to join these tables together:\n\n    SELECT\n        sales.customer_id,\n        sales.spend,\n        favorite_stores.store_id\n    FROM sales\n    LEFT JOIN favorite_stores\n    ON sales.customer_id = favorite_stores.customer_id;\n\n  Which of the following will be returned by the above query?","options":[{"key":"A","text":"customer_id       spend      store_id\n\n    a1                28.94      s1\n    a4                8.99       s2"},{"key":"B","text":"customer_id       spend      units   store_id\n\n    a1                28.94      7       s1\n    a4                8.99       1       s2"},{"key":"C","text":"customer_id        spend     store_id\n\n    a1                 28.94     s1\n    a3                 874.12    NULL\n    a4                 8.99      s2"},{"key":"D","text":"customer_id        spend     store_id\n\n    a1                 28.94     s1\n    a2                 NULL      s1\n    a3                 874.12    NULL\n    a4                 8.99      s2"},{"key":"E","text":"customer_id        spend    store_id\n\n    a1                 28.94    s1\n    a2                 NULL     s1\n    a4                 8.99     s2"}],"correct":["C"],"explanation":"Un LEFT JOIN conserva todas las filas de la tabla de la izquierda. Cuando no existe coincidencia en la derecha, las columnas de esa tabla aparecen como NULL; no se incorpora la fila a2 que solo existe a la derecha.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"Un LEFT JOIN conserva todas las filas de la tabla de la izquierda. Cuando no existe coincidencia en la derecha, las columnas de esa tabla aparecen como NULL; no se incorpora la fila a2 que solo existe a la derecha.","wrongWhy":{"A":"Elimina la fila a3, que LEFT JOIN debe mantener.","B":"También elimina a3 y agrega units, que no se proyecta en el SELECT.","D":"Incluye a2 procedente solo del lado derecho.","E":"Incluye a2 y omite a3, violando el LEFT JOIN."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":69,"topic":"Exam A","question":"What can be used to simplify and unify siloed data architectures that are specialized for specific use cases?","options":[{"key":"A","text":"Delta Lake"},{"key":"B","text":"Data lake"},{"key":"C","text":"Data warehouse"},{"key":"D","text":"Data lakehouse"}],"correct":["D"],"explanation":"El lakehouse intenta unificar ingeniería y analítica sobre los mismos datos. El uso de tecnologías abiertas ayuda a reducir dependencias de formatos propietarios.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"El lakehouse intenta unificar ingeniería y analítica sobre los mismos datos. El uso de tecnologías abiertas ayuda a reducir dependencias de formatos propietarios.","wrongWhy":{"A":"Delta Lake aporta formato transaccional, pero no equivale por sí solo a toda la arquitectura Lakehouse.","B":"Un data lake almacena datos diversos, pero no integra por sí solo todas las capacidades warehouse/lakehouse.","C":"Warehouse es útil para BI estructurado, pero no unifica todos los workloads de ingeniería, ML y formatos abiertos."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":70,"topic":"Exam A","question":"In a healthcare provider organization using Delta Lake to store electronic health records (EHRs), a data analyst needs to\n  analyze a snapshot of the patient_records table from two weeks ago before some recent data corrections were applied.\n\n\n  What approach should the Data Engineer take to allow the analyst to query that specific prior version?","options":[{"key":"A","text":"Truncate the table to remove all data, then reload the data from two weeks ago into the truncated table for the\n\n     analyst to query."},{"key":"B","text":"Identify the version number corresponding to two weeks ago from the Delta transaction log, share that version\n\n     number with the analyst to query using VERSION AS OF syntax, or export that version to a new Delta table for the\n     analyst to query."},{"key":"C","text":"Restore the table to the version from two weeks ago using the RESTORE command, and have the analyst query the\n\n     restored table."},{"key":"D","text":"Use the VACUUM command to remove all versions of the table older than two weeks, then the analyst can query the\n\n     remaining version."}],"correct":["B"],"explanation":"El registro Delta conserva versiones para time travel e historial. VACUUM puede eliminar archivos antiguos necesarios para consultar o restaurar ciertas versiones.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"El registro Delta conserva versiones para time travel e historial. VACUUM puede eliminar archivos antiguos necesarios para consultar o restaurar ciertas versiones.","wrongWhy":{"A":"TRUNCATE y recarga alteraría el estado actual y podría perder información.","C":"RESTORE afectaría a consumidores de la tabla actual; para lectura histórica basta VERSION AS OF.","D":"VACUUM retira versiones/archivos que precisamente se quieren consultar."},"sourceLinks":[{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":71,"topic":"Exam A","question":"A data engineer has developed a data pipeline to ingest data from a JSON source using Auto Loader, but the engineer has\n  not provided any type inference or schema hints in their pipeline. Upon reviewing the data, the data engineer has noticed\n  that all of the columns in the target table are of the string type despite some of the fields only including float or boolean\n  values.\n\n\n  Which of the following describes why Auto Loader inferred all of the columns to be of the string type?","options":[{"key":"A","text":"There was a type mismatch between the specific schema and the inferred schema"},{"key":"B","text":"JSON data is a text-based format"},{"key":"C","text":"Auto Loader only works with string data"},{"key":"D","text":"All of the fields had at least one null value"},{"key":"E","text":"Auto Loader cannot infer the schema of ingested data"}],"correct":["B"],"explanation":"En ingesta de CSV/JSON hay que distinguir inferencia de esquema, schema hints y evolución del esquema. Un esquema nuevo puede añadirse de forma controlada o provocar un error, según la configuración.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"En ingesta de CSV/JSON hay que distinguir inferencia de esquema, schema hints y evolución del esquema. Un esquema nuevo puede añadirse de forma controlada o provocar un error, según la configuración.","wrongWhy":{"A":"Un conflicto entre schema declarado e inferido no explica el comportamiento por defecto de Auto Loader sobre JSON.","C":"Auto Loader admite otras estructuras; inferir STRING por defecto no implica que solo procese strings.","D":"La presencia de NULL no obliga a que toda columna sea STRING.","E":"Auto Loader sí admite inferencia de esquema; tiene convenciones específicas para JSON."},"sourceLinks":[{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"label":"Auto Loader","url":"https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":72,"topic":"Exam A","question":"A Delta Live Table pipeline includes two datasets defined using STREAMING LIVE TABLE. Three datasets are defined against\n  Delta Lake table sources using LIVE TABLE.\n\n\n  The table is configured to run in Development mode using the Continuous Pipeline Mode.\n\n\n  Assuming previously unprocessed data exists and all definitions are valid, what is the expected outcome after clicking\n  Start to update the pipeline?","options":[{"key":"A","text":"All datasets will be updated once and the pipeline will shut down. The compute resources will be terminated."},{"key":"B","text":"All datasets will be updated at set intervals until the pipeline is shut down. The compute resources will persist until\n\n     the pipeline is shut down."},{"key":"C","text":"All datasets will be updated once and the pipeline will persist without any processing. The compute resources will\n\n     persist but go unused."},{"key":"D","text":"All datasets will be updated once and the pipeline will shut down. The compute resources will persist to allow for\n\n     additional testing."},{"key":"E","text":"All datasets will be updated at set intervals until the pipeline is shut down. The compute resources will persist to\n\n     allow for additional testing."}],"correct":["E"],"explanation":"Las tablas de streaming procesan cambios incrementalmente; el modo continuo mantiene el pipeline activo mientras que el modo triggered realiza una actualización y se detiene.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Las tablas de streaming procesan cambios incrementalmente; el modo continuo mantiene el pipeline activo mientras que el modo triggered realiza una actualización y se detiene.","wrongWhy":{"A":"El modo continuo no ejecuta una sola vez con apagado de recursos.","B":"Se parece, pero la pregunta distingue explícitamente matices de modo de desarrollo y ciclo de vida de compute.","C":"No es un pipeline detenido tras una ejecución única.","D":"Tampoco se apaga inmediatamente tras un único update."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":73,"topic":"Exam A","question":"Which of the following data workloads will utilize a Gold table as its source?","options":[{"key":"A","text":"A job that enriches data by parsing its timestamps into a human-readable format"},{"key":"B","text":"A job that aggregates uncleaned data to create standard summary statistics"},{"key":"C","text":"A job that cleans data by removing malformed records"},{"key":"D","text":"A job that queries aggregated data designed to feed into a dashboard"},{"key":"E","text":"A job that ingests raw data from a streaming source into the Lakehouse"}],"correct":["D"],"explanation":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","wrongWhy":{"A":"Formatear timestamps es transformación ligera propia de Silver.","B":"Agregar datos no depurados no produce una tabla de consumo Gold fiable.","C":"Eliminar registros corruptos es limpieza típica de Silver.","E":"Ingerir un flujo raw es Bronze, no consumo Gold."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":74,"topic":"Exam A","question":"Which two components function in the DB platform architecture's control plane? (Choose two.)","options":[{"key":"A","text":"Virtual Machines"},{"key":"B","text":"Compute Orchestration"},{"key":"C","text":"Serverless Compute"},{"key":"D","text":"Compute"},{"key":"E","text":"Unity Catalog"}],"correct":["B","E"],"explanation":"En la arquitectura clásica, el control plane alberga la interfaz web, los servicios de gestión y metadatos; el data plane ejecuta el cómputo y accede a los datos. El driver y los workers pertenecen al plano de ejecución.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"En la arquitectura clásica, el control plane alberga la interfaz web, los servicios de gestión y metadatos; el data plane ejecuta el cómputo y accede a los datos. El driver y los workers pertenecen al plano de ejecución.","wrongWhy":{"A":"Las máquinas virtuales del cluster pertenecen al data plane clásico.","C":"Serverless es cómputo, no por sí mismo el servicio de control-plane que pide el examen.","D":"Compute representa ejecución de trabajo, no el control plane."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":75,"topic":"Exam A","question":"Identify how the count_if function and the count where x is null can be used\n\n\n  Consider a table random_values with below data.\n\n\n  What would be the output of below query?\n\n    select count_if(col > 1) as count_a, count(*) as count_b, count(col1) as count_c from random_values\n\n    col1\n    0\n    1\n    2\n\n    NULL\n    2\n    3","options":[{"key":"A","text":"3 6 5"},{"key":"B","text":"4 6 5"},{"key":"C","text":"3 6 6"},{"key":"D","text":"4 6 6"}],"correct":["A"],"explanation":"COUNT_IF cuenta las filas que cumplen una condición; COUNT(*) cuenta todas las filas y COUNT(columna) excluye los valores NULL.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"COUNT_IF cuenta las filas que cumplen una condición; COUNT(*) cuenta todas las filas y COUNT(columna) excluye los valores NULL.","wrongWhy":{"B":"COUNT_IF(col >1) cuenta tres valores (2,2,3), no cuatro.","C":"COUNT(col1) excluye la fila NULL, por lo que devuelve 5, no 6.","D":"Combina ambos errores: 4 en vez de 3 y 6 en vez de 5."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":76,"topic":"Exam A","question":"Which of the following describes the type of workloads that are always compatible with Auto Loader?","options":[{"key":"A","text":"Streaming workloads"},{"key":"B","text":"Machine learning workloads"},{"key":"C","text":"Serverless workloads"},{"key":"D","text":"Batch workloads"},{"key":"E","text":"Dashboard workloads"}],"correct":["A"],"explanation":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","wrongWhy":{"B":"ML puede consumir datos ya cargados, pero Auto Loader no es un motor de modelado.","C":"Serverless define cómo se proporciona compute, no el tipo de carga imprescindible de Auto Loader.","D":"Auto Loader emplea Structured Streaming aunque pueda ejecutarse en microbatches; no es la API batch read estática.","E":"Dashboards consumen datos transformados y no son el uso de ingestión."},"sourceLinks":[{"label":"Auto Loader","url":"https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/"}]},{"id":77,"topic":"Exam A","question":"Differentiate between all-purpose clusters and jobs clusters.\n\n\n  A data engineering team has created a python notebook to load data from cloud storage, this job has been tested and\n  now needs to be scheduled in production.\n\n\n  Which would be the best cluster to be used in this case?","options":[{"key":"A","text":"All purpose cluster"},{"key":"B","text":"Any Unity Catalog-enabled cluster"},{"key":"C","text":"Jobs Cluster"},{"key":"D","text":"Serverless SQL warehouse"}],"correct":["C"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"A":"El compute interactivo es apropiado para desarrollo; para trabajos programados suele evitarse mantener recursos ociosos.","B":"Unity Catalog administra gobierno, metadatos y privilegios; no ejecuta la lectura incremental ni sustituye el motor de Spark.","D":"Un SQL Warehouse sirve consultas SQL; no sustituye las tareas Python/Spark de un ETL general ni una fuente externa sin conectividad."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":78,"topic":"Exam A","question":"A data engineer is using the following code block as part of a batch ingestion pipeline to read from a composable table:\n\n    transactions_df = (spark.read\n        .schema(schema)\n\n          .format(\"delta\")\n          .table(\"transactions\")\n    )\n\n  Which of the following changes needs to be made so this code block will work when the transactions table is a stream\n  source?","options":[{"key":"A","text":"Replace predict with a stream-friendly prediction function"},{"key":"B","text":"Replace schema(schema) with option (\"maxFilesPerTrigger\", 1)"},{"key":"C","text":"Replace \"transactions\" with the path to the location of the Delta table"},{"key":"D","text":"Replace format(\"delta\") with format(\"stream\")"},{"key":"E","text":"Replace spark.read with spark.readStream"}],"correct":["E"],"explanation":"Un flujo real-time debe usar spark.readStream y writeStream. Un simple spark.read crea un DataFrame batch que no sigue incorporando archivos nuevos.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Un flujo real-time debe usar spark.readStream y writeStream. Un simple spark.read crea un DataFrame batch que no sigue incorporando archivos nuevos.","wrongWhy":{"A":"El enunciado no utiliza inferencia ni predicción; no hace falta cambiar funciones predictivas.","B":"La opción maxFilesPerTrigger limita velocidad, pero no transforma una lectura batch en streaming.","C":"Una tabla Delta puede seguir leyéndose por nombre con readStream.table.","D":"La fuente de formato sigue siendo Delta, no \"stream\"."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":79,"topic":"Exam A","question":"Which of the following queries is performing a streaming hop from raw data to a Bronze table?","options":[{"key":"A","text":"(spark.table(\"sales\")\n\n        .groupBy(\"store\")\n        .agg(sum(\"sales\"))\n        .writeStream\n        .option(\"checkpointLocation\", checkpointPath)\n        .outputMode(\"complete\")\n        .table(\"newSales\")\n    )"},{"key":"B","text":"(spark.table(\"sales\")\n\n        .filter(col(\"units\") > 0)\n        .writeStream\n        .option(\"checkpointLocation\", checkpointPath)\n        .outputMode(\"append\")\n        .table(\"newSales\")\n    )"},{"key":"C","text":"(spark.table(\"sales\")\n\n        .withColumn(\"avgPrice\", col(\"sales\") / col(\"units\"))\n        .writeStream\n        .option(\"checkpointLocation\", checkpointPath)\n        .outputMode(\"append\")\n        .table(\"newSales\")\n    )"},{"key":"D","text":"(spark.read.load(rawSalesLocation)\n\n        .write\n        .mode(\"append\")\n        .table(\"newSales\")\n    )"},{"key":"E","text":"(spark.readStream.load(rawSalesLocation)\n\n        .writeStream\n        .option(\"checkpointLocation\", checkpointPath)\n        .outputMode(\"append\")\n        .table(\"newSales\")\n    )"}],"correct":["E"],"explanation":"Un flujo real-time debe usar spark.readStream y writeStream. Un simple spark.read crea un DataFrame batch que no sigue incorporando archivos nuevos.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Un flujo real-time debe usar spark.readStream y writeStream. Un simple spark.read crea un DataFrame batch que no sigue incorporando archivos nuevos.","wrongWhy":{"A":"El groupBy con sum es propia agregación Silver→Gold.","B":"El filter de tabla existente limpia Silver, no lee raw.","C":"Calcula una derivada de datos existentes, no la ingestión inicial raw.","D":"spark.read y .write son batch, no streaming; falta readStream/writeStream."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":80,"topic":"Exam A","question":"A dataset has been defined using Delta Live Tables and includes an expectations clause:\n\n    CONSTRAINT valid_timestamp EXPECT (timestamp > '2020-01-01') ON VIOLATION FAIL UPDATE\n\n  What is the expected behavior when a batch of data containing data that violates these constraints is processed?","options":[{"key":"A","text":"Records that violate the expectation are dropped from the target dataset and recorded as invalid in the event log."},{"key":"B","text":"Records that violate the expectation cause the job to fail."},{"key":"C","text":"Records that violate the expectation are dropped from the target dataset and loaded into a quarantine table."},{"key":"D","text":"Records that violate the expectation are added to the target dataset and recorded as invalid in the event log."},{"key":"E","text":"Records that violate the expectation are added to the target dataset and flagged as invalid in a field added to the\n\n       target dataset."}],"correct":["B"],"explanation":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Las expectations de los pipelines declarativos validan reglas de calidad. DROP ROW descarta del destino las filas inválidas, FAIL UPDATE falla la actualización y las métricas de expectativas quedan disponibles en observabilidad/event log.","wrongWhy":{"A":"DROP ROW es otra política: esta regla dice FAIL UPDATE.","C":"No se crea una cuarentena automáticamente.","D":"Las filas inválidas no se confirman en la actualización fallida.","E":"No se añade una marca automáticamente."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":81,"topic":"Exam A","question":"Which of the following statements regarding the relationship between Silver tables and Bronze tables is always true?","options":[{"key":"A","text":"Silver tables contain a less refined, less clean view of data than Bronze data."},{"key":"B","text":"Silver tables contain aggregates while Bronze data is unaggregated."},{"key":"C","text":"Silver tables contain more data than Bronze tables."},{"key":"D","text":"Silver tables contain a more refined and cleaner view of data than Bronze tables."},{"key":"E","text":"Silver tables contain less data than Bronze tables."}],"correct":["D"],"explanation":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","wrongWhy":{"A":"Invierte las capas: Bronze es menos depurada que Silver.","B":"La agregación suele estar más cerca de Gold, no caracteriza toda Silver.","C":"La cantidad puede aumentar o disminuir y no define calidad.","E":"No existe garantía de menos filas por definición de Silver."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":82,"topic":"Exam A","question":"A data engineering team has noticed that their Databricks SQL queries are running too slowly when they are submitted to\n  a non-running SQL endpoint. The data engineering team wants this issue to be resolved.\n\n\n  Which of the following approaches can the team use to reduce the time it takes to return results in this scenario?","options":[{"key":"A","text":"They can turn on the Serverless feature for the SQL endpoint and change the Spot Instance Policy to \"Reliability\n\n     Optimized.\""},{"key":"B","text":"They can turn on the Auto Stop feature for the SQL endpoint."},{"key":"C","text":"They can increase the cluster size of the SQL endpoint."},{"key":"D","text":"They can turn on the Serverless feature for the SQL endpoint."},{"key":"E","text":"They can increase the maximum bound of the SQL endpoint's scaling range."}],"correct":["D"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"A":"Spot Instance Policy no es un atributo aplicable como regla de arranque de SQL Serverless.","B":"Auto Stop reduce tiempo ocioso pero obliga a reiniciar al volver a consultar.","C":"Aumentar compute no reduce de forma directa la latencia de arrancar un warehouse detenido.","E":"Ampliar escalado máximo ayuda bajo carga, no necesariamente en cold start."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":83,"topic":"Exam A","question":"A new data engineering team team has been assigned to an ELT project. The new data engineering team will need full\n  privileges on the table sales to fully manage the project.\n\n\n  Which command can be used to grant full permissions on the database to the new data engineering team?","options":[{"key":"A","text":"GRANT ALL PRIVILEGES ON TABLE sales TO team;"},{"key":"B","text":"GRANT SELECT CREATE MODIFY ON TABLE sales TO team;"},{"key":"C","text":"GRANT SELECT ON TABLE sales TO team;"},{"key":"D","text":"GRANT ALL PRIVILEGES ON TABLE team TO sales;"}],"correct":["A"],"explanation":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","wrongWhy":{"B":"SELECT/CREATE/MODIFY no sustituyen el grant ALL PRIVILEGES sobre la tabla y CREATE TABLE no se concede así al objeto TABLE.","C":"SELECT concede solo lectura, no todas las capacidades.","D":"Invierte el objeto y el grupo destinatario en el GRANT."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"}]},{"id":84,"topic":"Exam A","question":"Which of the following approaches should be used to send the Databricks Job owner an email in the case that the Job\n  fails?","options":[{"key":"A","text":"Manually programming in an alert system in each cell of the Notebook"},{"key":"B","text":"Setting up an Alert in the Job page"},{"key":"C","text":"Setting up an Alert in the Notebook"},{"key":"D","text":"There is no way to notify the Job owner in the case of Job failure"},{"key":"E","text":"MLflow Model Registry Webhooks"}],"correct":["B"],"explanation":"Los Jobs permiten programar, monitorizar y recuperar trabajos. Repair run reejecuta tareas fallidas o pendientes sin repetir necesariamente toda la ejecución ya completada.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Los Jobs permiten programar, monitorizar y recuperar trabajos. Repair run reejecuta tareas fallidas o pendientes sin repetir necesariamente toda la ejecución ya completada.","wrongWhy":{"A":"No hace falta programar alertas manuales en cada celda de notebook.","C":"Las notificaciones de fallo del Job se configuran en el Job, no dentro de un Notebook aislado.","D":"Databricks Jobs sí ofrece avisos de fallo.","E":"Los webhooks de Model Registry atienden eventos de modelos ML, no fallos generales de Jobs."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":85,"topic":"Exam A","question":"A new data engineering team has been assigned to work on a project. The team will need access to database customers in\n  order to see what tables already exist. The team has its own group team.\n\n\n  Which command can be used to grant the necessary permission on the entire database to the new team?","options":[{"key":"A","text":"GRANT VIEW ON CATALOG customers TO team;"},{"key":"B","text":"GRANT CREATE ON DATABASE customers TO team;"},{"key":"C","text":"GRANT USAGE ON CATALOG team TO customers;"},{"key":"D","text":"GRANT USAGE ON DATABASE customers TO team;"}],"correct":["D"],"explanation":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","wrongWhy":{"A":"VIEW ON CATALOG no es el permiso de acceso al esquema/base de datos que se pide.","B":"CREATE concede capacidad de crear objetos y excede la necesidad de inspección.","C":"Invierte objeto/principal y el nivel catalog no corresponde al permiso requerido para la base customers."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"}]},{"id":86,"topic":"Exam A","question":"An engineering manager wants to monitor the performance of a recent project using a Databricks SQL query. For the first\n  week following the project's release, the manager wants the query results to be updated every minute. However, the\n  manager is concerned that the compute resources used for the query will be left running and cost the organization a lot of\n  money beyond the first week of the project's release.\n\n\n  Which approach can the engineering team use to ensure the query does not cost the organization any money beyond the\n  first week of the project's release?","options":[{"key":"A","text":"They can set a limit to the number of DBUs that are consumed by the SQL Endpoint."},{"key":"B","text":"They can set the query's refresh schedule to end after a certain number of refreshes."},{"key":"C","text":"They can set the query's refresh schedule to end on a certain date in the query scheduler."},{"key":"D","text":"They can set a limit to the number of individuals that are able to manage the query's refresh schedule."}],"correct":["C"],"explanation":"Los schedules controlan cuándo refrescar consultas o dashboards; Auto Stop reduce costes deteniendo compute inactivo. Para limitar ejecuciones hay que configurar correctamente las fechas de fin.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Los schedules controlan cuándo refrescar consultas o dashboards; Auto Stop reduce costes deteniendo compute inactivo. Para limitar ejecuciones hay que configurar correctamente las fechas de fin.","wrongWhy":{"A":"Limitar DBUs no es lo mismo que poner una fecha fin de programación.","B":"Un número de refrescos no expresa la fecha límite pedida.","D":"Limitar administradores no cancela la ejecución automáticamente."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":87,"topic":"Exam A","question":"A data engineer has been using a Databricks SQL dashboard to monitor the cleanliness of the input data to a data\n  analytics dashboard for a retail use case. The job has a Databricks SQL query that returns the number of store-level\n  records where sales is equal to zero. The data engineer wants their entire team to be notified via a messaging webhook\n  whenever this value is greater than 0.\n\n\n  Which of the following approaches can the data engineer use to notify their entire team via a messaging webhook\n  whenever the number of stores with $0 in sales is greater than zero?","options":[{"key":"A","text":"They can set up an Alert with a custom template."},{"key":"B","text":"They can set up an Alert with a new email alert destination."},{"key":"C","text":"They can set up an Alert with one-time notifications."},{"key":"D","text":"They can set up an Alert with a new webhook alert destination."},{"key":"E","text":"They can set up an Alert without notifications."}],"correct":["D"],"explanation":"Una alerta SQL puede ejecutar una regla de umbral y notificar por un destino de tipo webhook, que integra la notificación con herramientas externas.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Una alerta SQL puede ejecutar una regla de umbral y notificar por un destino de tipo webhook, que integra la notificación con herramientas externas.","wrongWhy":{"A":"La plantilla cambia el formato del aviso, no establece necesariamente destino webhook.","B":"Correo no es el canal de mensajería externa indicado.","C":"One-time notifications cambia frecuencia, no conecta con el webhook.","E":"Una alerta sin notificaciones no avisa al equipo."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":88,"topic":"Exam A","question":"A data engineer wants to schedule their Databricks SQL dashboard to refresh every hour, but they only want the\n  associated SQL endpoint to be running when it is necessary. The dashboard has multiple queries on multiple datasets\n  associated with it. The data that feeds the dashboard is automatically processed using a Databricks Job.\n\n\n  Which of the following approaches can the data engineer use to minimize the total running time of the SQL endpoint used\n  in the refresh schedule of their dashboard?","options":[{"key":"A","text":"They can turn on the Auto Stop feature for the SQL endpoint."},{"key":"B","text":"They can ensure the dashboard's SQL endpoint is not one of the included query's SQL endpoints."},{"key":"C","text":"They can reduce the cluster size of the SQL endpoint."},{"key":"D","text":"They can ensure the dashboard's SQL endpoint matches each of the queries' SQL endpoints."},{"key":"E","text":"They can set up the dashboard's SQL endpoint to be serverless."}],"correct":["A"],"explanation":"Los schedules controlan cuándo refrescar consultas o dashboards; Auto Stop reduce costes deteniendo compute inactivo. Para limitar ejecuciones hay que configurar correctamente las fechas de fin.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Los schedules controlan cuándo refrescar consultas o dashboards; Auto Stop reduce costes deteniendo compute inactivo. Para limitar ejecuciones hay que configurar correctamente las fechas de fin.","wrongWhy":{"B":"Separar el endpoint puede mantener más recursos encendidos.","C":"Un compute menor no significa menor tiempo activo.","D":"Compartir endpoint no garantiza apagado cuando está inactivo.","E":"Serverless puede resultar eficiente, pero aquí la propiedad directa para parar un endpoint sin consultas es Auto Stop."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":89,"topic":"Exam A","question":"Which two conditions are applicable for governance in Databricks Unity Catalog? (Choose two.)","options":[{"key":"A","text":"You can have more than 1 metastore within a databricks account console but only 1 per region."},{"key":"B","text":"Both catalog and schema must have a managed location in Unity Catalog provided metastore is not associated with a\n\n     location"},{"key":"C","text":"You can have multiple catalogs within metastore and 1 catalog can be associated with multiple metastore"},{"key":"D","text":"If catalog is not associated with location, it's mandatory to associate schema with managed locations"},{"key":"E","text":"If metastore is not associated with location, it's mandatory to associate catalog with managed locations"}],"correct":["A","E"],"explanation":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","wrongWhy":{"B":"No es obligatorio que ambos catálogo y esquema tengan managed location simultáneamente.","C":"Un catálogo pertenece a un metastore concreto, no a varios en paralelo.","D":"No siempre es obligatorio el managed location del schema si el catálogo/metastore proporciona uno."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"}]},{"id":90,"topic":"Exam A","question":"A data engineer wants to schedule their Databricks SQL dashboard to refresh once per day, but they only want the\n  associated SQL endpoint to be running when it is necessary.\n\n\n  Which approach can the data engineer use to minimize the total running time of the SQL endpoint used in the refresh\n  schedule of their dashboard?","options":[{"key":"A","text":"They can ensure the dashboard's SQL endpoint matches each of the queries' SQL endpoints."},{"key":"B","text":"They can set up the dashboard's SQL endpoint to be serverless."},{"key":"C","text":"They can turn on the Auto Stop feature for the SQL endpoint."},{"key":"D","text":"They can ensure the dashboard's SQL endpoint is not one of the included query's SQL endpoint."}],"correct":["C"],"explanation":"Los schedules controlan cuándo refrescar consultas o dashboards; Auto Stop reduce costes deteniendo compute inactivo. Para limitar ejecuciones hay que configurar correctamente las fechas de fin.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Los schedules controlan cuándo refrescar consultas o dashboards; Auto Stop reduce costes deteniendo compute inactivo. Para limitar ejecuciones hay que configurar correctamente las fechas de fin.","wrongWhy":{"A":"Que los endpoints coincidan no programa apagado automático.","B":"Serverless es alternativa válida de gestión, pero el objetivo específico es activar Auto Stop.","D":"Endpoints distintos no reducen necesariamente horas encendidas."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":91,"topic":"Exam A","question":"Which data lakehouse feature results in improved data quality over a traditional data lake?","options":[{"key":"A","text":"A data lakehouse stores data in open formats."},{"key":"B","text":"A data lakehouse allows the use of SQL queries to examine data."},{"key":"C","text":"A data lakehouse provides storage solutions for structured and unstructured data."},{"key":"D","text":"A data lakehouse supports ACID-compliant transactions."}],"correct":["D"],"explanation":"Delta Lake aporta transacciones ACID, esquema y un registro de versiones sobre almacenamiento abierto. Esto permite lecturas y escrituras fiables, recuperación histórica y convivencia de batch y streaming.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Delta Lake aporta transacciones ACID, esquema y un registro de versiones sobre almacenamiento abierto. Esto permite lecturas y escrituras fiables, recuperación histórica y convivencia de batch y streaming.","wrongWhy":{"A":"Open formats por sí mismos no garantizan atomicidad/consistencia de escrituras.","B":"Consultas SQL no añaden por sí solas garantías ACID.","C":"La compatibilidad con datos estructurados/no estructurados no ofrece integridad transaccional."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":92,"topic":"Exam A","question":"In which scenario will a data team want to utilize cluster pools?","options":[{"key":"A","text":"An automated report needs to be version-controlled across multiple collaborators."},{"key":"B","text":"An automated report needs to be runnable by all stakeholders."},{"key":"C","text":"An automated report needs to be refreshed as quickly as possible."},{"key":"D","text":"An automated report needs to be made reproducible."}],"correct":["C"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"A":"Versionado colaborativo es materia de Git, no de pools de clusters.","B":"Permisos/uso compartido dependen de Jobs/UC, no del pool.","D":"Reproducibilidad se logra con código y versiones; el pool afecta aprovisionamiento."},"sourceLinks":[{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":93,"topic":"Exam A","question":"What is hosted completely in the control plane of the classic Databricks architecture?","options":[{"key":"A","text":"Worker node"},{"key":"B","text":"Databricks web application"},{"key":"C","text":"Driver node"},{"key":"D","text":"Databricks Filesystem"}],"correct":["B"],"explanation":"En la arquitectura clásica, el control plane alberga la interfaz web, los servicios de gestión y metadatos; el data plane ejecuta el cómputo y accede a los datos. El driver y los workers pertenecen al plano de ejecución.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"En la arquitectura clásica, el control plane alberga la interfaz web, los servicios de gestión y metadatos; el data plane ejecuta el cómputo y accede a los datos. El driver y los workers pertenecen al plano de ejecución.","wrongWhy":{"A":"Workers forman parte del cómputo, no de la web app.","C":"El driver también pertenece al compute plane.","D":"El sistema DBFS no se ubica completamente en el control plane."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":94,"topic":"Exam A","question":"A data engineer needs to determine whether to use the built-in Databricks Notebooks versioning or version their project\n  using Databricks Repos.\n\n\n  What is an advantage of using Databricks Repos over the Databricks Notebooks versioning?","options":[{"key":"A","text":"Databricks Repos allows users to revert to previous versions of a notebook"},{"key":"B","text":"Databricks Repos is wholly housed within the Databricks Data Intelligence Platform"},{"key":"C","text":"Databricks Repos provides the ability to comment on specific changes"},{"key":"D","text":"Databricks Repos supports the use of multiple branches"}],"correct":["D"],"explanation":"Git Pull incorpora cambios remotos; Commit registra cambios locales y los branches permiten desarrollar versiones paralelas. Algunas operaciones de Git se gestionan en el proveedor remoto.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Git Pull incorpora cambios remotos; Commit registra cambios locales y los branches permiten desarrollar versiones paralelas. Algunas operaciones de Git se gestionan en el proveedor remoto.","wrongWhy":{"A":"Revertir versiones también es posible con el historial nativo de notebooks, por lo que no diferencia Repos.","B":"Repos enlaza Git externo y no está íntegramente dentro de Databricks.","C":"Comentar cambios no es la ventaja distintiva frente al versionado de notebooks."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":95,"topic":"Exam A","question":"What is a benefit of the Databricks Lakehouse Architecture embracing open source technologies?","options":[{"key":"A","text":"Avoiding vendor lock-in"},{"key":"B","text":"Simplified governance"},{"key":"C","text":"Ability to scale workloads"},{"key":"D","text":"Cloud-specific integrations"}],"correct":["A"],"explanation":"El lakehouse intenta unificar ingeniería y analítica sobre los mismos datos. El uso de tecnologías abiertas ayuda a reducir dependencias de formatos propietarios.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"El lakehouse intenta unificar ingeniería y analítica sobre los mismos datos. El uso de tecnologías abiertas ayuda a reducir dependencias de formatos propietarios.","wrongWhy":{"B":"Simplificar gobierno exige Unity Catalog/políticas, no se deriva solo de OSS.","C":"Escalado de workloads es propiedad del motor y cloud, no la apertura del formato.","D":"Integraciones específicas de nube aumentan, en vez de reducir, dependencia de un vendor."},"sourceLinks":[{"label":"Delta Sharing","url":"https://docs.databricks.com/aws/en/delta-sharing/"}]},{"id":96,"topic":"Exam A","question":"A data engineer needs to use a Delta table as part of a data pipeline, but they do not know if they
