ataforma gestiona la ejecución del grafo.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Las canalizaciones declarativas describen datasets y sus dependencias, con soporte para SQL o Python y fuentes de streaming. La plataforma gestiona la ejecución del grafo.","wrongWhy":{"B":"DLT no requiere enforcement manual ni introduce deliberadamente alto overhead.","C":"Dispone de expectations y admite streaming; la afirmación lo niega.","D":"No está limitado a batch y aprovecha versiones Delta."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Auto Loader","url":"https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":147,"topic":"Exam A","question":"A data engineer is attempting to write Python and SQL in the same command cell and is running into an error. The\n  engineer thought that it was possible to use a Python variable in a select statement.\n\n\n  Why does the command fail?","options":[{"key":"A","text":"Databricks supports language interoperability in the same cell but only between Scala and SQL."},{"key":"B","text":"Databricks supports multiple languages but only one per notebook."},{"key":"C","text":"Databricks supports one language per cell."},{"key":"D","text":"Databricks supports language interoperability but only if a special character is used."}],"correct":["C"],"explanation":"Databricks permite alternar el lenguaje de distintas celdas en un notebook mediante magic commands, como %sql. No se mezclan libremente varios lenguajes en una misma celda.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"Databricks permite alternar el lenguaje de distintas celdas en un notebook mediante magic commands, como %sql. No se mezclan libremente varios lenguajes en una misma celda.","wrongWhy":{"A":"Interoperabilidad por celda no está restringida a Scala y SQL.","B":"Databricks sí permite distintas celdas de diferentes lenguajes en un mismo notebook.","D":"No se pueden mezclar libremente SQL y Python en una sola celda solo por añadir un carácter: hay que escoger el intérprete de esa celda."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":148,"topic":"Exam A","question":"Which compute option should be chosen in a scenario where small-scale ad-hoc Python scripts need to be run at high\n  frequency and should wind down quickly after these queries have finished running?","options":[{"key":"A","text":"All-purpose Cluster"},{"key":"B","text":"Job Cluster"},{"key":"C","text":"Serverless Compute"},{"key":"D","text":"SQL Warehouse"}],"correct":["C"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"A":"Un cluster all-purpose clásico puede seguir encendido/arrancar más lento para consultas frecuentes cortas.","B":"El job cluster requiere aprovisionamiento clásico y puede añadir start-up overhead.","D":"SQL Warehouse se orienta a SQL, no a scripts Python arbitrarios."},"sourceLinks":[{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":149,"topic":"Exam A","question":"A data engineer is working on a personal laptop and needs to perform complex transformations on data stored in a Delta\n  Lake on cloud storage. The engineer decides to use Databricks Connect to interact with Databricks clusters and work in\n  their local IDE.\n\n\n  How does Databricks Connect enable the engineer to develop, test, and debug code seamlessly on their local machine\n  while interacting with Databricks clusters?","options":[{"key":"A","text":"By providing a local environment that mimics the Databricks runtime, enabling the engineer to develop, test, and\n\n     debug code using a specific IDE that is required by Databricks"},{"key":"B","text":"By providing a local environment that mimics the Databricks runtime, enabling the engineer to develop, test, and\n\n     debug code only through Databricks’ own web interface"},{"key":"C","text":"By allowing direct execution of Spark jobs from the local machine without needing a network connection"},{"key":"D","text":"By providing a local environment that mimics the Databricks runtime, enabling the engineer to develop, test, and\n\n     debug code using their preferred IDE"}],"correct":["D"],"explanation":"Databricks Connect permite desarrollar desde un IDE local mientras el plan de ejecución Spark corre en compute remoto. Hay que compatibilizar versiones de cliente, runtime y Python para ciertas operaciones.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"Databricks Connect permite desarrollar desde un IDE local mientras el plan de ejecución Spark corre en compute remoto. Hay que compatibilizar versiones de cliente, runtime y Python para ciertas operaciones.","wrongWhy":{"A":"No obliga a un IDE particular; puedes usar IDE compatible de tu elección.","B":"Connect no limita el desarrollo a la interfaz web Databricks.","C":"Se requiere conectividad y compute remoto para ejecutar operaciones Spark."},"sourceLinks":[{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":150,"topic":"Exam A","question":"A company sells products across multiple categories (e.g., Electronics, Clothing) and regions. The sales team has provided\n  you with a PySpark dataframe named sales_df as below, and the team wants the data engineer to analyze the sales data\n  to help make strategic decisions.\n\n\n  sales_df\n\n\n    product_id      category        sales_amount       region\n    1               Electronics     100                North\n    2               Clothing        200                South\n    3               Electronics     150                North\n    4               Clothing        300                South\n\n    5                Electronics    250                East\n    6                Clothing       400                West\n\n  Calculate the total sales amount for each region and store the results in a new dataframe called region_sales.\n\n\n  Given the expected result:\n\n\n  region_sales\n\n\n    region     total_sales_amount\n    North      250\n    South      500\n    East       250\n    West       400\n\n  Which code will generate the expected result?","options":[{"key":"A","text":"region_sales = sales_df.groupBy(\"category\").sum(\"sales_amount\").alias(\"total_sales_amount\")"},{"key":"B","text":"region_sales = sales_df.groupBy(\"region\").agg(sum(\"sales_amount\").alias(\"total_sales_amount\"))"},{"key":"C","text":"region_sales = sales_df.sum(\"sales_amount\").groupBy(\"region\").alias(\"total_sales_amount\")"},{"key":"D","text":"region_sales = sales_df.agg(sum(\"sales_amount\").groupBy(\"region\").alias(\"total_sales_amount\"))"}],"correct":["B"],"explanation":"groupBy(...).agg(...) aplica agregaciones Spark por clave de agrupación. sum, avg y count pueden combinarse en la misma operación y renombrarse con alias.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"groupBy(...).agg(...) aplica agregaciones Spark por clave de agrupación. sum, avg y count pueden combinarse en la misma operación y renombrarse con alias.","wrongWhy":{"A":"Agrupa category cuando se quiere total por region.","C":"Intenta realizar sum antes de groupBy, sintaxis incorrecta.","D":"Intenta introducir groupBy dentro de agg, orden de API incorrecto."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":151,"topic":"Exam A","question":"A Data Engineer is building a simple data pipeline using Delta Live Tables (DLT) in Databricks to ingest customer data. The\n  raw customer data is stored in a cloud storage location in JSON format. The task is to create a DLT pipeline that reads the\n  raw JSON data and writes it into a Delta table for further processing.\n\n\n  Which code snippet will correctly ingest the raw JSON data and create a Delta table using DLT?","options":[{"key":"A","text":"import dlt\n\n\n    @dlt.table\n    def raw_customers():\n        return spark.read.format(\"csv\").load(\"s3://my-bucket/raw-customers/\")"},{"key":"B","text":"import dlt\n\n\n    @dlt.view\n    def raw_customers():\n        return spark.format.json(\"s3://my-bucket/raw-customers/\")"},{"key":"C","text":"import dlt\n\n\n    @dlt.table\n    def raw_customers():\n        return spark.read.json(\"s3://my-bucket/raw-customers/\")"},{"key":"D","text":"import dlt\n\n\n    @dlt.table\n    def raw_customers():\n        return spark.read.format(\"parquet\").load(\"s3://my-bucket/raw-customers/\")"}],"correct":["C"],"explanation":"Las canalizaciones declarativas describen datasets y sus dependencias, con soporte para SQL o Python y fuentes de streaming. La plataforma gestiona la ejecución del grafo.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Las canalizaciones declarativas describen datasets y sus dependencias, con soporte para SQL o Python y fuentes de streaming. La plataforma gestiona la ejecución del grafo.","wrongWhy":{"A":"Los archivos origen son JSON, no CSV.","B":"spark.format.json no es esa API para devolver un DataFrame desde una función de tabla.","D":"Los archivos origen son JSON, no Parquet."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":152,"topic":"Exam A","question":"A data engineering team is using Kafka to capture event data and then ingest it into Databricks. The team wants to be able\n  to see these historical events. Medallion architecture is already in place. The team wants to be mindful of costs.\n\n\n  Where should this historical event data be stored?","options":[{"key":"A","text":"Gold"},{"key":"B","text":"Silver"},{"key":"C","text":"Bronze"},{"key":"D","text":"Raw layer"}],"correct":["C"],"explanation":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","wrongWhy":{"A":"Gold suele contener productos de consumo/medidas resumidas, no evento histórico raw.","B":"Silver guarda datos limpios, no el histórico original completo como primer destino.","D":"Una capa raw externa adicional puede existir, pero dentro de Medallion el histórico fuente se conserva en Bronze."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":153,"topic":"Exam A","question":"What is the maximum output supported by a job cluster to ensure a notebook does not fail?","options":[{"key":"A","text":"25MBs"},{"key":"B","text":"10MBs"},{"key":"C","text":"30MBs"},{"key":"D","text":"15MBs"}],"correct":["C"],"explanation":"La pregunta evalúa un límite histórico de salida de notebook/job. Este tipo de límite puede variar por versión y conviene contrastarlo con la documentación del examen vigente.","issue":"El límite de salida de un notebook y el de un job pueden depender del mecanismo y de la versión del producto. Es una pregunta sensible a versión; contrástala antes de memorizar una cifra.","scorable":true,"category":"Compute / Spark","answerWhy":"El límite de salida de un notebook y el de un job pueden depender del mecanismo y de la versión del producto. Es una pregunta sensible a versión; contrástala antes de memorizar una cifra.","wrongWhy":{"A":"25 MB no coincide con el umbral marcado por esta versión del banco. Es una cifra histórica: verifica el límite actual en la guía del servicio.","B":"10 MB no coincide con el umbral marcado por el solucionario; no es una regla general aplicable a cualquier ejecución.","D":"15 MB no coincide con el umbral del banco y tampoco es universal en todas las modalidades."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":154,"topic":"Exam A","question":"Which two items are characteristics of the Gold Layer? (Choose two.)","options":[{"key":"A","text":"Historical lineage"},{"key":"B","text":"Raw Data"},{"key":"C","text":"Normalised"},{"key":"D","text":"De-normalised"},{"key":"E","text":"Read-optimized"}],"correct":["D","E"],"explanation":"La capa Gold prioriza consulta y consumo, por lo que puede tener esquemas desnormalizados y materializaciones optimizadas para lectura.","issue":null,"scorable":true,"category":"Fundamentos / Otros","answerWhy":"La capa Gold prioriza consulta y consumo, por lo que puede tener esquemas desnormalizados y materializaciones optimizadas para lectura.","wrongWhy":{"A":"El lineage se rastrea a lo largo de todas las capas, no distingue Gold.","B":"Raw corresponde a Bronze.","C":"Normalizado es típico de Silver; Gold suele estar desnormalizado y optimizado a lectura."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":155,"topic":"Exam A","question":"A data engineer has developed an ETL that produce a Delta managed table with liquid clustering feature activated as\n  output. Several consumers are having issues regarding time delay when reading this table.\n\n\n  How could the Data Engineer be sure about the OPTIMIZE command has been executed explicitly?","options":[{"key":"A","text":"Check the system table system.storage.predictive_optimization_operations_history"},{"key":"B","text":"Use SHOW TABLES EXTENDED to check the partitions columns used"},{"key":"C","text":"Use DESCRIBE DETAIL table to see the file size and number of files for the table"},{"key":"D","text":"Use DESCRIBE HISTORY table to check if exists any OPTIMIZE operation"}],"correct":["D"],"explanation":"OPTIMIZE reorganiza/compacta archivos Delta para mejorar lecturas; Liquid Clustering y predictive optimization gestionan el layout de forma más automática. DESCRIBE HISTORY permite revisar operaciones registradas.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"OPTIMIZE reorganiza/compacta archivos Delta para mejorar lecturas; Liquid Clustering y predictive optimization gestionan el layout de forma más automática. DESCRIBE HISTORY permite revisar operaciones registradas.","wrongWhy":{"A":"Las tablas de sistema registran optimización predictiva, pero no son la prueba directa de que hayas lanzado OPTIMIZE explícito.","B":"SHOW TABLES EXTENDED no lista operaciones de mantenimiento por fecha.","C":"DESCRIBE DETAIL muestra estado y tamaños, no el historial de comandos OPTIMIZE."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Liquid clustering","url":"https://docs.databricks.com/aws/en/delta/clustering"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":156,"topic":"Exam A","question":"A data engineer is reviewing the documentation on audit logs in Databricks for compliance purposes and needs to\n  understand the format in which audit logs output events.\n\n\n  How are events formatted in Databricks audit logs?","options":[{"key":"A","text":"In Databricks, audit logs output events in a JSON format."},{"key":"B","text":"In Databricks, audit logs output events in a CSV format."},{"key":"C","text":"In Databricks, audit logs output events in an XML format."},{"key":"D","text":"In Databricks, audit logs output events in a plain text format."}],"correct":["A"],"explanation":"Los audit logs registran acciones y eventos estructurados en JSON, adecuados para ingestión y análisis posterior.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"Los audit logs registran acciones y eventos estructurados en JSON, adecuados para ingestión y análisis posterior.","wrongWhy":{"B":"CSV no es el formato de evento del audit log descrito.","C":"XML no es el formato usado por esos eventos de auditoría.","D":"Texto plano sin estructura no es el formato de eventos del servicio."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":157,"topic":"Exam A","question":"A Python file is ready to go into production and the client wants to use the cheapest but most efficient type of cluster\n  possible. The workload is quite small, only processing 10GBs of data with only simple joins and no complex aggregations\n  or wide transformations.\n\n  Which cluster meets the requirement?","options":[{"key":"A","text":"Interactive cluster"},{"key":"B","text":"Job cluster with spot instances enabled"},{"key":"C","text":"Job cluster with spot instances disabled"},{"key":"D","text":"Job cluster with Photon enabled"}],"correct":["B"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"A":"Interactive cluster no es el mejor patrón para un job pequeño de producción que termina.","C":"No aprovechar Spot renuncia a ahorro potencial de este ejemplo; valorar fiabilidad requerida.","D":"Photon puede acelerar SQL/DataFrame, pero no garantiza ser más barato para un trabajo trivial y pequeño."},"sourceLinks":[{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":158,"topic":"Exam A","question":"A data engineer is working on a Databricks project that utilizes cloud storage. The data engineer wants to load several\n  JSON files from containers on a storage account as soon as the file arrives within the storage account.\n\n\n  Which syntax should the data engineer follow to first load the files into a dataframe and check that it is working as\n  expected using Python?","options":[{"key":"A","text":"df = spark.read.json(\"input/path\")"},{"key":"B","text":"df = spark.readStream.format(\"cloud\").option(\"json\").load(\"/input/path\")"},{"key":"C","text":"df = spark.readStream.format(\"json\").load(\"input/path\")"},{"key":"D","text":"df = spark.readStream.format(\"cloudFiles\").option(\"cloudFiles.format\", \"json\").load(\"/input/path\")"}],"correct":["D"],"explanation":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","wrongWhy":{"A":"spark.read.json es batch: no detectará nuevas llegadas en el tiempo.","B":"format(\"cloud\") y option(\"json\") no son los identificadores correctos de Auto Loader.","C":"readStream.format(\"json\") hace streaming simple; el escenario/clave del PDF espera Auto Loader con cloudFiles y evolución de archivos."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"},{"label":"Auto Loader","url":"https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/"}]},{"id":159,"topic":"Exam A","question":"A data engineer team has decided to implement a new data platform on Databricks and is currently deciding how to store\n  each kind of data on each data layer.\n\n\n  What is the appropriate layer and data pairing for medallion architecture?","options":[{"key":"A","text":"Silver Layer - Raw data from deposit account application"},{"key":"B","text":"Bronze Layer - Summary of cash deposit amount for each country and city"},{"key":"C","text":"Silver Layer - Cleansed master customer data"},{"key":"D","text":"Gold Layer - Deduplicated money transfer transaction"}],"correct":["C"],"explanation":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Bronze conserva datos crudos y metadatos de ingestión, Silver limpia/conforma y Gold prepara datos agregados o de negocio para el consumo analítico. La cantidad de filas no determina la capa.","wrongWhy":{"A":"El dato raw fuente no se considera Silver limpio/conformado.","B":"Totales por país/ciudad son métricas agregadas de Gold, no Bronze.","D":"Una transacción deduplicada suele prepararse en Silver, no es necesariamente una tabla Gold de consumo."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"}]},{"id":160,"topic":"Exam A","question":"A data engineer is processing ingested streaming tables and needs to filter out NULL values in the order_datetime column\n  from the raw streaming table orders_raw and store the results in a new table orders_valid using DLT.\n\n\n  Which code snippet should the data engineer use?","options":[{"key":"A","text":"CREATE OR REFRESH STREAMING TABLE orders_valid(\n\n      CONSTRAINT valid_date\n      EXPECT (order_datetime IS NOT NULL)\n      ON VIOLATION DROP ROW\n    )\n    AS SELECT * FROM STREAM orders_raw;"},{"key":"B","text":"CREATE OR REFRESH STREAMING TABLE orders_valid\n\n    (\n      CONSTRAINT valid_date EXPECT (order_datetime IS NOT NULL)\n      ON VIOLATION DROP ROW\n    )\n    AS SELECT * FROM orders_raw;"},{"key":"C","text":"CREATE OR REFRESH STREAMING TABLE orders_valid\n\n    AS\n    SELECT *\n    FROM STREAM(orders_raw)\n    WHERE order_datetime IS NOT NULL;"},{"key":"D","text":"CREATE OR REPLACE STREAMING TABLE orders_valid\n\n    (\n      FILTER (order_datetime IS NOT NULL)\n    )\n    AS SELECT * FROM STREAM(orders_raw);"}],"correct":["C"],"explanation":"Las canalizaciones declarativas describen datasets y sus dependencias, con soporte para SQL o Python y fuentes de streaming. La plataforma gestiona la ejecución del grafo.","issue":null,"scorable":true,"category":"Lakeflow / Medallion","answerWhy":"Las canalizaciones declarativas describen datasets y sus dependencias, con soporte para SQL o Python y fuentes de streaming. La plataforma gestiona la ejecución del grafo.","wrongWhy":{"A":"STREAM orders_raw sin paréntesis no es la sintaxis esperada del acceso streaming en ese SQL.","B":"No marca la lectura de origen con STREAM(), por lo que no tiene la semántica incremental deseada.","D":"FILTER no es una cláusula declarativa válida dentro de la definición de tabla de ese modo."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":161,"topic":"Exam A","question":"A data engineer is managing a data pipeline in Databricks, where multiple Delta tables are used for various\n  transformations. The team wants to track how data flows through the pipeline, including identifying dependencies\n  between Delta tables, notebooks, jobs, and dashboards. The data engineer is utilizing the Unity Catalog lineage feature to\n  monitor this process.\n\n\n  How does Unity Catalog’s data lineage feature support the visualization of relationships between Delta tables,\n  notebooks, jobs, and dashboards?","options":[{"key":"A","text":"Unity Catalog lineage visualizes dependencies between Delta tables, notebooks, and jobs, but does not provide\n\n       column-level tracing or relationships with dashboards."},{"key":"B","text":"Unity Catalog lineage only supports visualizing relationships at the table level and does not extend to notebooks,\n\n       jobs, or dashboards."},{"key":"C","text":"Unity Catalog lineage provides an interactive graph that tracks dependencies between tables and notebook but\n\n     excludes any job-related dependencies or dashboard visualizations."},{"key":"D","text":"Unity Catalog provides an interactive graph that visualizes the dependencies between Delta tables, notebooks, jobs,\n\n     and dashboards, while also supporting column-level tracking of data transformations."}],"correct":["D"],"explanation":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","wrongWhy":{"A":"Unity Catalog sí puede mostrar lineage a nivel de columna y conectar activos posteriores como dashboards.","B":"Limitarse a tablas omite notebooks y jobs presentes en el grafo de dependencias.","C":"El lineage puede incluir Jobs y Dashboards, no solo tablas y notebooks."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":162,"topic":"Exam A","question":"A data engineer needs to conduct Exploratory Analysis on data residing in a database that is within the company’s\n  custom-defined network in the cloud. The data engineer is using SQL for this task.\n\n\n  Which type of SQL Warehouse will enable the data engineer to process large numbers of queries quickly and cost-\n  effectively?","options":[{"key":"A","text":"Serverless compute for notebooks"},{"key":"B","text":"Pro SQL Warehouse"},{"key":"C","text":"Classic SQL Warehouse"},{"key":"D","text":"Serverless SQL Warehouse"}],"correct":["B"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"A":"Serverless Notebook no es un SQL Warehouse para la fuente privada consultada.","C":"Classic carece de algunas capacidades avanzadas de Pro necesarias para este escenario de red.","D":"Serverless SQL Warehouse no equivale siempre a conectividad directa desde la red privada propia; verificar redes soportadas."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":163,"topic":"Exam A","question":"A data engineer is configuring Unity Catalog in Databricks and needs to assign a role to a user who should have the ability\n  to grant and revoke privileges on various data objects within a specific schema, but should not have read/write access\n  over the schema or its objects.\n\n\n  Which role should the data engineer assign to this user?","options":[{"key":"A","text":"Table Owner"},{"key":"B","text":"Catalog Owner"},{"key":"C","text":"Schema Owner"},{"key":"D","text":"USE catalog/schema privilege on the schema"}],"correct":["C"],"explanation":"La titularidad de un schema conlleva capacidad de administrar permisos sobre él según las reglas de Unity Catalog; la gestión de permisos no equivale a un permiso SELECT ordinario.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"La titularidad de un schema conlleva capacidad de administrar permisos sobre él según las reglas de Unity Catalog; la gestión de permisos no equivale a un permiso SELECT ordinario.","wrongWhy":{"A":"Ser owner de una tabla no permite administrar todo un schema.","B":"Ser owner de todo el catálogo concede ámbito excesivo para la delegación pedida.","D":"USE permite navegación, no revocar/conceder privilegios de objetos."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"}]},{"id":164,"topic":"Exam A","question":"A data engineer is debugging a Python notebook in Databricks that processes a dataset using PySpark. The notebook fails\n  with an error during a DataFrame transformation. The engineer wants to inspect the state of variables, such as the input\n  DataFrame and intermediate results, to identify where the error occurs.\n\n\n  Which tool should the engineer use to debug the notebook and inspect the values of variables like DataFrames?","options":[{"key":"A","text":"Use the Databricks CLI to download and analyze driver logs for detailed error messages"},{"key":"B","text":"Use the Python Notebook Interactive Debugger to set breakpoints and inspect variable values in real-time"},{"key":"C","text":"Use the Ganglia UI to monitor cluster resource usage and identify hardware issues"},{"key":"D","text":"Use the Spark UI to analyze the execution plan and identify stages where the job failed"}],"correct":["B"],"explanation":"El depurador interactivo de notebooks permite establecer puntos de interrupción e inspeccionar variables/DataFrames para localizar dónde se produce una transformación errónea.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El depurador interactivo de notebooks permite establecer puntos de interrupción e inspeccionar variables/DataFrames para localizar dónde se produce una transformación errónea.","wrongWhy":{"A":"La CLI y los logs ayudan a investigar errores, pero no permiten pasos interactivos y ver variables como debugger.","C":"Ganglia monitorea recursos, no valores de DataFrames dentro del código.","D":"Spark UI analiza stages/planes, no sustituyen breakpoints y variables del notebook."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":165,"topic":"Exam A","question":"A data engineer wants to create an external table in Databricks that references data stored in an Azure Data Lake Storage\n  (ADLS) location. The goal is to enable Databricks to access and query this external data without moving it into the\n  Databricks-managed storage.\n\n\n  Which step should the data engineer take to successfully create the external table?","options":[{"key":"A","text":"Use the CREATE MANAGED TABLE statement and specify the LOCATION clause with the path to the external data."},{"key":"B","text":"CREATE UNMANAGED TABLE statement without specifying a LOCATION clause."},{"key":"C","text":"Use the CREATE TABLE statement and specify the LOCATION clause with the path to the external data."},{"key":"D","text":"CREATE EXTERNAL TABLE statement without specifying a LOCATION clause."}],"correct":["C"],"explanation":"Una tabla managed delega en la plataforma el ciclo de vida de datos y metadatos; en una tabla external, los archivos permanecen en la ubicación externa al borrar el registro del catálogo. Las migraciones deben validar dependencias.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"Una tabla managed delega en la plataforma el ciclo de vida de datos y metadatos; en una tabla external, los archivos permanecen en la ubicación externa al borrar el registro del catálogo. Las migraciones deben validar dependencias.","wrongWhy":{"A":"Managed y LOCATION external no son ese patrón: el ciclo de vida queda delegado a UC.","B":"CREATE UNMANAGED TABLE no es la sintaxis del patrón ni define el destino.","D":"Sin LOCATION no se vincula explícitamente al objeto externo."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"}]},{"id":166,"topic":"Exam A","question":"A data engineer is developing a small proof of concept in a notebook. When running the entire notebook, the Cluster\n  usage spikes. The data engineer wants to keep the development requirements and get real-time results.\n\n\n  Which Cluster meets these requirements?","options":[{"key":"A","text":"All Purpose Cluster with autoscaling"},{"key":"B","text":"Job Cluster with Photon enabled and autoscaling"},{"key":"C","text":"Job Cluster with autoscaling enabled"},{"key":"D","text":"All-Purpose Cluster with a large fixed memory size"}],"correct":["A"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"B":"Los job clusters priorizan ejecuciones programadas; no son la opción principal de desarrollo interactivo de la prueba.","C":"Mismo motivo: Job compute no es lo ideal para iteración manual.","D":"Un all-purpose grande fijo queda sobredimensionado en momentos ociosos; autoscaling adapta recursos."},"sourceLinks":[{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":167,"topic":"Exam A","question":"A data engineer needs to process SQL queries on a large dataset with fluctuating workloads. The workload requires\n  automatic scaling based on the volume of queries, without the need to manage or provision infrastructure. The solution\n  should be cost-efficient and charge only for the compute resources used during query execution.\n\n\n  Which compute option should the data engineer use?","options":[{"key":"A","text":"Databricks SQL Analytics"},{"key":"B","text":"Databricks Runtime for ML"},{"key":"C","text":"Databricks Jobs"},{"key":"D","text":"Serverless SQL Warehouse"}],"correct":["D"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"A":"Databricks SQL Analytics es el paraguas de servicio, no la opción específica serverless de compute.","B":"DBR for ML es runtime de ML, no warehouse SQL autoscalable.","C":"Jobs orquesta tareas pero no es el SQL engine serverless de consultas ad hoc."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":168,"topic":"Exam A","question":"What is the functionality of AutoLoader in Databricks?","options":[{"key":"A","text":"Auto Loader automatically ingests and processes new files from cloud storage, handling both batch and streaming\n\n     data with support for schema evolution."},{"key":"B","text":"Auto Loader automatically ingests and processes new files from cloud storage, handling batch and streaming data\n\n     with no support for schema evolution."},{"key":"C","text":"Auto Loader automatically ingests and processes new files from cloud storage, handling only streaming data with no\n\n     support for schema evolution."},{"key":"D","text":"Auto Loader automatically ingests and processes new files from cloud storage, handling batch data with support for\n\n     schema evolution."}],"correct":["A"],"explanation":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","wrongWhy":{"B":"Niega la evolución de esquema, una de las capacidades propias de Auto Loader.","C":"Auto Loader sí permite evolución y uso por cargas incrementales finitas.","D":"Limitarlo a batch ignora la base Structured Streaming."},"sourceLinks":[{"label":"Auto Loader","url":"https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/"}]},{"id":169,"topic":"Exam A","question":"A company is collaborating with a partner that does not use Databricks but needs access to a large historical dataset\n  stored in Delta format. The data engineer needs to ensure that the partner can access the data securely, without the need\n  for them to set up an account, and with read-only access.\n\n\n  How should the data be shared?","options":[{"key":"A","text":"Share the dataset by exporting it to a CSV file and manually transferring the file to the partner’s system."},{"key":"B","text":"Grant your partner access to your Databricks workspace and assign them full write permissions to the Delta table,\n\n     enabling them to modify the dataset."},{"key":"C","text":"Share the dataset using Unity Catalog, ensuring that both teams have full write access to the data within the same\n\n     organization."},{"key":"D","text":"Share the dataset using Delta Sharing, which allows your partner to access the data using a secure, read-only URL\n\n     without requiring a Databricks account, ensuring that they cannot modify the data."}],"correct":["D"],"explanation":"Delta Sharing ofrece intercambio de datos con otras organizaciones/plataformas, con protocolos y permisos adecuados. Las transferencias entre regiones y nubes pueden generar costes de salida de datos.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"Delta Sharing ofrece intercambio de datos con otras organizaciones/plataformas, con protocolos y permisos adecuados. Las transferencias entre regiones y nubes pueden generar costes de salida de datos.","wrongWhy":{"A":"CSV por correo obliga a copiar el dataset y pierde controles gobernados.","B":"Conceder escritura completa en tu workspace incumple lectura/aislamiento.","C":"Exige un mismo entorno y da escritura; el socio no necesita acceso Databricks."},"sourceLinks":[{"label":"Delta Sharing","url":"https://docs.databricks.com/aws/en/delta-sharing/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":170,"topic":"Exam A","question":"A data engineer is using the Databricks OPTIMIZE command on a Delta table.\n\n\n  What happens when OPTIMIZE is run twice on the same table with the same data?","options":[{"key":"A","text":"It has no effect because it is idempotent."},{"key":"B","text":"It changes the number of tuples per file significantly."},{"key":"C","text":"It further reduces file sizes by re-clustering the data."},{"key":"D","text":"It triggers a full liquid clustering process."}],"correct":["A"],"explanation":"OPTIMIZE reorganiza/compacta archivos Delta para mejorar lecturas; Liquid Clustering y predictive optimization gestionan el layout de forma más automática. DESCRIBE HISTORY permite revisar operaciones registradas.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"OPTIMIZE reorganiza/compacta archivos Delta para mejorar lecturas; Liquid Clustering y predictive optimization gestionan el layout de forma más automática. DESCRIBE HISTORY permite revisar operaciones registradas.","wrongWhy":{"B":"Si no cambian los datos ni el layout, una segunda optimización no debería modificar materialmente los archivos.","C":"OPTIMIZE no se dedica a partir archivos cada vez más pequeños.","D":"No fuerza un recálculo completo de Liquid Clustering en cada invocación."},"sourceLinks":[{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":171,"topic":"Exam A","question":"A data engineer at a company that uses Databricks with Unity Catalog needs to share a collection of tables with an\n  external partner who also uses a Databricks workspace enabled for Unity Catalog. The data engineer decides to use Delta\n  Sharing to accomplish this.\n\n\n  What is the first piece of information the data engineer should request from the external partner to set up Delta Sharing?","options":[{"key":"A","text":"The IP address of their Databricks workspace"},{"key":"B","text":"The name of their Databricks cluster"},{"key":"C","text":"The sharing identifier of their Unity Catalog metastore"},{"key":"D","text":"Their Databricks account password"}],"correct":["C"],"explanation":"Delta Sharing ofrece intercambio de datos con otras organizaciones/plataformas, con protocolos y permisos adecuados. Las transferencias entre regiones y nubes pueden generar costes de salida de datos.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"Delta Sharing ofrece intercambio de datos con otras organizaciones/plataformas, con protocolos y permisos adecuados. Las transferencias entre regiones y nubes pueden generar costes de salida de datos.","wrongWhy":{"A":"La IP del workspace no identifica el recipient UC para compartir de forma nativa.","B":"El nombre de un cluster no es un identificador de sharing.","D":"Nunca se comparte una contraseña para configurar Delta Sharing."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Delta Sharing","url":"https://docs.databricks.com/aws/en/delta-sharing/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":172,"topic":"Exam A","question":"A Databricks workflow fails at the last stage due to an error in a notebook. This workflow runs daily. The data engineer\n  fixes the mistake and wants to rerun the pipeline. This workflow is very costly and time-intensive to run.\n\n\n  Which action should the data engineer do in order to minimise downtime and cost?","options":[{"key":"A","text":"Re-run the entire workflow"},{"key":"B","text":"Repair run"},{"key":"C","text":"Restart the cluster"},{"key":"D","text":"Switch to another cluster"}],"correct":["B"],"explanation":"Los Jobs permiten programar, monitorizar y recuperar trabajos. Repair run reejecuta tareas fallidas o pendientes sin repetir necesariamente toda la ejecución ya completada.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Los Jobs permiten programar, monitorizar y recuperar trabajos. Repair run reejecuta tareas fallidas o pendientes sin repetir necesariamente toda la ejecución ya completada.","wrongWhy":{"A":"Volver a lanzar todo repetiría tareas costosas que terminaron con éxito.","C":"Reiniciar el cluster no repara automáticamente la definición del task fallido.","D":"Cambiar cluster no hace reejecución selectiva conservando historial."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":173,"topic":"Exam A","question":"An organization has implemented a data pipeline in Databricks and needs to ensure it can scale automatically based on\n  varying workloads without manual cluster management. The goal is to meet the company’s Service Level Agreements\n  (SLAs), which require high availability and minimal downtime, while Databricks automatically handles resource allocation\n  and optimization.\n\n\n  Which approach fulfills these requirements?","options":[{"key":"A","text":"Deploy Job Clusters with fixed configurations, dedicated to specific tasks, without automatic scaling."},{"key":"B","text":"Use Spot Instances to allocate resources dynamically while minimizing costs, with potential interruptions."},{"key":"C","text":"Use Interactive Clusters in Databricks, adjusting cluster sizes manually based on workload demands."},{"key":"D","text":"Use Serverless compute in Databricks to automatically scale and provision resources with minimal manual\n\n     intervention."}],"correct":["D"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"A":"Un cluster fijo impide ajustar recursos dinámicamente a la carga.","B":"Spot abarata con riesgo de interrupción y no garantiza alta disponibilidad.","C":"Ajuste manual consume operaciones y no cumple automatización del SLA."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":174,"topic":"Exam A","question":"A data engineer has been provided a PySpark DataFrame named df with columns product and revenue. The data engineer\n  needs to compute complex aggregations to determine each product’s total revenue, average revenue, and transaction\n  count.\n\n\n  Which code snippet should the data engineer use?","options":[{"key":"A","text":"from pyspark.sql import functions as F\n\n    aggregated_df = df.groupBy(\"product\").agg(F.sum(\"revenue\").alias(\"total_revenue\"),\n    F.avg(\"revenue\").alias(\"avg_revenue\"), F.count(\"*\").alias(\"transaction_count\") )"},{"key":"B","text":"aggregated_df = df.groupby(\"product\").agg(\n\n        \"sum(revenue)\",\n        \"avg(revenue)\",\n        \"count(revenue)\"\n    )"},{"key":"C","text":"from pyspark.sql import functions as F aggregated_df = df.select(\"product\",\n\n    \"revenue\").groupBy(\"product\").agg( F.sum(\"revenue\"), F.mean(\"revenue\") )"},{"key":"D","text":"aggregated_df =\n\n    df.groupBy(\"product\").agg( {\"revenue\": \"sum\", \"revenue\": \"avg\", \"revenue\": \"count\"} )"}],"correct":["A"],"explanation":"groupBy(...).agg(...) aplica agregaciones Spark por clave de agrupación. sum, avg y count pueden combinarse en la misma operación y renombrarse con alias.","issue":null,"scorable":true,"category":"JOIN / SQL","answerWhy":"groupBy(...).agg(...) aplica agregaciones Spark por clave de agrupación. sum, avg y count pueden combinarse en la misma operación y renombrarse con alias.","wrongWhy":{"B":"groupby existe en DataFrame API pero agg con cadenas de nombres de funciones no produce esa salida completa y alias.","C":"No calcula count y no asigna los alias/columnas esperados.","D":"Un diccionario no puede tener tres entradas con la misma clave revenue: se pisan unas a otras."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":175,"topic":"Exam A","question":"A Databricks single-task workflow fails at the last task due to an error in a notebook. The data engineer fixes the mistake\n  in the notebook.\n\n\n  What should the data engineer do to rerun the workflow?","options":[{"key":"A","text":"Repair the task"},{"key":"B","text":"Rerun the pipeline"},{"key":"C","text":"Restart the cluster"},{"key":"D","text":"Switch the cluster"}],"correct":["B"],"explanation":"Los Jobs permiten programar, monitorizar y recuperar trabajos. Repair run reejecuta tareas fallidas o pendientes sin repetir necesariamente toda la ejecución ya completada.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Los Jobs permiten programar, monitorizar y recuperar trabajos. Repair run reejecuta tareas fallidas o pendientes sin repetir necesariamente toda la ejecución ya completada.","wrongWhy":{"A":"El enunciado describe job single-task y la clave del PDF indica reejecutar; no hay upstream exitosas que ahorrar con reparación.","C":"Reiniciar compute no lanza el job corregido.","D":"Cambiar cluster no reejecuta la tarea."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":176,"topic":"Exam A","question":"A data engineer needs to provide access to a group named manufacturing-team. The team needs privileges to create\n  tables in the quality schema.\n\n\n  Which set of SQL commands will grant a group named manufacturing-team to create tables in a schema named\n  production with the parent catalog named manufacturing with the least privileges?","options":[{"key":"A","text":"GRANT CREATE TABLE ON SCHEMA manufacturing.quality TO manufacturing-team; GRANT USE SCHEMA ON SCHEMA\n\n     manufacturing.quality TO manufacturing-team; GRANT USE CATALOG ON CATALOG manufacturing TO manufacturing-\n     team;"},{"key":"B","text":"GRANT USE TABLE ON SCHEMA manufacturing.quality TO manufacturing-team; GRANT USE SCHEMA ON SCHEMA\n\n     manufacturing.quality TO manufacturing-team; GRANT USE CATALOG ON CATALOG manufacturing TO manufacturing-\n     team;"},{"key":"C","text":"GRANT CREATE TABLE ON SCHEMA manufacturing.quality TO manufacturing-team; GRANT CREATE SCHEMA ON\n\n     SCHEMA manufacturing.quality TO manufacturing-team; GRANT CREATE CATALOG ON CATALOG manufacturing TO\n     manufacturing-team;"},{"key":"D","text":"GRANT CREATE TABLE ON SCHEMA manufacturing.quality TO manufacturing-team; GRANT CREATE SCHEMA ON\n\n     SCHEMA manufacturing.quality TO manufacturing-team; GRANT USE CATALOG ON CATALOG manufacturing TO\n     manufacturing-team;"}],"correct":["A"],"explanation":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"El gobierno se apoya en permisos y propiedad de objetos de Unity Catalog. Deben diferenciarse acceso al catálogo/esquema, privilegios sobre tablas/vistas y facultades de administrar concesiones.","wrongWhy":{"B":"USE TABLE no es el permiso correcto para crear tablas.","C":"CREATE SCHEMA/CATALOG es excesivo y mal aplicado a niveles de objeto incorrectos.","D":"CREATE SCHEMA da permisos innecesarios y no reemplaza USE SCHEMA."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":177,"topic":"Exam A","question":"A data engineer has written a function in a Databricks Notebook to calculate the population of bacteria in a given\n  medium.\n\n    def calculate_population_of_bacteria (intital_population, exponential_factor)\n        return future_population = intitial_population ** exponential_factor\n\n  Analysts use this function in the notebook and sometimes provide input arguments of the wrong data type, which can\n  cause errors during execution.\n\n\n  Which Databricks feature will help the data engineer quickly identify if an incorrect data type has been provided as input?","options":[{"key":"A","text":"The Spark User interface has a debug tab that contains the variables that are used in this session."},{"key":"B","text":"The Databricks debugger enables breakpoints that will raise an error if the wrong data type is submitted."},{"key":"C","text":"The Databricks debugger enables the use of a variable explorer to see at a glance the value of the variables."},{"key":"D","text":"The Data Engineer should add print statements to find out what the variable is."}],"correct":["C"],"explanation":"El depurador interactivo de Python permite colocar breakpoints y revisar valores de variables durante la ejecución de notebooks.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El depurador interactivo de Python permite colocar breakpoints y revisar valores de variables durante la ejecución de notebooks.","wrongWhy":{"A":"Spark UI no tiene un depurador de variables Python a nivel notebook.","B":"Un breakpoint pausa ejecución, pero no valida automáticamente que el dato tenga un tipo correcto.","D":"Print ayuda puntualmente, pero el inspector de variables del debugger ofrece una revisión más directa."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":178,"topic":"Exam A","question":"A data engineer is inspecting an ETL pipeline based on a Pyspark job that consistently encounters performance\n  bottlenecks. Based on developer feedback, the data engineer assumes the job is low on compute resources. To pinpoint\n  the issue, the data engineer observes the Spark UI and finds out the job has a high CPU time vs Task time.\n\n\n  Which course of action should the data engineer take?","options":[{"key":"A","text":"High CPU time vs Task time means an under-utilized cluster. The data engineer may need to repartition data to\n\n     spread the jobs more evenly throughout the cluster."},{"key":"B","text":"High CPU time vs Task time means efficient use of cluster and no change needed"},{"key":"C","text":"High CPU time vs Task time means a CPU over-utilized job. The data engineer may need to consider executor and\n\n     core tuning or resizing the cluster"},{"key":"D","text":"High CPU time vs Task time means over-utilized memory and the need to increase parallelism"}],"correct":["C"],"explanation":"La Spark UI ayuda a localizar cuellos de botella de CPU, shuffle, spill, skew y memoria. El driver sufre al recoger datos localmente; los executors y el particionamiento afectan a los joins distribuidos.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"La Spark UI ayuda a localizar cuellos de botella de CPU, shuffle, spill, skew y memoria. El driver sufre al recoger datos localmente; los executors y el particionamiento afectan a los joins distribuidos.","wrongWhy":{"A":"CPU time elevado respecto a task time indica ocupación CPU, no necesariamente subutilización.","B":"Una carga CPU-bound puede beneficiarse de tuning; no hay garantía de que no se necesiten ajustes.","D":"No se deduce un déficit de memoria solo de CPU time alto."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":179,"topic":"Exam A","question":"A data engineer needs to parse only png files in a directory that contains files with different suffixes.\n\n\n  Which code should the data engineer use to achieve this task?","options":[{"key":"A","text":"`df = spark.readStream.format(\"cloudFiles\").option(\"cloudFiles.format\", \"binaryFile\").append(\"/*.png\")`"},{"key":"B","text":"`df = spark.readstream.format(\"cloudFiles\").option(\"cloudFiles.format\", \"binaryFile\").option(\"pathGlobFilter\",\n\n     \"*.png\").load()`"},{"key":"C","text":"`df = spark.readstream.format(\"cloudFiles\").option(\"cloudFiles.format\", \"binaryFile\").option(\"pathGlobFilter\",\n\n     \"*.png\").append()`"},{"key":"D","text":"`df = spark.readstream.format(\"cloudFiles\").option(\"cloudFiles.format\", \"binaryFile\").load(\"/*.png\")`"}],"correct":["B"],"explanation":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","issue":null,"scorable":true,"category":"Ingesta / Streaming","answerWhy":"Auto Loader utiliza Structured Streaming (fuente cloudFiles) para detectar y procesar archivos nuevos. Mantiene el seguimiento de lo procesado y admite opciones de evolución de esquema y descubrimiento de archivos.","wrongWhy":{"A":"append no es método para indicar ruta/glob al DataFrameReader.","C":"También acaba en append en lugar de load: no configura la fuente.","D":"Puede filtrar por glob de ruta en ciertos contextos, pero en el caso se espera pathGlobFilter con cloudFiles; además falta ruta base."},"sourceLinks":[{"label":"Auto Loader","url":"https://docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":180,"topic":"Exam A","question":"Which languages are supported by Serverless compute clusters? (Choose two.)","options":[{"key":"A","text":"SQL"},{"key":"B","text":"Python"},{"key":"C","text":"R"},{"key":"D","text":"Scala"},{"key":"E","text":"Java"}],"correct":["A","B"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"C":"El soporte de R no corresponde a los lenguajes esperados por la modalidad Serverless del examen.","D":"Scala no es el lenguaje elegido para esos workflows Serverless del banco.","E":"Java no se incluye entre los dos lenguajes de la opción validada."},"sourceLinks":[{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":181,"topic":"Exam A","question":"A data engineer is working in a Python notebook on Databricks to process data, but notices that the output is not as\n  expected. The data engineer wants to investigate the issue by stepping through the code and checking the values of\n  certain variables during execution.\n\n\n  Which tool should the data engineer use to inspect the code execution and variables in real-time?","options":[{"key":"A","text":"Cluster Logs"},{"key":"B","text":"Job Execution Dashboard"},{"key":"C","text":"Python Notebook Interactive Debugger"},{"key":"D","text":"SQL Analytics"}],"correct":["C"],"explanation":"El depurador interactivo de Python permite colocar breakpoints y revisar valores de variables durante la ejecución de notebooks.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El depurador interactivo de Python permite colocar breakpoints y revisar valores de variables durante la ejecución de notebooks.","wrongWhy":{"A":"Logs capturan eventos y excepciones, pero no permiten inspección paso a paso de variables.","B":"Job dashboard enseña estado temporal, no variables del notebook.","D":"SQL Analytics no es un debugger de Python."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"}]},{"id":182,"topic":"Exam A","question":"A data engineer has inherited a Databricks pipeline from a previous team. The pipeline is missing its SLAs, and an initial\n  investigation has identified memory spills in Spark. These increased runtimes are also driving up costs. The data engineer\n  needs to reduce the runtime without significantly increasing costs.\n\n\n  What should the data engineer do first to address this issue?","options":[{"key":"A","text":"Tweak the \"spark.sql.shuffle.partitions\" configuration."},{"key":"B","text":"Enable autoscaling in the cluster to match the requirements"},{"key":"C","text":"Use a photon enabled execution engine."},{"key":"D","text":"Ensure the cluster uses memory optimized node types."}],"correct":["A"],"explanation":"La Spark UI ayuda a localizar cuellos de botella de CPU, shuffle, spill, skew y memoria. El driver sufre al recoger datos localmente; los executors y el particionamiento afectan a los joins distribuidos.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"La Spark UI ayuda a localizar cuellos de botella de CPU, shuffle, spill, skew y memoria. El driver sufre al recoger datos localmente; los executors y el particionamiento afectan a los joins distribuidos.","wrongWhy":{"B":"Autoscaling aumenta o reduce capacidad, pero no corrige directamente una partición shuffle excesiva.","C":"Photon puede acelerar operadores soportados, pero antes conviene resolver el layout/shuffle.","D":"Memory-optimized nodes cuestan más y no siempre eliminan la causa del spill."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":183,"topic":"Exam A","question":"A data engineer is facing performance bottlenecks in an e-commerce transactions Delta table. The table is a managed\n  Unity Catalog table, and it uses partitioning and Z-ordering in its data layout scheme. The predictive optimization for Unity\n  Catalog tables is also enabled. The table has a frequently changing query filter, and the data engineer does not observe a\n  benefit of the Data Layout or the Predictive Optimization.\n\n\n  How should the data engineer fix the data layout bottlenecks?","options":[{"key":"A","text":"Re-write the Data Layout with Liquid Clustering and cluster by the Z-Ordered columns."},{"key":"B","text":"Enable Delta Caching so that query results can be read through caches."},{"key":"C","text":"Tweak the Z-Order columns and run OPTIMIZE manually."},{"key":"D","text":"Switch the Data layout from Partition+Z-Ordering to Automatic Liquid Clustering."}],"correct":["C"],"explanation":"OPTIMIZE reorganiza/compacta archivos Delta para mejorar lecturas; Liquid Clustering y predictive optimization gestionan el layout de forma más automática. DESCRIBE HISTORY permite revisar operaciones registradas.","issue":"El PDF prefiere cambiar columnas de Z-ORDER y ejecutar OPTIMIZE manualmente; con filtros cambiantes y tablas UC gestionadas hoy suele valorarse Automatic Liquid Clustering. La pregunta tiene versiones alternativas (187) con claves distintas.","scorable":true,"category":"Delta Lake","answerWhy":"El PDF prefiere cambiar columnas de Z-ORDER y ejecutar OPTIMIZE manualmente; con filtros cambiantes y tablas UC gestionadas hoy suele valorarse Automatic Liquid Clustering. La pregunta tiene versiones alternativas (187) con claves distintas.","wrongWhy":{"A":"Reescribir con claves Z-ORDER previas no necesariamente se adapta a nuevos filtros.","B":"Delta Cache no soluciona el layout físico para diferentes filtros.","D":"Esta opción es razonable en versiones actuales; el banco 183 y 187 discrepan y conviene revisar antes de memorizar."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Liquid clustering","url":"https://docs.databricks.com/aws/en/delta/clustering"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":184,"topic":"Exam A","question":"A data engineer needs to combine sales data from an on-premises PostgreSQL database with customer data in Azure\n  Synapse for a comprehensive report. The goal is to avoid data duplication and ensure up-to-date information.\n\n\n  How should the data engineer achieve this using Databricks?","options":[{"key":"A","text":"Export data from both sources to CSV files and upload them to Databricks"},{"key":"B","text":"Use Lakehouse Federation to query both data sources directly"},{"key":"C","text":"Manually synchronize data from both sources into a single database"},{"key":"D","text":"Develop custom ETL pipelines to ingest data into Databricks"}],"correct":["B"],"explanation":"Lakehouse Federation consulta sistemas externos sin necesidad de ingerir y duplicar previamente todos sus datos en Delta.","issue":null,"scorable":true,"category":"Gobierno / Sharing","answerWhy":"Lakehouse Federation consulta sistemas externos sin necesidad de ingerir y duplicar previamente todos sus datos en Delta.","wrongWhy":{"A":"Exportar/copiar CSV duplica datos y desactualiza la información entre syncs.","C":"Una sincronización manual duplica datasets y aumenta mantenimiento.","D":"ETL propio duplica datos y el enunciado pide precisamente evitarlo."},"sourceLinks":[{"label":"Documentación de Databricks","url":"https://docs.databricks.com/aws/en/"}]},{"id":185,"topic":"Exam A","question":"A data engineer is working in a Python notebook on Databricks to process data, but notices that the output is not as\n  expected. The data engineer wants to investigate the issue by stepping through the code and checking the values of\n  certain variables during execution.\n\n\n  Which tool should the data engineer use to inspect the code execution and variables in real-time?","options":[{"key":"A","text":"Cluster Logs"},{"key":"B","text":"Job Execution Dashboard"},{"key":"C","text":"Python Notebook Interactive Debugger"},{"key":"D","text":"SQL Analytics"}],"correct":["C"],"explanation":"El depurador interactivo de Python permite colocar breakpoints y revisar valores de variables durante la ejecución de notebooks.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El depurador interactivo de Python permite colocar breakpoints y revisar valores de variables durante la ejecución de notebooks.","wrongWhy":{"A":"Los logs no sustituyen ejecución paso a paso.","B":"La vista de Jobs muestra estado, no inspección local de variables.","D":"SQL Analytics no es el debugger de notebooks Python."},"sourceLinks":[{"label":"Calidad: expectations y violaciones","url":"https://docs.databricks.com/aws/en/ldp/expectations"}]},{"id":186,"topic":"Exam A","question":"A data engineer has inherited a Databricks pipeline from a previous team. The pipeline is missing its SLAs, and an initial\n  investigation has identified memory spills in Spark. These increased runtimes are also driving up costs. The data engineer\n  needs to reduce the runtime without significantly increasing costs.\n\n\n  What should the data engineer do first to address this issue?","options":[{"key":"A","text":"Tweak the \"spark.sql.shuffle.partitions\" configuration."},{"key":"B","text":"Enable autoscaling in the cluster to match the requirements"},{"key":"C","text":"Use a photon enabled execution engine."},{"key":"D","text":"Ensure the cluster uses memory optimized node types."}],"correct":["A"],"explanation":"La Spark UI ayuda a localizar cuellos de botella de CPU, shuffle, spill, skew y memoria. El driver sufre al recoger datos localmente; los executors y el particionamiento afectan a los joins distribuidos.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"La Spark UI ayuda a localizar cuellos de botella de CPU, shuffle, spill, skew y memoria. El driver sufre al recoger datos localmente; los executors y el particionamiento afectan a los joins distribuidos.","wrongWhy":{"B":"Autoscaling no corrige por sí mismo particiones de shuffle demasiado grandes.","C":"Photon no garantiza solucionar un spill por mala granularidad.","D":"Más memoria incrementa coste y no es la primera optimización."},"sourceLinks":[{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":187,"topic":"Exam A","question":"A data engineer is facing performance bottlenecks in an e-commerce transactions Delta table. The table is a managed\n  Unity Catalog table, and it uses partitioning and Z-ordering in its data layout scheme. The predictive optimization for Unity\n  Catalog tables is also enabled. The table has a frequently changing query filter, and the data engineer does not observe a\n  benefit of the Data Layout or the Predictive Optimization.\n\n\n  How should the data engineer fix the data layout bottlenecks?","options":[{"key":"A","text":"Re-write the Data Layout with Liquid Clustering and cluster by the Z-Ordered columns."},{"key":"B","text":"Enable Delta Caching so that query results can be read through caches."},{"key":"C","text":"Tweak the Z-Order columns and run OPTIMIZE manually."},{"key":"D","text":"Switch the Data layout from Partition+Z-Ordering to Automatic Liquid Clustering."}],"correct":["D"],"explanation":"OPTIMIZE reorganiza/compacta archivos Delta para mejorar lecturas; Liquid Clustering y predictive optimization gestionan el layout de forma más automática. DESCRIBE HISTORY permite revisar operaciones registradas.","issue":"Con una tabla UC gobernada y patrones de acceso cambiantes, Automatic Liquid Clustering puede adaptar la organización física. Este enunciado prácticamente duplica 183, pero el PDF le asigna otra clave; hay inconsistencia.","scorable":true,"category":"Delta Lake","answerWhy":"Con una tabla UC gobernada y patrones de acceso cambiantes, Automatic Liquid Clustering puede adaptar la organización física. Este enunciado prácticamente duplica 183, pero el PDF le asigna otra clave; hay inconsistencia.","wrongWhy":{"A":"Fijar antiguas claves Z-ORDER puede ser ineficiente cuando filtros cambian.","B":"Cache acelera algunas repeticiones, pero no rediseña layout persistentemente.","C":"Optimización manual por Z-ORDER obliga a mantenimiento y no se adapta tan bien a consultas cambiantes."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Liquid clustering","url":"https://docs.databricks.com/aws/en/delta/clustering"},{"label":"Spark SQL","url":"https://docs.databricks.com/aws/en/sql/language-manual/"}]},{"id":188,"topic":"Exam A","question":"A data engineer needs to optimize the data layout and query performance for an e-commerce transactions Delta table.\n  The table is partitioned by \"purchase_date\" a date column which helps with time-based queries but does not optimize\n  searches on user statistics \"customer_id\", a high-cardinality column.\n\n\n  The table is usually queried with filters on \"customer_id\" within specific date ranges, but since this data is spread across\n  multiple files in each partition, it results in full partition scans and increased runtime and costs.\n\n\n  How should the data engineer optimize the Data Layout for efficient reads?","options":[{"key":"A","text":"Alter table implementing liquid clustering on \"customer_id\" while keeping the existing partitioning."},{"key":"B","text":"Alter the table implementing liquid clustering by \"customer_id\" and \"purchase_date\"."},{"key":"C","text":"Alter the table to partition by \"customer_id\"."},{"key":"D","text":"Enable delta caching on the cluster so that frequent reads are cached for performance."}],"correct":["B"],"explanation":"OPTIMIZE reorganiza/compacta archivos Delta para mejorar lecturas; Liquid Clustering y predictive optimization gestionan el layout de forma más automática. DESCRIBE HISTORY permite revisar operaciones registradas.","issue":null,"scorable":true,"category":"Delta Lake","answerWhy":"Liquid clustering normalmente sustituye el particionamiento clásico, no lo conserva. Para filtrar por customer_id y purchase_date se recomienda analizar esas dos columnas como clustering keys.","wrongWhy":{"A":"Liquid Clustering no debe combinarse con el particionamiento clásico existente tal cual; sustituye el esquema físico.","C":"Particionar por customer_id tiene cardinalidad excesiva: crea muchas particiones pequeñas.","D":"Cachear ayuda a consultas repetidas, pero no corrige el layout ni la dispersión de archivos."},"sourceLinks":[{"label":"Liquid clustering","url":"https://docs.databricks.com/aws/en/delta/clustering"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"},{"label":"Compute","url":"https://docs.databricks.com/aws/en/compute/"}]},{"id":189,"topic":"Exam A","question":"What is the structure of an Asset Bundle?","options":[{"key":"A","text":"A Docker image containing runtime environments and the source code of the assets"},{"key":"B","text":"A compressed archive (ZIP) that solely contains workspace assets without any accompanying metadata"},{"key":"C","text":"A single plain text file enumerating the names of assets to be migrated to a new workspace"},{"key":"D","text":"A YAML configuration file that specifies the artifacts, resources, and configurations for the project"}],"correct":["D"],"explanation":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","wrongWhy":{"A":"No es una imagen Docker; el bundle declara recursos y archivos de código.","B":"Un ZIP de assets sin metadatos no define targets/jobs/configuración.","C":"Una lista plana de nombres no codifica las propiedades de recursos y entorno."},"sourceLinks":[{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"}]},{"id":190,"topic":"Exam A","question":"A data engineer is maintaining an ETL pipeline code with a GitHub repository linked to their Databricks account. The data\n  engineer wants to deploy the ETL pipeline to production as a databricks workflow.\n\n\n  Which approach should the data engineer use?","options":[{"key":"A","text":"Databricks Asset Bundles (DAB) + GitHub Integration"},{"key":"B","text":"Maintain workflow_config.json and deploy it using Databricks CLI"},{"key":"C","text":"Maintain workflow_config.json and deploy it using Terraform"},{"key":"D","text":"Manually create and manage the workflow in UI"}],"correct":["A"],"explanation":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","issue":null,"scorable":true,"category":"Jobs / DevOps","answerWhy":"Databricks Asset/Declarative Automation Bundles define recursos y entornos en YAML (databricks.yml). La CLI permite validar, desplegar y ejecutar usando targets y variables.","wrongWhy":{"B":"Mantener un JSON a mano no es el mecanismo recomendado para un proyecto versionable completo.","C":"Terraform puede gestionar recursos, pero el curso centra promoción de workloads en DAB+Git.","D":"Cambios manuales en UI impiden CI/CD reproducible."},"sourceLinks":[{"label":"Bundles: configuración y entornos","url":"https://docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Databricks Jobs","url":"https://docs.databricks.com/aws/en/jobs/"}]},{"id":191,"topic":"Exam A","question":"A data engineer works for an organization that must meet a stringent Service Level Agreement (SLA) that demands\n  minimal runtime errors and high availability for its data processing pipelines. The data engineer wants to avoid the\n  operational overhead of managing and tuning clusters.\n\n\n  Which architectural solution will meet the requirements?","options":[{"key":"A","text":"Use an auto-scaling cluster configured and monitored by the user."},{"key":"B","text":"Implement a hybrid approach with scheduled batch jobs on custom cloud VMs."},{"key":"C","text":"Deploy a dedicated, manually managed cluster optimized by in-house IT staff."},{"key":"D","text":"Utilize Databricks serverless compute that automatically optimizes resources and abstracts cluster management."}],"correct":["D"],"explanation":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","issue":null,"scorable":true,"category":"Compute / Spark","answerWhy":"El tipo de compute se elige según latencia de arranque, concurrencia, coste y carga: pools reducen tiempos de aprovisionamiento, serverless abstrae el dimensionamiento, y job compute se adapta a tareas programadas.","wrongWhy":{"A":"El autoscaling clásico reduce ciertos trabajos, pero aún exige configurar y operar el cluster.","B":"VMs propias multiplican tareas de mantenimiento.","C":"Cluster manual dedicado no minimiza overhead de disponibilidad ni ajustes."},"sourceLinks":[{"label":"Unity Catalog: privilegios","url":"https://docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"label":"Data engineering / Lakeflow","url":"https://docs.databricks.com/aws/en/ldp/"},{"label":"Delta Lake","url":"https://docs.databricks.com/aws/en/delta/"}]},{"id":192,"topic":"Exam A","question":"A data engineer wants to reduce costs and optimize cloud spending. The data engineer has decided to use Databricks\n  Serverless for lowering cloud costs while maintaining existing SLAs.\n\n\n  What is the first step in migrating to Databricks Serverless?","options":[{"key":"A","text":"Legacy Ingestion pipelines that include ingestion from sources API’s, files, JDBC/ODBC connections"},{"key":"B","text":"A frequently running and efficient Python-based data transformation pipeline compatible with the latest Databricks\n\n     runtime and Unity Catalog"},{"key":"C","text":"A frequently running and efficient Scala-based data transformation pipeline compatible with the latest Databr
